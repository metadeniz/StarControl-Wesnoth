#textdomain wesnoth-Star_Control_TC
# The space maps: two original 2p maps (mirror images left to right) and
# maps converted from core Wesnoth.

#define SC_SPACE_TIME
    [time]
        id=sc_deep_space
        name= _ "Deep Space"
        image=misc/time-schedules/schedule-underground.png
        lawful_bonus=0
    [/time]
#enddef

# Star Control II's Alliance race themes in rotation, and its victory music.
#define SC_MUSIC
    [music]
        name=sc/commander.ogg
        shuffle=yes
    [/music]
    [music]
        name=sc/yehat.ogg
        append=yes
    [/music]
    [music]
        name=sc/syreen.ogg
        append=yes
    [/music]
    [music]
        name=sc/arilou.ogg
        append=yes
    [/music]
    [music]
        name=sc/shofixti.ogg
        append=yes
    [/music]
    [music]
        name=sc/victory.ogg
        append=yes
    [/music]
    victory_music=sc/victory-fanfare.ogg
#enddef

#   T1/T2: team ids, T1_NAME/T2_NAME: their names, EXTRA: more scenario WML
#define SC_2P_SCENARIO_WITH ID NAME MAP DESCRIPTION T1 T1_NAME T2 T2_NAME EXTRA
    [multiplayer]
        id={ID}
        name={NAME}
        description={DESCRIPTION}
        map_data="{~add-ons/Star_Control_TC/maps/{MAP}.map}"
        random_start_time=no
        allow_era=SC_Era_UrQuan_War
        {SC_SPACE_TIME}
        {SC_MUSIC}
        [side]
            side=1
            canrecruit=yes
            controller=human
            team_name={T1}
            user_team_name={T1_NAME}
            fog=yes
        [/side]
        [side]
            side=2
            canrecruit=yes
            controller=human
            team_name={T2}
            user_team_name={T2_NAME}
            fog=yes
        [/side]
        {EXTRA}
    [/multiplayer]
#enddef

#define SC_2P_SCENARIO ID NAME MAP DESCRIPTION
    {SC_2P_SCENARIO_WITH {ID} {NAME} {MAP} {DESCRIPTION} west ( _ "teamname^West") east ( _ "teamname^East") ()}
#enddef

{SC_2P_SCENARIO SC_2p_Procyon_Front (_ "2p — Procyon Front") 2p_Procyon_Front (_ "A lone star holds the centre of this front line. Planets are scattered on both flanks, with nebulae to slip through and asteroid fields to hide in. Design: Star Control TC.")}
{SC_2P_SCENARIO SC_2p_Vela_Nebula (_ "2p — Vela Nebula") 2p_Vela_Nebula (_ "A great nebula splits the map from top to bottom. Two stars and their asteroid belts guard the richest planets, deep inside the gas.")}

# Maps from core Wesnoth, converted hex for hex by tools/convert_map.py:
# forests became nebulae, rivers and lakes badlands, hills asteroid fields,
# villages planets; impassable walls became asteroid walls (a lone
# impassable hex, a star).
{SC_2P_SCENARIO_WITH SC_2p_The_Freelands (_ "2p — The Freelands (Deep Space)") 2p_The_Freelands (_ "The Freelands from core Wesnoth, rebuilt in space: a wide-open field of planets with few obstacles, where fleets meet early and fight in the open. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}
{SC_2P_SCENARIO_WITH SC_2p_Weldyn_Channel (_ "2p — Weldyn Channel (Deep Space)") 2p_Weldyn_Channel (_ "Weldyn Channel from core Wesnoth, rebuilt in space: a long river of badlands splits the map, crossed only at a few calm passages. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}
{SC_2P_SCENARIO_WITH SC_2p_Fallenstar_Lake (_ "2p — Fallenstar Lake (Deep Space)") 2p_Fallenstar_Lake (_ "Fallenstar Lake from core Wesnoth, rebuilt in space: thin badlands fill the crater where a star fell, ringed by asteroid walls and nebulae. West vs. east.") west ( _ "teamname^West") east ( _ "teamname^East") ()}

# Caves of the Basilisk: the statues became derelict ships, petrified hulks
# of an old battle that block their hexes like the statues did.
#define SC_DERELICT TYPE X Y
    [unit]
        type={TYPE}
        name= _ "Derelict"
        x={X}
        y={Y}
        unrenamable=yes
        random_traits=no
        [status]
            petrified=yes
        [/status]
        [modifications]
            [trait]
                id=sc_derelict
                [effect]
                    apply_to=movement
                    set=0
                [/effect]
                [effect]
                    apply_to=ellipse
                    ellipse=none
                [/effect]
            [/trait]
        [/modifications]
    [/unit]
#enddef

{SC_2P_SCENARIO_WITH SC_2p_Caves_of_the_Basilisk (_ "2p — Caves of the Basilisk (Deep Space)") 2p_Caves_of_the_Basilisk (_ "Caves of the Basilisk from core Wesnoth, rebuilt in space: an asteroid-walled den where something once turned whole fleets to stone. Their derelict hulks still drift where they died, blocking the way. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") (
    [side]
        side=3
        color=black
        canrecruit=no
        controller=null
        allow_player=no
        disallow_observers=yes
        no_leader=yes
        hidden=yes
        controller_lock=yes
        faction_lock=yes
        leader_lock=yes
        team_lock=yes
        gold_lock=yes
        income_lock=yes
        team_name=derelicts
        user_team_name= _ "teamname^Derelicts"
        {SC_DERELICT SC_Yehat_Terminator_L2 27 14}
        {SC_DERELICT SC_Ilwrath_Avenger 40 8}
        {SC_DERELICT SC_Androsynth_Guardian 39 8}
        {SC_DERELICT SC_Arilou_Skiff 2 11}
        {SC_DERELICT SC_Spathi_Eluder 8 18}
        {SC_DERELICT SC_UrQuan_Dreadnought_L3 8 13}
        {SC_DERELICT SC_Mycon_Podship_L2 22 12}
        {SC_DERELICT SC_Umgah_Drone 37 17}
        {SC_DERELICT SC_Syreen_Penetrator 5 8}
        {SC_DERELICT SC_Chenjesu_Broodhome_L3 25 14}
        {SC_DERELICT SC_Mmrnmhrm_XForm_L2 34 6}
        {SC_DERELICT SC_VUX_Intruder_L3 34 11}
        {SC_DERELICT SC_Earthling_Cruiser_L3 15 11}
        {SC_DERELICT SC_Shofixti_Scout 20 12}
        {SC_DERELICT SC_Androsynth_Guardian_L2 17 11}
    [/side]
)}

#undef SC_DERELICT

#define SC_4P_SIDE SIDE TEAM TEAM_NAME
        [side]
            side={SIDE}
            canrecruit=yes
            controller=human
            team_name={TEAM}
            user_team_name={TEAM_NAME}
            gold=75
            fog=yes
            [ai]
                villages_per_scout=16
            [/ai]
        [/side]
#enddef

# Isar's Cross from core Wesnoth (by Becephalus), converted hex for hex by
# tools/convert_map.py: rivers became badlands, forests nebulae, hills
# asteroid fields, villages planets.
[multiplayer]
    id=SC_4p_Isars_Cross
    name= _ "4p — Isar’s Cross (Deep Space)"
    description= _ "The classic Isar’s Cross, rebuilt in space: a very small 2 vs. 2 map where a ring of badlands circles the central nebulae. Close quarters fighting means rotating ships and planning moves is everything. Teams are players 1 &amp; 4 vs. 2 &amp; 3 (southwest vs. northeast). Designed for 75 starting gold, 20 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Isars_Cross.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 south-west ( _ "teamname^Southwest")}
    {SC_4P_SIDE 2 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 3 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 4 south-west ( _ "teamname^Southwest")}
[/multiplayer]

#undef SC_4P_SIDE
#undef SC_2P_SCENARIO
#undef SC_MUSIC
#undef SC_SPACE_TIME
