#textdomain wesnoth-Star_Control_TC
# The space maps: two original 2p maps (mirror images left to right) and
# maps converted from core Wesnoth.

#define SC_SPACE_TIME
    [time]
        id=sc_deep_space
        name= _ "Deep Space"
        image=misc/time-schedules/schedule-underground.png
        lawful_bonus=0
    [/time]
#enddef

# Star Control II's Alliance race themes in rotation, and its victory music.
#define SC_MUSIC
    [music]
        name=sc/1. commander.ogg
        shuffle=yes
    [/music]
    [music]
        name=sc/1. chenjesu-titus.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. mmrnmhrm-titus.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. yehat.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. syreen.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. arilou.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. shofixti.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. quasispace.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. quasispace-3do.ogg
        append=yes
    [/music]
    [music]
        name=sc/1. victory.ogg
        append=yes
    [/music]
    # silence: the victory theme is played as a sound effect (sc.victory_theme)
    victory_music=sc/0. silence.ogg
#enddef

#   T1/T2: team ids, T1_NAME/T2_NAME: their names, EXTRA: more scenario WML
#define SC_2P_SCENARIO_WITH ID NAME MAP DESCRIPTION T1 T1_NAME T2 T2_NAME EXTRA
    [multiplayer]
        id={ID}
        name={NAME}
        description={DESCRIPTION}
        map_data="{~add-ons/Star_Control_TC/maps/{MAP}.map}"
        random_start_time=no
        allow_era=SC_Era_UrQuan_War
        {SC_SPACE_TIME}
        {SC_MUSIC}
        [side]
            side=1
            canrecruit=yes
            controller=human
            team_name={T1}
            user_team_name={T1_NAME}
            fog=yes
        [/side]
        [side]
            side=2
            canrecruit=yes
            controller=human
            team_name={T2}
            user_team_name={T2_NAME}
            fog=yes
        [/side]
        {EXTRA}
    [/multiplayer]
#enddef

#define SC_2P_SCENARIO ID NAME MAP DESCRIPTION
    {SC_2P_SCENARIO_WITH {ID} {NAME} {MAP} {DESCRIPTION} west ( _ "teamname^West") east ( _ "teamname^East") ()}
#enddef

{SC_2P_SCENARIO SC_2p_Procyon_Front (_ "2p — Procyon Front") 2p_Procyon_Front (_ "A lone star holds the centre of this front line. Planets are scattered on both flanks, with nebulae to slip through and asteroid fields to hide in. Design: Star Control TC.")}
{SC_2P_SCENARIO SC_2p_Vela_Nebula (_ "2p — Vela Nebula") 2p_Vela_Nebula (_ "A great nebula splits the map from top to bottom. Two stars and their asteroid belts guard the richest planets, deep inside the gas.")}

# Understanding Power: traced from a 2-player ground map by
# tools/make_understanding_power.py, the south half the north half turned
# 180 degrees.
{SC_2P_SCENARIO_WITH SC_2p_Understanding_Power (_ "2p — Understanding Power") 2p_Understanding_Power (_ "Rivers of light badlands wind past two long badland lakes on the flanks. Debris disks break the field into lanes, the richest planets sit in asteroid mining fields, and a spiral of debris disks in a cloud of nebulae holds the centre. Northwest vs. southeast.") northwest ( _ "teamname^Northwest") southeast ( _ "teamname^Southeast") ()}
{SC_2P_SCENARIO_WITH SC_2p_Understanding_Power_Small (_ "2p — Understanding Power (Small)") 2p_Understanding_Power_Small (_ "Understanding Power shrunk to half its area by tools/make_understanding_power_small.py: the same rivers, lakes, debris disks and castles, packed close. Northwest vs. southeast.") northwest ( _ "teamname^Northwest") southeast ( _ "teamname^Southeast") ()}

# Maps from core Wesnoth, converted hex for hex by tools/convert_map.py:
# forests became nebulae, shallow water and swamp light badlands, deep
# water badlands, hills asteroid fields,
# villages planets; impassable walls became debris disks (a lone
# impassable hex, a star).
{SC_2P_SCENARIO_WITH SC_2p_The_Freelands (_ "2p — The Freelands (Deep Space)") 2p_The_Freelands (_ "The Freelands from core Wesnoth, rebuilt in space: a wide-open field of planets with few obstacles, where fleets meet early and fight in the open. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}
{SC_2P_SCENARIO_WITH SC_2p_Weldyn_Channel (_ "2p — Weldyn Channel (Deep Space)") 2p_Weldyn_Channel (_ "Weldyn Channel from core Wesnoth, rebuilt in space: a long river of badlands, deep in the middle and lighter at its edges, splits the map, crossed only at a few calm passages. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}
{SC_2P_SCENARIO_WITH SC_2p_Fallenstar_Lake (_ "2p — Fallenstar Lake (Deep Space)") 2p_Fallenstar_Lake (_ "Fallenstar Lake from core Wesnoth, rebuilt in space: thin badlands fill the crater where a star fell, ringed by debris disks and nebulae. West vs. east.") west ( _ "teamname^West") east ( _ "teamname^East") ()}

# Caves of the Basilisk: where the basilisk's statues stood are Precursor
# ruins (impassable terrain), placed by convert_map.py, see README.
{SC_2P_SCENARIO_WITH SC_2p_Caves_of_the_Basilisk (_ "2p — Caves of the Basilisk (Deep Space)") 2p_Caves_of_the_Basilisk (_ "Caves of the Basilisk from core Wesnoth, rebuilt in space: an asteroid-walled den scattered with the ruins of Precursor structures, still glowing faintly after untold ages. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}

#define SC_4P_SIDE SIDE TEAM TEAM_NAME
        [side]
            side={SIDE}
            canrecruit=yes
            controller=human
            team_name={TEAM}
            user_team_name={TEAM_NAME}
            gold=75
            fog=yes
            [ai]
                villages_per_scout=16
            [/ai]
        [/side]
#enddef

# Isar's Cross from core Wesnoth (by Becephalus), converted hex for hex by
# tools/convert_map.py: rivers became light badlands, forests nebulae, hills
# asteroid fields, villages planets.
[multiplayer]
    id=SC_4p_Isars_Cross
    name= _ "4p — Isar’s Cross (Deep Space)"
    description= _ "The classic Isar’s Cross, rebuilt in space: a very small 2 vs. 2 map where a ring of light badlands circles the central nebulae. Close quarters fighting means rotating ships and planning moves is everything. Teams are players 1 &amp; 4 vs. 2 &amp; 3 (southwest vs. northeast). Designed for 75 starting gold, 20 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Isars_Cross.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 south-west ( _ "teamname^Southwest")}
    {SC_4P_SIDE 2 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 3 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 4 south-west ( _ "teamname^Southwest")}
[/multiplayer]

# Manufacturing Consent: traced from a 4-player ground map by
# tools/make_manufacturing_consent.py, mirrored west to east and north to
# south.
[multiplayer]
    id=SC_4p_Manufacturing_Consent
    name= _ "4p — Manufacturing Consent"
    description= _ "Two fleets hold the west edge and two the east. Debris disks break the field into lanes, the richest planets sit in asteroid fields, and a broken ring of debris disks guards the planet in the centre. Teams are players 1 &amp; 3 (west) vs. 2 &amp; 4 (east). Designed for 75 starting gold, 27 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Manufacturing_Consent.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 west ( _ "teamname^West")}
    {SC_4P_SIDE 2 east ( _ "teamname^East")}
    {SC_4P_SIDE 3 west ( _ "teamname^West")}
    {SC_4P_SIDE 4 east ( _ "teamname^East")}
[/multiplayer]

# Media Control: traced from a 4-player ground map by
# tools/make_media_control.py, turned four ways about the centre.
[multiplayer]
    id=SC_4p_Media_Control
    name= _ "4p — Media Control"
    description= _ "Four fleets, one in each corner, each starting behind a river of light badlands with two fords out. Dark nebulae, radiation, plasma storms, gravity eddies and dark stars break the field into lanes, the richest planets sit in asteroid fields, and a ring of dust circles the planet in the centre, which sits in a moat of light badlands between two small starbases; more small starbases stand by the dark stars. Players are numbered 1 to 4 clockwise from the northwest; teams are 1 &amp; 3 (northwest and southeast) vs. 2 &amp; 4 (northeast and southwest). Designed for 75 starting gold, 21 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Media_Control.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 nw-se ( _ "teamname^Northwest and Southeast")}
    {SC_4P_SIDE 2 ne-sw ( _ "teamname^Northeast and Southwest")}
    {SC_4P_SIDE 3 nw-se ( _ "teamname^Northwest and Southeast")}
    {SC_4P_SIDE 4 ne-sw ( _ "teamname^Northeast and Southwest")}
[/multiplayer]

#undef SC_4P_SIDE
#undef SC_2P_SCENARIO
#undef SC_MUSIC
#undef SC_SPACE_TIME
