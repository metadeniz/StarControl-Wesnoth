    {SC_4P_SIDE 3 odd ( _ "teamname^North, Southeast and Southwest")}
    {SC_4P_SIDE 4 even ( _ "teamname^Northeast, South and Northwest")}
    {SC_4P_SIDE 5 odd ( _ "teamname^North, Southeast and Southwest")}
    {SC_4P_SIDE 6 even ( _ "teamname^Northeast, South and Northwest")}
[/multiplayer]

