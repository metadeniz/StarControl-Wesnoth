#textdomain wesnoth-Star_Control_TC
# The space maps: two original 2p maps (mirror images left to right) and
# maps converted from core Wesnoth.

#define SC_SPACE_TIME
    [time]
        id=sc_deep_space
        name= _ "Deep Space"
        image=misc/time-schedules/schedule-underground.png
        lawful_bonus=0
    [/time]
#enddef

# Star Control II's Alliance race themes in rotation, and its victory music.
#define SC_MUSIC
    [music]
        name="sc/1. commander.ogg"
        shuffle=yes
    [/music]
    [music]
        name="sc/1. chenjesu-titus.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. mmrnmhrm-titus.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. yehat.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. syreen.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. arilou.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. shofixti.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. quasispace.ogg"
        append=yes
    [/music]
    [music]
        name="sc/1. quasispace-3do.ogg"
        append=yes
    [/music]
    # silence: the victory theme is played as a sound effect (sc.victory_theme)
    victory_music="sc/0. silence.ogg"
#enddef

#   T1/T2: team ids, T1_NAME/T2_NAME: their names, EXTRA: more scenario WML
#define SC_2P_SCENARIO_WITH ID NAME MAP DESCRIPTION T1 T1_NAME T2 T2_NAME EXTRA
    [multiplayer]
        id={ID}
        name={NAME}
        description={DESCRIPTION}
        map_data="{~add-ons/Star_Control_TC/maps/{MAP}.map}"
        random_start_time=no
        allow_era=SC_Era_UrQuan_War
        {SC_SPACE_TIME}
        {SC_MUSIC}
        [side]
            side=1
            canrecruit=yes
            controller=human
            team_name={T1}
            user_team_name={T1_NAME}
            fog=yes
        [/side]
        [side]
            side=2
            canrecruit=yes
            controller=human
            team_name={T2}
            user_team_name={T2_NAME}
            fog=yes
        [/side]
        {EXTRA}
    [/multiplayer]
#enddef

#define SC_2P_SCENARIO ID NAME MAP DESCRIPTION
    {SC_2P_SCENARIO_WITH {ID} {NAME} {MAP} {DESCRIPTION} west ( _ "teamname^West") east ( _ "teamname^East") ()}
#enddef

{SC_2P_SCENARIO SC_2p_Procyon_Front (_ "2p — Procyon Front") 2p_Procyon_Front (_ "A lone star holds the centre of this front line. Planets are scattered on both flanks, with nebulae to slip through and asteroid fields to hide in. Design: Star Control TC.")}
{SC_2P_SCENARIO SC_2p_Vela_Nebula (_ "2p — Vela Nebula") 2p_Vela_Nebula (_ "A great nebula splits the map from top to bottom. Two stars and their asteroid belts guard the richest planets, deep inside the gas.")}

# Understanding Power: traced from a 2-player ground map by
# tools/make_understanding_power.py, the south half the north half turned
# 180 degrees.
{SC_2P_SCENARIO_WITH SC_2p_Understanding_Power (_ "2p — Understanding Power") 2p_Understanding_Power (_ "Rivers of light badlands wind past two long badland lakes on the flanks. Debris disks break the field into lanes, the richest planets sit in asteroid mining fields, and a spiral of debris disks in a cloud of nebulae holds the centre. Northwest vs. southeast.") northwest ( _ "teamname^Northwest") southeast ( _ "teamname^Southeast") ()}
{SC_2P_SCENARIO_WITH SC_2p_Understanding_Power_Small (_ "2p — Understanding Power (Small)") 2p_Understanding_Power_Small (_ "Understanding Power shrunk to half its area by tools/make_understanding_power_small.py: the same rivers, lakes, debris disks and castles, packed close. Northwest vs. southeast.") northwest ( _ "teamname^Northwest") southeast ( _ "teamname^Southeast") ()}

# Maps from core Wesnoth, converted hex for hex by tools/convert_map.py:
# forests became nebulae, shallow water and swamp light badlands, deep
# water badlands, hills asteroid fields,
# villages planets; impassable walls became debris disks (a lone
# impassable hex, a star).
{SC_2P_SCENARIO_WITH SC_2p_The_Freelands (_ "2p — The Freelands (Deep Space)") 2p_The_Freelands (_ "The Freelands from core Wesnoth, rebuilt in space: a wide-open field of planets with few obstacles, where fleets meet early and fight in the open. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}
{SC_2P_SCENARIO_WITH SC_2p_Weldyn_Channel (_ "2p — Weldyn Channel (Deep Space)") 2p_Weldyn_Channel (_ "Weldyn Channel from core Wesnoth, rebuilt in space: a long river of badlands, deep in the middle and lighter at its edges, splits the map, crossed only at a few calm passages. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}
{SC_2P_SCENARIO_WITH SC_2p_Fallenstar_Lake (_ "2p — Fallenstar Lake (Deep Space)") 2p_Fallenstar_Lake (_ "Fallenstar Lake from core Wesnoth, rebuilt in space: thin badlands fill the crater where a star fell, ringed by debris disks and nebulae. West vs. east.") west ( _ "teamname^West") east ( _ "teamname^East") ()}

# Isar's Cross for two: the 4p map with the west and east arms cut away
# outside the badlands (columns 7 to 19 of the 4p map kept), north vs. south.
{SC_2P_SCENARIO_WITH SC_2p_Isars_Cross (_ "2p — Isar’s Cross (Deep Space)") 2p_Isars_Cross (_ "The classic Isar’s Cross, rebuilt in space and cut down for two: the west and east arms are gone, leaving the north and south starbases facing each other across the ring of light badlands around the central nebulae. North vs. south. Designed for 16 planets.") north ( _ "teamname^North") south ( _ "teamname^South") ()}

# Caves of the Basilisk: where the basilisk's statues stood are Precursor
# ruins (impassable terrain), placed by convert_map.py, see README.
{SC_2P_SCENARIO_WITH SC_2p_Caves_of_the_Basilisk (_ "2p — Caves of the Basilisk (Deep Space)") 2p_Caves_of_the_Basilisk (_ "Caves of the Basilisk from core Wesnoth, rebuilt in space: an asteroid-walled den scattered with the ruins of Precursor structures, still glowing faintly after untold ages. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}

# Silverhead Crossing and Ruphus Isle, converted the same way (the
# converter keeps Ruphus Isle's fake map edge). Silverhead's Nani the
# Shapeshifter, a hidden monster in core Wesnoth, is left out. In Ruphus
# Isle the south starts owning one planet, as in the original.
{SC_2P_SCENARIO_WITH SC_2p_Silverhead_Crossing (_ "2p — Silverhead Crossing (Deep Space)") 2p_Silverhead_Crossing (_ "Silverhead Crossing from core Wesnoth, rebuilt in space: a multi-fronted duel across badland rivers, asteroid walls and the drifting ruins of old docking rings. West vs. east.") west ( _ "teamname^West") east ( _ "teamname^East") ()}
{SC_2P_SCENARIO_WITH SC_2p_Ruphus_Isle (_ "2p — Ruphus Isle (Deep Space)") 2p_Ruphus_Isle (_ "Ruphus Isle from core Wesnoth, rebuilt in space: a small, dense pocket of nebulae, asteroids and lone stars, surrounded by badlands. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") (
    [event]
        name=prestart
        [capture_village]
            x,y=17,23
            side=2
        [/capture_village]
    [/event]
)}

# The Hamlets by Doc Paterson, converted the same way: its many fords
# became thin badlands. As in the original, the south starts owning one
# planet.
{SC_2P_SCENARIO_WITH SC_2p_Hamlets (_ "2p — The Hamlets (Deep Space)") 2p_Hamlets (_ "The Hamlets by Doc Paterson, rebuilt in space: streams of thin badlands parcel a quiet sector into small pockets of planets, walled by nebulae and asteroid fields. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") (
    [event]
        name=prestart
        [capture_village]
            x,y=22,27
            side=2
        [/capture_village]
    [/event]
)}

# Swamp of Dread, converted the same way. As in the original, the south
# starts owning one planet.
{SC_2P_SCENARIO_WITH SC_2p_Swamp_of_Dread (_ "2p — Swamp of Dread (Deep Space)") 2p_Swamp_of_Dread (_ "Swamp of Dread from core Wesnoth, rebuilt in space: a vast mire of light and thin badlands, crossed by only a few open lanes, with nebulae, asteroid fields and debris disks strewn through it. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") (
    [event]
        name=prestart
        [capture_village]
            x,y=6,23
            side=2
        [/capture_village]
    [/event]
)}

# Hornshark Island, converted the same way. Core Wesnoth's faction-specific
# guardians around the island are left out. As in the original, each side
# starts at an outlying docking ring and crosses to a starbase by its lane.
{SC_2P_SCENARIO_WITH SC_2p_Hornshark_Island (_ "2p — Hornshark Island (Deep Space)") 2p_Hornshark_Island (_ "Hornshark Island from core Wesnoth, rebuilt in space: a crowded pocket of nebulae, asteroid fields and debris disks, cut through by streams of thin badlands. Each side starts at an outlying docking ring and must cross to one of the starbases. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}

# Thousand Stings Garrison, converted the same way. Where its scorpion
# statues stood, along the edges, are gravity eddies with a few black holes
# (impassable), placed by convert_map.py, see README. The north starts owning one planet, as in the
# original.
{SC_2P_SCENARIO_WITH SC_2p_Thousand_Stings_Garrison (_ "2p — Thousand Stings Garrison (Deep Space)") 2p_Thousand_Stings_Garrison (_ "Thousand Stings Garrison from core Wesnoth, rebuilt in space: a field crossed by thin badlands, ringed by gravity eddies, black holes and the docking rings of many small starbases. South vs. north.") south ( _ "teamname^South") north ( _ "teamname^North") (
    [event]
        name=prestart
        [capture_village]
            x,y=16,3
            side=2
        [/capture_village]
    [/event]
)}

# Howling Ghost Badlands, converted the same way: its fords became thin
# badlands and its central mountain walls an asteroid wall. The burned
# villages, tents and mines the original places as scenery are left out.
# The north (side 2, moving second) starts owning one planet, as in the
# original.
{SC_2P_SCENARIO_WITH SC_2p_Howling_Ghost_Badlands (_ "2p — Howling Ghost Badlands (Deep Space)") 2p_Howling_Ghost_Badlands (_ "Howling Ghost Badlands from core Wesnoth, rebuilt in space: little remains of this once wealthy mining colony, now a haven for raiders and thieves. Rivers of thin badlands wind round its heart, where a newborn star in its disk of dust and rocks lies walled in by asteroids. South vs. north.") south ( _ "teamname^South") north ( _ "teamname^North") (
    [event]
        name=prestart
        [capture_village]
            x,y=3,5
            side=2
        [/capture_village]
    [/event]
)}

# Sablestone Delta, converted the same way: its caves' dark flagstones
# and dirt became open space, its impassable cave walls debris disks,
# each disk of four or more hexes with a one-hex protostar in its middle,
# each in a look of its own.
{SC_2P_SCENARIO_WITH SC_2p_Sablestone_Delta (_ "2p — Sablestone Delta (Deep Space)") 2p_Sablestone_Delta (_ "Sablestone Delta from core Wesnoth, rebuilt in space: a broken field of thin badland streams and ruined docking rings, with planets tucked into pockets behind debris disks where young protostars are still forming. North vs. south.") north ( _ "teamname^North") south ( _ "teamname^South") ()}

# Two custom maps by psydev, converted the same way from the map files.
{SC_2P_SCENARIO_WITH SC_2p_Freds_Fjord (_ "2p — Fred’s Fjord (psydev)") 2p_Freds_Fjord (_ "Fred’s Fjord by psydev, rebuilt in space: badland fjords cut in from two corners, with ridges of dense asteroids along the far edges. Northwest vs. southeast.") northwest ( _ "teamname^Northwest") southeast ( _ "teamname^Southeast") ()}
{SC_2P_SCENARIO_WITH SC_2p_Flashy_Chorus (_ "2p — Flashy Chorus (psydev)") 2p_Flashy_Chorus (_ "Flashy Chorus by psydev, rebuilt in space: a narrow, open field crossed by streams of light badlands, with the bases at opposite ends. South vs. north.") south ( _ "teamname^South") north ( _ "teamname^North") ()}
# Necessary Illusions: a small original map by tools/make_necessary_illusions.py
# (mirrored west to east).
{SC_2P_SCENARIO_WITH SC_2p_Necessary_Illusions (_ "2p — Necessary Illusions") 2p_Necessary_Illusions (_ "A small, close duel. Each starbase sits behind a bend of light badlands with two fords out, and a plasma storm round a sun stands in front of it, so the way to the centre bends round. Rich planets in asteroid fields hold the flanks, a small starbase waits on the south flank, and a planet in a nebula holds the middle inside a ring of light badlands. West vs. east.") west ( _ "teamname^West") east ( _ "teamname^East") ()}

#define SC_4P_SIDE SIDE TEAM TEAM_NAME
        [side]
            side={SIDE}
            canrecruit=yes
            controller=human
            team_name={TEAM}
            user_team_name={TEAM_NAME}
            gold=75
            fog=yes
            [ai]
                villages_per_scout=16
            [/ai]
        [/side]
#enddef

# Isar's Cross from core Wesnoth (by Becephalus), converted hex for hex by
# tools/convert_map.py: rivers became light badlands, forests nebulae, hills
# asteroid fields, villages planets.
[multiplayer]
    id=SC_4p_Isars_Cross
    name= _ "4p — Isar’s Cross (Deep Space)"
    description= _ "The classic Isar’s Cross, rebuilt in space: a very small 2 vs. 2 map where a ring of light badlands circles the central nebulae. Close quarters fighting means rotating ships and planning moves is everything. Teams are players 1 &amp; 4 vs. 2 &amp; 3 (southwest vs. northeast). Designed for 75 starting gold, 20 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Isars_Cross.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 south-west ( _ "teamname^Southwest")}
    {SC_4P_SIDE 2 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 3 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 4 south-west ( _ "teamname^Southwest")}
[/multiplayer]

# Manufacturing Consent: traced from a 4-player ground map by
# tools/make_manufacturing_consent.py, mirrored west to east and north to
# south.
[multiplayer]
    id=SC_4p_Manufacturing_Consent
    name= _ "4p — Manufacturing Consent"
    description= _ "Two fleets hold the west edge and two the east. Debris disks break the field into lanes, the richest planets sit in asteroid fields, and a broken ring of debris disks guards the planet in the centre. Teams are players 1 &amp; 3 (west) vs. 2 &amp; 4 (east). Designed for 75 starting gold, 27 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Manufacturing_Consent.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 west ( _ "teamname^West")}
    {SC_4P_SIDE 2 east ( _ "teamname^East")}
    {SC_4P_SIDE 3 west ( _ "teamname^West")}
    {SC_4P_SIDE 4 east ( _ "teamname^East")}
[/multiplayer]

# Media Control: traced from a 4-player ground map by
# tools/make_media_control.py and turned four ways about the centre, as
# nearly as hexes allow, by tools/make_media_control_4x.py.
[multiplayer]
    id=SC_4p_Media_Control
    name= _ "4p — Media Control"
    description= _ "Four fleets, one in each corner, each starting behind a river of light badlands with two fords out and a small starbase nearby. Dark nebulae, radiation, plasma storms, gravity eddies and dark stars break the field into lanes, a supergiant with rocks floating in front of it stands on each side, each a different colour, the richest planets sit in asteroid fields, and a ring of dust circles the planet in the centre, which sits in a moat of light badlands with a small starbase on each of its four sides. Every corner is as far from the centre and its neighbours as the others. Teams are 1 &amp; 3 vs. 2 &amp; 4; the Starts option puts teammates side by side, north vs. south or west vs. east (the default), in opposite corners, in random corners, or each side in its numbered corner, clockwise from the northwest. Designed for 75 starting gold, 21 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Media_Control.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    [options]
        [combo]
            id=sc_starts
            name= _ "Starts"
            description= _ "Which corner each side starts in. The teams stay as chosen here."
            default=adjacent
            [option]
                name= _ "Teammates side by side (north vs. south or west vs. east)"
                value=adjacent
            [/option]
            [option]
                name= _ "Teammates in opposite corners"
                value=diagonal
            [/option]
            [option]
                name= _ "Random"
                value=random
            [/option]
            [option]
                name= _ "By side number (1 northwest, then clockwise)"
                value=lobby
            [/option]
        [/combo]
    [/options]
    [event]
        name=prestart
        [lua]
            code=<< sc.shuffle_starts() >>
        [/lua]
    [/event]
    {SC_4P_SIDE 1 a ( _ "teamname^Team A")}
    {SC_4P_SIDE 2 b ( _ "teamname^Team B")}
    {SC_4P_SIDE 3 a ( _ "teamname^Team A")}
    {SC_4P_SIDE 4 b ( _ "teamname^Team B")}
[/multiplayer]

# Media Control for six: the 4p map's north-west quarter stretched onto a
# sixth of a hexagon and turned six ways by tools/make_media_control_6p.py.
[multiplayer]
    id=SC_6p_Media_Control
    name= _ "6p — Media Control"
    description= _ "Media Control for six: one corner of the 4p map stretched onto each sixth of a hexagon of space, every corner alike. Each fleet starts in a corner behind a river of light badlands with two fords out and a small starbase nearby; dark nebulae, radiation, dark stars and a supergiant with rocks floating in front of it, each a different colour, break the field into lanes, and a ring of dust circles the planet in the centre, which sits in a moat of light badlands with a small starbase on each of its six sides. Players are numbered 1 to 6 clockwise from the north; teams are 1, 3 &amp; 5 vs. 2, 4 &amp; 6. Designed for 75 starting gold, 31 planets."
    map_data="{~add-ons/Star_Control_TC/maps/6p_Media_Control.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 odd ( _ "teamname^North, Southeast and Southwest")}
    {SC_4P_SIDE 2 even ( _ "teamname^Northeast, South and Northwest")}
    {SC_4P_SIDE 3 odd ( _ "teamname^North, Southeast and Southwest")}
    {SC_4P_SIDE 4 even ( _ "teamname^Northeast, South and Northwest")}
    {SC_4P_SIDE 5 odd ( _ "teamname^North, Southeast and Southwest")}
    {SC_4P_SIDE 6 even ( _ "teamname^Northeast, South and Northwest")}
[/multiplayer]

# The 4p cut of the 6p Media Control, written by the same tool: the north
# and south corners shaved off.
[multiplayer]
    id=SC_4p_Media_Control_Hexagon
    name= _ "4p — Media Control (Hexagon)"
    description= _ "6p Media Control with its north and south corners shaved off, leaving four fleets round a wide middle: the northeast, southeast, southwest and northwest corners stay whole, and most of the north and south sixths, with their supergiants, stars and planets, are open to all. Each start sits behind a river of light badlands with two fords out and a small starbase nearby, and a ring of dust circles the planet in the centre, which sits in a moat of light badlands with a small starbase on each of its six sides. Players are numbered 1 to 4 clockwise from the northeast; teams are east (1 &amp; 2) vs. west (3 &amp; 4). Designed for 75 starting gold, 29 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Media_Control_Hexagon.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 east ( _ "teamname^East")}
    {SC_4P_SIDE 2 east ( _ "teamname^East")}
    {SC_4P_SIDE 3 west ( _ "teamname^West")}
    {SC_4P_SIDE 4 west ( _ "teamname^West")}
[/multiplayer]

