#textdomain wesnoth-Star_Control_TC
# Two-player maps. Both are mirror images left to right.

#define SC_SPACE_TIME
    [time]
        id=sc_deep_space
        name= _ "Deep Space"
        image=misc/time-schedules/schedule-underground.png
        lawful_bonus=0
    [/time]
#enddef

# Star Control II's Alliance race themes in rotation, and its victory music.
#define SC_MUSIC
    [music]
        name=sc/commander.ogg
        shuffle=yes
    [/music]
    [music]
        name=sc/chmmr.ogg
        append=yes
    [/music]
    [music]
        name=sc/yehat.ogg
        append=yes
    [/music]
    [music]
        name=sc/syreen.ogg
        append=yes
    [/music]
    [music]
        name=sc/arilou.ogg
        append=yes
    [/music]
    [music]
        name=sc/shofixti.ogg
        append=yes
    [/music]
    [music]
        name=sc/victory.ogg
        append=yes
    [/music]
    victory_music=sc/victory-fanfare.ogg
#enddef

#define SC_2P_SCENARIO ID NAME MAP DESCRIPTION
    [multiplayer]
        id={ID}
        name={NAME}
        description={DESCRIPTION}
        map_data="{~add-ons/Star_Control_TC/maps/{MAP}.map}"
        random_start_time=no
        allow_era=SC_Era_UrQuan_War
        {SC_SPACE_TIME}
        {SC_MUSIC}
        [side]
            side=1
            canrecruit=yes
            controller=human
            team_name=west
            user_team_name= _ "teamname^West"
            fog=yes
        [/side]
        [side]
            side=2
            canrecruit=yes
            controller=human
            team_name=east
            user_team_name= _ "teamname^East"
            fog=yes
        [/side]
    [/multiplayer]
#enddef

{SC_2P_SCENARIO SC_2p_Procyon_Front (_ "2p — Procyon Front") 2p_Procyon_Front (_ "A lone star holds the centre of this front line. Planets are scattered on both flanks, with nebulae to slip through and asteroid fields to hide in. Design: Star Control TC.")}
{SC_2P_SCENARIO SC_2p_Vela_Nebula (_ "2p — Vela Nebula") 2p_Vela_Nebula (_ "A great nebula splits the map from top to bottom. Two stars and their asteroid belts guard the richest planets, deep inside the gas.")}

#define SC_4P_SIDE SIDE TEAM TEAM_NAME
        [side]
            side={SIDE}
            canrecruit=yes
            controller=human
            team_name={TEAM}
            user_team_name={TEAM_NAME}
            gold=75
            fog=yes
            [ai]
                villages_per_scout=16
            [/ai]
        [/side]
#enddef

# Isar's Cross from core Wesnoth (by Becephalus), converted hex for hex by
# tools/convert_map.py: rivers became badlands, forests nebulae, hills
# asteroid fields, villages planets.
[multiplayer]
    id=SC_4p_Isars_Cross
    name= _ "4p — Isar’s Cross (Deep Space)"
    description= _ "The classic Isar’s Cross, rebuilt in space: a very small 2 vs. 2 map where a ring of badlands circles the central nebulae. Close quarters fighting means rotating ships and planning moves is everything. Teams are players 1 &amp; 4 vs. 2 &amp; 3 (southwest vs. northeast). Designed for 75 starting gold, 20 planets."
    map_data="{~add-ons/Star_Control_TC/maps/4p_Isars_Cross.map}"
    random_start_time=no
    allow_era=SC_Era_UrQuan_War
    {SC_SPACE_TIME}
    {SC_MUSIC}
    {SC_4P_SIDE 1 south-west ( _ "teamname^Southwest")}
    {SC_4P_SIDE 2 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 3 north-east ( _ "teamname^Northeast")}
    {SC_4P_SIDE 4 south-west ( _ "teamname^Southwest")}
[/multiplayer]

#undef SC_4P_SIDE
#undef SC_2P_SCENARIO
#undef SC_MUSIC
#undef SC_SPACE_TIME
