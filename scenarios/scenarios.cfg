{SC_2P_SCENARIO SC_2p_Year_501 (_ "2p — Year 501") 2p_Year_501 (_ "West against east, a starbase on each edge screened by debris disks. Badland lakes guard the homes; plasma storms, gravity eddies, 3-hex supergiants, a dark star, a pulsar, a supermassive black hole and a globular cluster split the middle into lanes, and a starbase waits in the centre inside a ring of light badlands. Three small starbases a side wait forward: in front of the start, with two docking rings, and by the supergiant and the dark star, with one. The north-west and south-west corners, and their mirror images, are cut off the map. Designed for 34 planets.")}

