#textdomain wesnoth-Star_Control_TC
# Star Control 1's nine built-in missions, remade. Named "2p — SC1 Mission
# N: ..." so they sort together, in order. Each game lays out a fresh star
# cluster at the start (lua/sc1.lua), as Star Control 1 did; the map file is
# only the one the lobby shows. Side 1 is always the Hierarchy at the north
# end, side 2 the Alliance at the south. Uses SC_SPACE_TIME and SC_MUSIC
# from scenarios.cfg, which loads first.

# The mission text: Star Control 1's own title, blurb and description.
#   ID: scenario id, MISSION: the mission's key in sc1.missions,
#   NAME: lobby name, BLURB, TEXT: Star Control 1's blurb and description,
#   H_GOLD, A_GOLD: starting starbucks, EXTRA: more scenario WML
#define SC1_MISSION ID MISSION NAME BLURB TEXT H_GOLD A_GOLD EXTRA
    [multiplayer]
        id={ID}
        name={NAME}
        description={BLURB} + "

" + {TEXT} + "

" + _ "As in Star Control 1, the star cluster is laid out afresh every game: planets joined by lanes of open space through the dark nebula. The Hierarchy (side 1) starts at the north end, the Alliance (side 2) at the south."
        map_data="{~add-ons/Star_Control_TC/maps/2p_SC1_Cluster.map}"
        random_start_time=no
        allow_era=SC_Era_UrQuan_War
        {SC_SPACE_TIME}
        {SC_MUSIC}
        [side]
            side=1
            canrecruit=yes
            controller=human
            team_name=hierarchy
            user_team_name= _ "teamname^Hierarchy"
            faction=SC_Hierarchy
            faction_lock=yes
            leader_lock=yes
            type=SC_Hierarchy_Starbase
            gold={H_GOLD}
            fog=yes
            defeat_condition=no_units_left
        [/side]
        [side]
            side=2
            canrecruit=yes
            controller=human
            team_name=alliance
            user_team_name= _ "teamname^Alliance"
            faction=SC_Alliance
            faction_lock=yes
            leader_lock=yes
            type=SC_Alliance_Starbase
            gold={A_GOLD}
            fog=yes
            defeat_condition=no_units_left
        [/side]
        # before the era's own prestart (planet income, Precursor artifacts)
        [event]
            name=prestart
            [lua]
                code=<< sc1.setup((...).mission) >>
                [args]
                    mission={MISSION}
                [/args]
            [/lua]
            [objectives]
                summary={BLURB}
                [objective]
                    description= _ "Destroy every enemy ship and the enemy starbase"
                    condition=win
                [/objective]
                [objective]
                    description= _ "Lose all your ships and your starbase"
                    condition=lose
                [/objective]
                [note]
                    description={TEXT}
                [/note]
            [/objectives]
        [/event]
        {EXTRA}
    [/multiplayer]
#enddef

{SC1_MISSION SC1_Mission_2_First_Encounter first_encounter (_ "2p — SC1 Mission 2: First Encounter") (_ "When spheres of influence meet, battle is inevitable.") (_ "In a far sector along the Coreward Frontier, an Alliance resource development team has encountered a small Hierarchy ravage/reclaim unit. Both commanders face a similar decision: fortify their holdings then expand into enemy space, or make an immediate charge into the enemy’s zone, hoping to disrupt his plans before they come to fruition.") 10 10 ()}

#undef SC1_MISSION
