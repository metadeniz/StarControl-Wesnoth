#textdomain wesnoth-Star_Control_TC
# Space terrain. All codes start with Y, which core Wesnoth leaves unused.
#
#   Ys      Deep Space        open space, poor cover
#   Yn      Nebula            slows ships, hides them a little
#   Yr      Red Nebula        hot plasma: easier for big ships, harder for small
#   Yi      Badlands         very slow, and ships are easy to hit (water)
#   Yis     Light Badlands    slow, easy to hit (shallow water, swamp)
#   Yif     Thin Badlands    plays as the better of space or badlands (ford)
#   Yu, Yus, Yuf              badlands, light and thin badlands with ripples:
#                             they play exactly like Yi, Yis and Yif and only
#                             look different, for maps that want another look
#   Yd      Dust Cloud        slow, a little easier to hit (sand)
#   ^Ya     Asteroid Field    slow, good cover; over nebula etc. it gives the
#                             better cover and the worse movement of the two
#   ^Yad    Dense Asteroids   slower, best cover (mountains)    slow and cramped, good cover
#   ^Vyp    Planet            capturable: income, repairs and crew
#   ^Vys    Sea Planet        a planet out in the badlands (from water villages):
#                             plays exactly like a planet, drawn in a plasma ring
#   ^Yx     Star              impassable
#   ^Yw     Debris Disk       impassable (rocks swirling round an empty
#                             middle; was "Asteroid Wall")
#   Yqd     Dark Nebula       impassable cloud, paint it in any shape
#   Yqr     Radiation Zone    impassable cloud, paint it in any shape
#   Yqp     Plasma Storm      impassable cloud, paint it in any shape
#   Yqe     Gravity Eddy      impassable cloud, paint it in any shape
#   ^Ygg    Brown Dwarf       impassable; paint it on a diamond of 4 hexes
#                             (3 across and 2 down, or 2 by 2 either slant),
#                             in open space or red nebula only: elsewhere
#                             it draws something else instead, a supergiant
#                             in nebula, a rocky supergiant in dust, and the
#                             cloud's own centrepiece in an impassable cloud
#                             (see terrain-graphics)
#   ^Ysu    Supergiant        impassable; a diamond of 4 hexes like the brown
#                             dwarf, in open space, nebula, red nebula or dust
#   ^Ysu1..^Ysu6  Supergiant  the same, always the 1st..6th look: yellow,
#                             blue, red, white, green, orange
#   ^Yxb    Black Hole        impassable; Wesnoth picks one of 4 looks per hex
#   ^Yxb1..^Yxb4  Black Hole  the same, always the 1st (orange), 2nd
#                             (blue-white), 3rd (red) or 4th (violet) look
#   ^Yxs1..^Yxs6  Star        a star, always the 1st..6th of the plasma
#                             storm suns (a plain ^Yx in a plasma storm
#                             picks one of them)
#   ^Yxp    Pulsar            impassable
#   ^Ybh    Supermassive Black Hole  impassable; a diamond of 4 hexes like
#                             the brown dwarf, for the middle of gravity eddies
#   ^Ybh1..^Ybh6  the same, always the 1st..6th look (each once on a map)
#   ^Ygc    Globular Cluster  impassable; a diamond of 4 hexes like the brown
#                             dwarf, for the middle of a radiation zone
#   ^Ysg    Debris Disk       impassable; a red supergiant behind a disk of
#                             rocks, a diamond of 4 hexes like the brown
#                             dwarf, for the middle of debris disks and dust
#   ^Ysg2..^Ysg4  the same, orange, yellow or white (^Ysg is red, and
#                             ^Ysb a blue giant)
#   ^Yds    Dark Star         impassable; a diamond of 4 hexes like the brown
#                             dwarf, for the middle of a dark nebula (a brown
#                             dwarf painted in dark nebula draws one too)
#   ^Yds1..^Yds4  the same, always the 1st..4th look (1 and 3 eclipsing,
#                             2 and 4 in a haze with a ring of gas)
#   ^Ytsu ^Ytbh ^Ytgc ^Ytsg ^Ytds  the supergiant, supermassive black
#                             hole, globular cluster, debris disk and dark
#                             star, smaller: paint
#                             each on a triangle of 3 hexes round one
#                             corner. Each picks one of its looks.
#   ^Ytu1..^Ytu6  Supergiant  the 3-hex supergiant, always the 1st..6th
#                             look: yellow, blue, red, white, green, orange
#   ^Ybd    Brown Dwarf       impassable; a small brown dwarf in one hex
#   Yk      Starbase          keep: recruit ships here
#   Yc      Docking Ring      castle: new ships appear here
#   Yci     Docking Ring      the same, out in the light badlands (from
#                             swamp ruins and sunken ruins); it plays exactly
#                             like a docking ring
#
# The planet overlay starts with ^V so that the Arilou hyperjump (the core
# teleport ability) can land on planets its side owns.

# ---- hidden movement/defense classes ----

[terrain_type]
    id=space
    name= _ "Space"
    editor_name= _ "Space"
    symbol_image=sc/space-tile
    string=Yt
    hidden=yes
    help_topic_text= _ "<italic>text='Deep space'</italic> is open, empty void. Every ship moves through it at full speed, but there is nothing to hide behind."
[/terrain_type]

[terrain_type]
    id=nebula
    name= _ "Nebula"
    editor_name= _ "Nebula"
    symbol_image=sc/nebula-tile
    string=Ynt
    hidden=yes
    help_topic_text= _ "<italic>text='Nebulae'</italic> are clouds of ionised gas. They foul sensors and engines alike: ships move slowly inside them but are harder to target."
[/terrain_type]

[terrain_type]
    id=rednebula
    name= _ "Red Nebula"
    editor_name= _ "Red Nebula"
    symbol_image=sc/rednebula-tile
    string=Yrt
    hidden=yes
    help_topic_text= _ "<italic>text='Red nebulae'</italic> are clouds of hot plasma. Big ships push through them more easily than through ordinary nebulae, while small ships struggle. The fire-born Mycon and Ilwrath, and the heat-proof crystal Chenjesu, are right at home in them."
[/terrain_type]

[terrain_type]
    id=lightstorm
    name= _ "Light Badlands"
    editor_name= _ "Light Badlands"
    symbol_image=sc/ionstorm-light-tile
    string=Yilt
    hidden=yes
    help_topic_text= _ "<italic>text='Light badlands'</italic> are the shallow edges of the badlands, where the plasma is thinner: ships are slowed and easier to hit, but less than in the badlands proper."
[/terrain_type]

[terrain_type]
    id=ionstorm
    name= _ "Badlands"
    editor_name= _ "Badlands"
    symbol_image=sc/ionstorm-tile
    string=Yit
    hidden=yes
    help_topic_text= _ "<italic>text='Badlands'</italic> are rivers of charged plasma. Ships inside are slowed and their shields flicker, so they are easier to hit than in open space."
[/terrain_type]

[terrain_type]
    id=dust
    name= _ "Dust Cloud"
    editor_name= _ "Dust Cloud"
    symbol_image=sc/dust-tile
    string=Ydt
    hidden=yes
    help_topic_text= _ "<italic>text='Dust clouds'</italic> are drifts of fine debris. They clog engines and sensors: ships move slowly and are a little easier to hit than in open space."
[/terrain_type]

[terrain_type]
    id=dense_asteroids
    name= _ "Dense Asteroids"
    editor_name= _ "Dense Asteroids"
    symbol_image=sc/asteroids-dense-tile
    string=Yadt
    hidden=yes
    help_topic_text= _ "<italic>text='Dense asteroid fields'</italic> are packed with huge rocks. Every ship crawls through them, but nowhere offers better cover."
[/terrain_type]

[terrain_type]
    id=asteroids
    name= _ "Asteroid Field"
    editor_name= _ "Asteroid Field"
    symbol_image=sc/asteroids-tile
    string=Yat
    hidden=yes
    help_topic_text= _ "<italic>text='Asteroid fields'</italic> are slow and dangerous to cross, but a ship among the rocks is very hard to hit. Big ships struggle more than small ones."
[/terrain_type]

[terrain_type]
    id=planet
    name= _ "Planet"
    editor_name= _ "Planet"
    symbol_image=sc/planet-tile
    string=Ypt
    hidden=yes
    help_topic_text= _ "<italic>text='Planets'</italic> can be claimed by moving a ship into orbit. Each planet held adds to its owner's income, and a ship in orbit repairs and takes on new crew each turn."
[/terrain_type]

[terrain_type]
    id=starbase
    name= _ "Starbase"
    editor_name= _ "Starbase"
    symbol_image=sc/starbase-tile
    string=Ybt
    hidden=yes
    help_topic_text= _ "<italic>text='Starbases'</italic> build new ships. A flagship at a starbase can launch ships onto any connected docking ring."
[/terrain_type]

