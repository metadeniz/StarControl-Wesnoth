# Brown dwarfs stand only in open space and red nebula: one painted
# anywhere else draws something else instead, the cloud's own centrepiece
# in an impassable cloud (a dark star in dark nebula, a supermassive black
# hole in a gravity eddy, a globular cluster in a radiation zone, a plain
# storm sun in a plasma storm), a supergiant in nebula and a supergiant
# behind rocks in dust.
{SC_BIG_OBJECT Yqd*^Ygg* brown_dwarf sc/dark-star}
{SC_BIG_OBJECT_V Yqe*^Ygg* brown_dwarf sc/black-hole-big ";2;3;4;5;6"}
{SC_BIG_OBJECT Yqr*^Ygg* brown_dwarf sc/globular-cluster}
{SC_BIG_OBJECT_V Yqp*^Ygg* brown_dwarf sc/star-plasma "1;2;3;4;5;6"}
{SC_BIG_OBJECT_V Yn*^Ygg* brown_dwarf sc/supergiant "1;2;3;4;5;6"}
{SC_BIG_OBJECT_V Yd*^Ygg* brown_dwarf sc/rocky-supergiant "2;3;4"}
# A brown dwarf in red nebula has wisps of the cloud in front of it. This
# comes first so it wins over the plain one below.
{SC_BIG_OBJECT_V Yr*^Ygg brown_dwarf sc/brown-dwarf-rednebula ";"}
{SC_BIG_OBJECT_V *^Ygg brown_dwarf sc/brown-dwarf ";"}
# Supergiants: ^Ysu1..^Ysu6 always draw the same one of the six; a plain
# ^Ysu picks one.
{SC_BIG_OBJECT_V *^Ysu1 supergiant sc/supergiant1 ";"}
{SC_BIG_OBJECT_V *^Ysu2 supergiant sc/supergiant2 ";"}
{SC_BIG_OBJECT_V *^Ysu3 supergiant sc/supergiant3 ";"}
{SC_BIG_OBJECT_V *^Ysu4 supergiant sc/supergiant4 ";"}
{SC_BIG_OBJECT_V *^Ysu5 supergiant sc/supergiant5 ";"}
{SC_BIG_OBJECT_V *^Ysu6 supergiant sc/supergiant6 ";"}
{SC_BIG_OBJECT_V *^Ysu supergiant sc/supergiant "1;2;3;4;5;6"}
# Drawn the same way: the supermassive black hole, for the middle of a
# cluster of gravity eddies, and the globular cluster, for the middle of a
# radiation zone.
{SC_BIG_OBJECT_V *^Ybh big_black_hole sc/black-hole-big ";2;3;4;5;6"}
# ^Ybh1..^Ybh6 always draw the same one of the six, so a map can show each once
{SC_BIG_OBJECT_V *^Ybh1 big_black_hole sc/black-hole-big ";"}
{SC_BIG_OBJECT_V *^Ybh2 big_black_hole sc/black-hole-big2 ";"}
{SC_BIG_OBJECT_V *^Ybh3 big_black_hole sc/black-hole-big3 ";"}
{SC_BIG_OBJECT_V *^Ybh4 big_black_hole sc/black-hole-big4 ";"}
{SC_BIG_OBJECT_V *^Ybh5 big_black_hole sc/black-hole-big5 ";"}
{SC_BIG_OBJECT_V *^Ybh6 big_black_hole sc/black-hole-big6 ";"}
{SC_BIG_OBJECT *^Ygc globular_cluster sc/globular-cluster}
# and the supergiants behind their debris disks: a red one (^Ysg), its
# partner a blue giant (^Ysb), and orange, yellow and white ones
# (^Ysg2..^Ysg4)
{SC_BIG_OBJECT_V *^Ysg red_supergiant sc/red-supergiant ";"}
{SC_BIG_OBJECT_V *^Ysb blue_giant sc/blue-giant ";"}
{SC_BIG_OBJECT_V *^Ysg2 rocky_supergiant sc/rocky-supergiant2 ";"}
{SC_BIG_OBJECT_V *^Ysg3 rocky_supergiant sc/rocky-supergiant3 ";"}
{SC_BIG_OBJECT_V *^Ysg4 rocky_supergiant sc/rocky-supergiant4 ";"}
# the dark star, for the middle of a dark nebula; ^Yds1..^Yds4 always draw
# the same one of the four, so a map can show each once
{SC_BIG_OBJECT *^Yds dark_star sc/dark-star}
{SC_BIG_OBJECT_V *^Yds1 dark_star sc/dark-star ";"}
{SC_BIG_OBJECT_V *^Yds2 dark_star sc/dark-star2 ";"}
{SC_BIG_OBJECT_V *^Yds3 dark_star sc/dark-star3 ";"}
{SC_BIG_OBJECT_V *^Yds4 dark_star sc/dark-star4 ";"}

# The three-hex objects: one smaller globe over a triangle of three hexes
# round the corner they share, pointing either way (two hexes stacked on
# the left and one on the right, or the other way round). Drawn like the
# four-hex ones above; a hex not part of a full triangle draws nothing.
# Painted next to each other, two triangles that share a hex take turns:
# the first one found wins and the other stays empty, so leave a gap.
#define SC_SMALL_OBJECT_V TERRAIN FLAG IMAGESTEM VARIATIONS
    [terrain_graphics]
        [tile]
            x,y=2,2
            type={TERRAIN}
            set_no_flag={FLAG}
