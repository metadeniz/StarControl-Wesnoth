# A gas giant in a cloud has wisps of the cloud in front of it. These come
# first so they win over the plain gas giant below.
{SC_BIG_OBJECT Yqd*^Ygg gas_giant sc/gas-giant-darknebula}
{SC_BIG_OBJECT Yqp*^Ygg gas_giant sc/gas-giant-plasmastorm}
{SC_BIG_OBJECT Yqr*^Ygg gas_giant sc/gas-giant-radiation}
{SC_BIG_OBJECT Yqe*^Ygg gas_giant sc/gas-giant-eddy}
{SC_BIG_OBJECT Yn*^Ygg gas_giant sc/gas-giant-nebula}
{SC_BIG_OBJECT Yr*^Ygg gas_giant sc/gas-giant-rednebula}
{SC_BIG_OBJECT Yd*^Ygg gas_giant sc/gas-giant-dust}
{SC_BIG_OBJECT *^Ygg gas_giant sc/gas-giant}
# Drawn the same way: the supermassive black hole, for the middle of a
# cluster of gravity eddies, and the globular cluster, for the middle of a
# radiation zone.
{SC_BIG_OBJECT_V *^Ybh big_black_hole sc/black-hole-big ";2;3;4;5;6"}
# ^Ybh1..^Ybh6 always draw the same one of the six, so a map can show each once
{SC_BIG_OBJECT_V *^Ybh1 big_black_hole sc/black-hole-big ";"}
{SC_BIG_OBJECT_V *^Ybh2 big_black_hole sc/black-hole-big2 ";"}
{SC_BIG_OBJECT_V *^Ybh3 big_black_hole sc/black-hole-big3 ";"}
{SC_BIG_OBJECT_V *^Ybh4 big_black_hole sc/black-hole-big4 ";"}
{SC_BIG_OBJECT_V *^Ybh5 big_black_hole sc/black-hole-big5 ";"}
{SC_BIG_OBJECT_V *^Ybh6 big_black_hole sc/black-hole-big6 ";"}
{SC_BIG_OBJECT *^Ygc globular_cluster sc/globular-cluster}

