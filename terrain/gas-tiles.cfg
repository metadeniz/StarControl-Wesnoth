#textdomain wesnoth-Star_Control_TC
# Generated by tools/make_art.py (build_gas); do not edit by hand.
# Nebulae and dust: each hex shows the piece of the cloud at its own place
# on the map, and spills wisps onto its neighbours, so clouds run on across
# hex edges.

#define SC_GAS_BASE TERRAIN X Y IMAGE
    [terrain_graphics]
        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={TERRAIN}
            set_no_flag=base
            [image]
                name={IMAGE}
                layer=-1000
            [/image]
        [/tile]
    [/terrain_graphics]
#enddef

#define SC_GAS_SPILL OTHERS GAS X Y NX NY FLAG LAYER IMAGE
    [terrain_graphics]
        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={OTHERS}
            set_no_flag={FLAG}
            [image]
                name={IMAGE}
                layer={LAYER}
            [/image]
        [/tile]
        [tile]
            x,y={NX},{NY}
            type={GAS}
        [/tile]
    [/terrain_graphics]
#enddef

