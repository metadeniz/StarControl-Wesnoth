        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={OTHERS}
            set_no_flag={FLAG}
            [image]
                name={IMAGE}
                layer={LAYER}
            [/image]
        [/tile]
        [tile]
            x,y={NX},{NY}
            type={GAS}
        [/tile]
    [/terrain_graphics]
#enddef

