#define SC_GAS_BASE TERRAIN X Y IMAGE
    [terrain_graphics]
        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={TERRAIN}
            set_no_flag=base
            [image]
                name={IMAGE}
                layer=-1000
            [/image]
        [/tile]
    [/terrain_graphics]
#enddef

