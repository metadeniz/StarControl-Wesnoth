            set_no_flag={FLAG}
            [image]
                name={IMAGE}
                layer={LAYER}
            [/image]
        [/tile]
        [tile]
            x,y={NX},{NY}
            type={GAS}
        [/tile]
    [/terrain_graphics]
#enddef

