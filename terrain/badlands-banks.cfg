#define SC_GAS_BASE TERRAIN X Y IMAGE
    [terrain_graphics]
        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={TERRAIN}
            set_no_flag=base
            [image]
                name={IMAGE}
                layer=-1000
            [/image]
        [/tile]
    [/terrain_graphics]
#enddef

#define SC_GAS_CALM STORM STARS X Y NX NY IMAGE
    [terrain_graphics]
        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={STORM}
            set_no_flag=base
            [image]
                name={IMAGE}
                layer=-1000
            [/image]
        [/tile]
        [tile]
            x,y={NX},{NY}
            type={STARS}
        [/tile]
    [/terrain_graphics]
#enddef

#define SC_GAS_SPILL OTHERS GAS X Y NX NY FLAG LAYER IMAGE
    [terrain_graphics]
        mod_x=6
        mod_y=4
        [tile]
            x,y={X},{Y}
            type={OTHERS}
            set_no_flag={FLAG}
            [image]
                name={IMAGE}
                layer={LAYER}
            [/image]
        [/tile]
        [tile]
            x,y={NX},{NY}
            type={GAS}
        [/tile]
    [/terrain_graphics]
#enddef

