# Chmmr Avatar: lighter on its feet than other large hulls. It also has
# point-defense and a crystal crew, but those two have no names here: this
# one ability is listed for all three, under a combined name, so the recruit
# dialog's details list stays short enough that the dialog doesn't grow when
# the Chmmr is selected. The side panel shows the same names either way.
#define SC_ABILITIES_CHMMR
    [dummy]
        id=sc_chmmr_drive
        name= _ "Chmmr drive, point-defense"
        description= _ "Chmmr drive: Precursor-grade engines. This large hull moves 1 hex for 1 move through green nebulae and dust clouds, 2 through badlands, 1 through light badlands, and 3 through asteroid fields and dense asteroids. Its defense is the same as any large hull's.

Point-defense: lasers shoot down Ur-Quan fighters. They hit this ship at most 50% of the time, wherever it is, and get no bonus against it for being slow.

Crystal crew: half of each Chmmr is Chenjesu crystal, and marines make little headway against it: +50% resistance to Orz boarding parties."
    [/dummy]
    [dummy]
        id=sc_point_defense
    [/dummy]
    {SC_ABILITY_REPEL_BOARDERS sc_crystal_crew "" "" 50}
#enddef

# The Sa-Matra's drive. The moves themselves are in its [movement_costs].
#define SC_ABILITY_SAMATRA_DRIVE
    [dummy]
        id=sc_samatra_drive
        name= _ "Precursor drive"
        description= _ "Precursor engines, at their best: even dense asteroids cost this huge platform only 1 move. Its defense is the same as any large hull's."
    [/dummy]
#enddef

# Ships at home in the badlands. The moves and defense themselves are set
# in each ship's [movement_costs] and [defense]; this is what players read.
#define SC_ABILITY_BADLANDS_RUNNER MOVES DEFENSE LIGHT_MOVES WHY
    [dummy]
        id=sc_badlands_runner
        name= _ "badlands runner"
        description={WHY} + _ " In badlands this ship needs " + "{MOVES}" + _ " move(s) and has " + "{DEFENSE}" + _ "% defense; light badlands cost it " + "{LIGHT_MOVES}" + _ " move."
    [/dummy]
#enddef

# Mmrnmhrm Y-Wing: the repair robots still work in the fast shape, at half
# the X-Wing's rate (the X-Wing has the standard cures, heals +8).
#define SC_ABILITY_CURES_4
    [heals]
        id=sc_cures_4
        name= _ "cures +4"
        female_name= _ "female^cures +4"
        description= _ "A unit which can cure an ally of poison, although the ally will receive no additional healing on the turn it is cured of the poison.

Allied ships next to this one also recover up to 4 HP per turn: half the X-Wing's repair."
        affect_self=no
        affect_allies=yes
        value=4
        max_value=4
        poison=cured
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
        [/affect_adjacent]
    [/heals]
#enddef

# Hierarchy Starbase: a repair dock for the ships around it.
#define SC_ABILITY_REPAIR_DOCK
    [heals]
        id=sc_repair_dock
        name= _ "repair dock"
        description= _ "Ships docked next to this starbase are repaired: allied ships next to it recover 8 HP every turn, and poison is cured."
        value=8
        poison=cured
        affect_allies=yes
        affect_self=no
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
        [/affect_adjacent]
    [/heals]
#enddef

# Hierarchy Starbase: the same red force field that cages Earth.
#define SC_ABILITY_SLAVE_SHIELD
    [resistance]
        id=sc_slave_shield
        name= _ "slave-shield projector"
        description= _ "When attacked, the starbase wraps itself in the red force field the Ur-Quan use to cage conquered worlds: +20% resistance to all damage, up to a maximum of 50%. Orz boarding parties get past it."
        add=20
        max_value=50
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
        [filter_second_weapon]
            [not]
                special_id=sc_boarding
            [/not]
            [not]
                name=fighters,fighters_far,fighter_bays,syreen_song
            [/not]
        [/filter_second_weapon]
    [/resistance]
#enddef

# Alliance Starbase: its shield generators cover the ships around it.
#define SC_ABILITY_DEFENSE_GRID
    [resistance]
        id=sc_defense_grid
        name= _ "defense grid"
        description= _ "The starbase's shield generators reach out to the ships around it: allied ships next to it get +10% resistance to all damage, up to a maximum of 60%. Orz boarding parties get past it."
        add=10
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        affect_self=no
        affect_allies=yes
        [affect_adjacent]
        [/affect_adjacent]
        [filter_second_weapon]
            [not]
                special_id=sc_boarding
            [/not]
            [not]
                name=fighters,fighters_far,fighter_bays,syreen_song
            [/not]
        [/filter_second_weapon]
    [/resistance]
#enddef
