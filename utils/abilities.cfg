#textdomain wesnoth-Star_Control_TC
# Ship abilities. The ones marked "right-click" are worked by the menu
# items and events in lua/sc.lua; their entries here only explain them.

#define SC_ABILITY_FORCE_SHIELD
    [resistance]
        id=sc_force_shield
        name= _ "force shield"
        description= _ "When attacked, this ship raises its force shield: +40% resistance to all damage, up to a maximum of 60%."
        add=40
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
    [/resistance]
#enddef

#define SC_ABILITY_CLOAK
    [hides]
        id=sc_cloak
        name= _ "cloaking device"
        description= _ "This ship is invisible to the enemy unless an enemy ship is next to it. Attacking reveals it for the rest of the turn.

An enemy ship that stumbles onto a cloaked ship loses the rest of its movement."
        affect_self=yes
    [/hides]
#enddef

#define SC_ABILITY_REGROW_CREW
    [regenerate]
        id=sc_regrow_crew
        name= _ "regrow crew"
        description= _ "This ship grows new crew: it recovers 6 HP every turn without having to sit at a planet. Poison is also cured."
        value=6
        affect_self=yes
        poison=cured
    [/regenerate]
#enddef

#define SC_ABILITY_HYPERJUMP
    [teleport]
        id=sc_hyperjump
        name= _ "hyperjump"
        description= _ "This ship can jump between any two empty planets held by its side, using one move point."
        [tunnel]
            id=sc_hyperjump_tunnel
            [source]
                terrain=*^V*
                formula="owner_side = teleport_unit.side_number and (unit = teleport_unit or not unit) where unit = unit_at(loc)"
            [/source]
            [target]
                terrain=*^V*
                formula="owner_side = teleport_unit.side_number and not unit_at(loc)"
            [/target]
            [filter]
                ability=sc_hyperjump
            [/filter]
        [/tunnel]
    [/teleport]
#enddef

#define SC_ABILITY_GLORY_DEVICE
    [dummy]
        id=sc_glory_device
        name={SC_WPN_GLORY_DEVICE}
        description= _ "Right-click the ship and choose “Detonate Glory Device”. The ship is destroyed, and every ship next to it — friend or foe — takes 24 fire damage."
    [/dummy]
#enddef

#define SC_ABILITY_LAUNCH_FIGHTERS
    [dummy]
        id=sc_launch_fighters
        name= _ "launch fighters"
        description= _ "Right-click the ship and choose “Launch Fighters” instead of attacking. Up to two fighters fly out to the empty hexes next to it, each costing 4 HP of crew. Fighters that end a later turn next to a friendly Dreadnought fly back aboard and return their crew."
    [/dummy]
#enddef

#define SC_ABILITY_TRANSFORM
    [dummy]
        id=sc_transform
        name= _ "transform"
        description= _ "Right-click the ship and choose “Transform” instead of moving and attacking. The X-Form (slow, twin lasers) and the Y-Form (fast, homing torpedoes) are the same ship in two shapes; either can be recruited."
    [/dummy]
#enddef

#define SC_ABILITY_FIGHTER
    [dummy]
        id=sc_fighter
        name= _ "fighter"
        description= _ "Launched from a Dreadnought. Costs no upkeep. Ending a later turn next to a friendly Dreadnought brings the fighter back aboard."
    [/dummy]
#enddef
