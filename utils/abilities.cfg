#enddef

# Ambush: hidden from the enemy in certain terrain, unless an enemy ship is
# next to it. Never in open space, badlands, planets or starbases.
#   TERRAIN is a terrain list (see SC_HIDE_* below), WHERE the tooltip text.
#define SC_ABILITY_AMBUSH ID TERRAIN WHERE
    [hides]
        id={ID}
        name= _ "ambush"
        description= _ "This ship can hide in " + {WHERE} + _ ": it is invisible to the enemy there unless an enemy ship is next to it. Once found, or after it attacks, it stays visible until its own side's next turn.

An enemy ship that stumbles onto a hidden ship loses the rest of its movement."
        affect_self=yes
        [filter]
            [filter_location]
                terrain={TERRAIN}
            [/filter_location]
        [/filter]
    [/hides]
#enddef

#define SC_HIDE_NEBULA
Yn,Yn^Ya,Yn^Yad#enddef
#define SC_HIDE_RED
Yr,Yr^Ya,Yr^Yad#enddef
#define SC_HIDE_DUST
Yd,Yd^Ya,Yd^Yad#enddef
#define SC_HIDE_BADLANDS
Yi,Yi^Ya,Yi^Yad,Yis,Yis^Ya,Yis^Yad,Yif,Yif^Ya,Yif^Yad,Yu,Yu^Ya,Yu^Yad,Yus,Yus^Ya,Yus^Yad,Yuf,Yuf^Ya,Yuf^Yad#enddef
#define SC_HIDE_ASTEROIDS
*^Ya,*^Yad#enddef

#define SC_ABILITY_HYPERJUMP
    [teleport]
        id=sc_hyperjump
        name= _ "hyperjump"
        description= _ "This ship can jump between any two empty planets held by its side, using one move point (Arilou Skiff, Precursor Flagship)."
        [tunnel]
            id=sc_hyperjump_tunnel
            [source]
                terrain=*^V*
                formula="owner_side = teleport_unit.side_number and (unit = teleport_unit or not unit) where unit = unit_at(loc)"
            [/source]
            [target]
                terrain=*^V*
                formula="owner_side = teleport_unit.side_number and not unit_at(loc)"
            [/target]
            [filter]
                ability=sc_hyperjump
            [/filter]
        [/tunnel]
    [/teleport]
#enddef

# Orz space marines: once aboard, armour and shields don't stop them.
# Shields leave them out through their own [filter_second_weapon];
# the Yehat's armoured hull (blade 60) is undone here: 5/3 x 60% = 100%.
#define SC_SPECIAL_BOARDING
    [dummy]
        id=sc_boarding
        name= _ "boarding"
        description= _ "The marines cross over and fight the crew inside the enemy ship, so armour and shields don't stop them: this attack ignores the target's resistances. Only a crew trained or built to fight them off resists it (Chmmr and Earthling ships)."
    [/dummy]
    [damage]
        id=sc_boarding_armour
        multiply=1.667
        [filter_opponent]
            race=sc_yehat
        [/filter_opponent]
    [/damage]
#enddef

#define SC_SPECIAL_GLORY_DEVICE
    [chance_to_hit]
        id=sc_unavoidable
        name= _ "unavoidable"
        description= _ "This attack always hits. Its damage varies: from two-thirds to four-thirds of the listed value (8–16 for a new Scout, 10–20 for a veteran, 12–24 for an ace)."
        value=100
        cumulative=no
    [/chance_to_hit]
    [dummy]
        id=sc_self_destruct
        name= _ "self-destruct"
        description= _ "The ship blows itself apart to strike: it is destroyed when the attack ends, and the target gets no chance to fire back. Leaders don't carry it, and a ship never fires it in self-defense. A Scout destroyed by a ship that attacked it at close range has a 50% chance to set it off as it dies, hitting that ship for half the usual damage (4–8 / 5–10 / 6–12)."
    [/dummy]
    # The target can't return fire: the Scout is gone in the blast.
    [disable]
        id=sc_no_return_fire
        apply_to=opponent
        active_on=offense
    [/disable]
#enddef

# Syreen song: the lured crew float across and join the Syreen, so the
# ship regains every point of damage the song deals. How many come over
# varies from fight to fight (see sc.syreen_attack in lua/sc.lua).
#define SC_SPECIAL_SYREEN_SONG
    [drains]
        id=sc_syreen_song
        name= _ "lures crew"
        description= _ "The enemy crew hear the song, abandon their posts and float across to join the Syreen: this ship regains HP equal to the full damage dealt. How many come over varies: the listed damage is the average, and each fight it rolls from 80% to 120% of it."
        value=100
    [/drains]
#enddef

# Syreen song backstab: a flanked crew has nowhere to hide from the song,
# so it gets one more verse instead of hitting harder (it already drains in full).
#define SC_SPECIAL_SYREEN_SONG_BACKSTAB
    [attacks]
        id=sc_syreen_song_backstab
        name= _ "backstab"
        description= _ "When used offensively, this attack strikes one more time if there is an enemy of the target on the opposite side of the target, and that unit is not incapacitated (turned to stone or otherwise paralyzed)."
        add=1
        active_on=offense
        [filter_opponent]
            formula="
                enemy_of(self, flanker) and not flanker.petrified
            where
                flanker = unit_at(direction_from(loc, other.facing))
            "
        [/filter_opponent]
    [/attacks]
#enddef

# Syreen close-range dagger backstab: no extra damage, but two more strikes
# when flanking.
#define SC_SPECIAL_SYREEN_DAGGER_CLOSE_BACKSTAB
    [attacks]
        id=sc_syreen_dagger_close_backstab
        name= _ "backstab"
        description= _ "When used offensively, this attack strikes two more times if there is an enemy of the target on the opposite side of the target, and that unit is not incapacitated (turned to stone or otherwise paralyzed)."
        add=2
        active_on=offense
        [filter_opponent]
            formula="
                enemy_of(self, flanker) and not flanker.petrified
            where
                flanker = unit_at(direction_from(loc, other.facing))
            "
        [/filter_opponent]
    [/attacks]
#enddef

# Syreen dagger backstab: double damage like mainline backstab, plus one
# more strike when flanking.
#define SC_SPECIAL_SYREEN_DAGGER_BACKSTAB
    [damage]
        id=backstab
        name= _ "backstab"
        description= _ "When used offensively, this attack deals double damage and strikes one more time if there is an enemy of the target on the opposite side of the target, and that unit is not incapacitated (turned to stone or otherwise paralyzed)."
        multiply=2
        active_on=offense
        [filter_opponent]
            formula="
                enemy_of(self, flanker) and not flanker.petrified
            where
                flanker = unit_at(direction_from(loc, other.facing))
            "
        [/filter_opponent]
    [/damage]
    # No name: the backstab entry above describes the extra strike.
    [attacks]
        id=sc_syreen_dagger_backstab
        add=1
        active_on=offense
        [filter_opponent]
            formula="
                enemy_of(self, flanker) and not flanker.petrified
            where
                flanker = unit_at(direction_from(loc, other.facing))
            "
        [/filter_opponent]
    [/attacks]
#enddef

