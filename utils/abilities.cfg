# Point-defense against Ur-Quan fighters: put on the fighters' attacks.
# Where the target's own defense is below 50% (open space, nebulae, dust,
# badlands), fighters hit it only 50% of the time. Nebulae only matter for
# the large point-defense hulls (Chmmr, starbase, Precursor), which have 40%
# defense there; everyone else already has 50%.
#define SC_SPECIAL_VS_POINT_DEFENSE
    [chance_to_hit]
        id=sc_vs_point_defense
        name= _ "vs. point-defense"
        description= _ "Ships with point-defense (Earthling Cruiser, Chmmr Avatar, Precursor Flagship, Alliance Starbase) shoot fighters down: fighters hit them at most 50% of the time."
        value=50
        cumulative=no
        [filter_opponent]
            ability=sc_point_defense
            [filter_location]
                terrain=Ys,Yn,Yr,Yd,Yi,Yis,Yif,Yu,Yus,Yuf
            [/filter_location]
        [/filter_opponent]
    [/chance_to_hit]
#enddef

# Chmmr ZapSats: first strike, swarm, auto-targeting (like magical, but on
# defense too, so they punish nimble ships whichever side starts the fight)
# and +1 damage against small and tiny hulls (keyed on the hull trait).
# Only the auto-targeting special has a name, and its description covers all
# four: a nameless special still works but isn't listed, which keeps the
# recruit dialog's details list short enough that the dialog doesn't grow
# when the Chmmr is selected.
#define SC_SPECIALS_ZAPSATS
    [firststrike]
        id=firststrike
    [/firststrike]
    [swarm]
        id=swarm
    [/swarm]
    [chance_to_hit]
        id=sc_auto_targeting
        name= _ "ZapSats"
        description= _ "The ZapSats aim and fire on their own:
• First strike: they always strike first, even on defense.
• Auto-targeting: they always have a 70% chance to hit, whatever the terrain, on offense and defense alike. Small, nimble ships get no benefit from their speed.
• Made for swatting small craft: +1 damage against ships with a small or tiny hull.
• Swarm: fewer survive as the Avatar takes damage; the number of strikes is proportional to the percentage of its maximum HP it has."
        value=70
        cumulative=no
    [/chance_to_hit]
    [damage]
        id=sc_vs_light_hulls
        add=1
        [filter_opponent]
            [filter_wml]
                [modifications]
                    [trait]
                        id=sc_hull_small
                    [/trait]
                [/modifications]
            [/filter_wml]
            [or]
                [filter_wml]
                    [modifications]
                        [trait]
                            id=sc_hull_tiny
                        [/trait]
                    [/modifications]
                [/filter_wml]
            [/or]
        [/filter_opponent]
    [/damage]
#enddef

# Chmmr megawatt laser: marksman and slows, listed as one line for the same
# reason as the ZapSats.
#define SC_SPECIALS_MEGAWATT_LASER
    [chance_to_hit]
        id=marksman
        name= _ "marksman, slows"
        description= _ "Marksman: when used offensively, this attack always has at least a 60% chance to hit.

Slows: this attack slows the target until it ends a turn. Slow halves the damage caused by attacks and the movement cost for a slowed unit is doubled. A unit that is slowed will feature a snail icon in its sidebar information when it is selected."
        value=60
        cumulative=yes
        active_on=offense
    [/chance_to_hit]
    [slow]
        id=slow
    [/slow]
#enddef

# Ur-Quan fighters: easy prey for slow ships, hard to land on fast ones.
# Keyed on max moves, so a slowed ship keeps its class. Point-defense
# ships don't get the slow-ship bonus: they shoot the fighters down.
#define SC_SPECIAL_FIGHTER_SPEED
    [damage]
        id=sc_fighters_vs_slow
        name= _ "swarms slow ships"
        description= _ "Fighters swarm slow ships: +2 damage against ships with 4 or fewer moves, unless they have point-defense."
        add=2
        [filter_opponent]
            formula="max_moves <= 4"
            [not]
                ability=sc_point_defense
            [/not]
        [/filter_opponent]
    [/damage]
    [damage]
        id=sc_fighters_vs_fast
        name= _ "outrun by fast ships"
        description= _ "Fast ships dodge most fighters: −1 damage against ships with 6 moves, −2 against ships with 7 or more."
        add=-1
        [filter_opponent]
            formula="max_moves = 6"
        [/filter_opponent]
    [/damage]
    [damage]
        id=sc_fighters_vs_very_fast
        add=-2
        [filter_opponent]
            formula="max_moves >= 7"
        [/filter_opponent]
    [/damage]
#enddef

#define SC_ABILITY_POINT_DEFENSE
