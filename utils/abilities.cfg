#textdomain wesnoth-Star_Control_TC
# Ship abilities. The ones marked "right-click" are worked by the menu
# items and events in lua/sc.lua; their entries here only explain them.

# The shield and the rail cannons share the ship's power: the shield is up
# while the Terminator fires its pulse cannons (attacking or defending) and
# while it is hit at range (it has no ranged weapon, so it never fires back).
# Firing the rail cannons drops it. Fighters slip under it and the Syreen
# song lures the crew rather than hitting the hull, so neither is stopped.
#define SC_ABILITY_FORCE_SHIELD
    [resistance]
        id=sc_force_shield
        name= _ "force shield"
        description= _ "The force shield is up while this ship fights with Attack with Shields (its pulse cannons), whether it attacks or is attacked: +40% resistance to all damage, up to a maximum of 60%. Against ranged attacks it cannot fire back, so the shield stays up: +50%. Attack Only fires the rail cannons, which drain the shield, so with it this ship takes normal damage. Mycon plasmoids splash harmlessly off it and do only half damage, even when this ship is the attacker. Orz boarding parties, Ur-Quan fighters and the Syreen song get past it."
        add=40
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        affect_self=yes
        [filter_weapon]
            name=pulse_cannons
        [/filter_weapon]
        [filter_second_weapon]
            [not]
                special_id=sc_boarding
            [/not]
            [not]
                name=fighters,fighters_far,fighter_bays,syreen_song
            [/not]
        [/filter_second_weapon]
    [/resistance]
    # Same id, so the larger bonus wins. No name: the tooltip above already
    # explains it. Ranged attacks always find the Yehat without a weapon to
    # answer with, so this one needs no [filter_weapon].
    [resistance]
        id=sc_force_shield
        add=50
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
        [filter_second_weapon]
            range=ranged
            [not]
                name=fighters,fighters_far,fighter_bays,syreen_song
            [/not]
        [/filter_second_weapon]
    [/resistance]
#enddef

# Mycon plasmoids: slow balls of plasma that Yehat and Utwig shields soak up.
#define SC_SPECIAL_ABSORBED_BY_SHIELDS
    [damage]
        id=sc_absorbed_by_shields
        name= _ "absorbed by shields"
        description= _ "Yehat force shields and Utwig absorbing shields soak up plasmoids: against those ships this attack does half damage, whoever attacks."
        multiply=0.5
        [filter_opponent]
            ability=sc_force_shield,sc_absorb_shield
        [/filter_opponent]
    [/damage]
#enddef

#define SC_ABILITY_CLOAK
    [hides]
        id=sc_cloak
        name= _ "cloaking device"
        description= _ "This ship is invisible to the enemy unless an enemy ship is next to it. Once found, or after it attacks, it stays visible until its own side's next turn.

An enemy ship that stumbles onto a cloaked ship loses the rest of its movement, except in the badlands, where it only has to stop."
        affect_self=yes
    [/hides]
#enddef

#define SC_ABILITY_REGROW VALUE
    [regenerate]
        id=sc_regrow_crew
        name= _ "regrow crew"
        description= _ "This ship grows new crew: it recovers {VALUE} HP every turn without having to sit at a planet. Poison is also cured."
        value={VALUE}
        affect_self=yes
        poison=cured
    [/regenerate]
#enddef

#define SC_ABILITY_REGROW_CREW
    {SC_ABILITY_REGROW 6}
#enddef

#define SC_ABILITY_SELF_REPAIR
    [regenerate]
        id=sc_self_repair
        name= _ "self-repair"
        description= _ "Repair robots patch the hull: this ship recovers 4 HP every turn without having to sit at a planet. Poison is also cured."
        value=4
        affect_self=yes
        poison=cured
    [/regenerate]
#enddef

# The Sa-Matra's stronger self-repair.
#define SC_ABILITY_SELF_REPAIR_8
    [regenerate]
        id=sc_self_repair
        name= _ "self-repair +8"
        description= _ "Repair robots patch the hull: this ship recovers 8 HP every turn without having to sit at a planet. Poison is also cured."
        value=8
