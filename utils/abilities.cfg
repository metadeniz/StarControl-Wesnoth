#define SC_RED_AFFINITY MOVES DEFENSE WHY
    [dummy]
        id=sc_red_affinity
        name= _ "red nebula affinity"
        description= _ "{WHY} In red nebulae this ship needs {MOVES} move(s) and has {DEFENSE}% defense, whatever its hull."
    [/dummy]
#enddef

# Earthling Cruiser point-defense against Ur-Quan fighters: put on the
# fighters' attacks. Where the Cruiser's own defense is below 50% (open
# space, dust, ion storms), fighters hit it only 50% of the time.
#define SC_SPECIAL_VS_POINT_DEFENSE
    [chance_to_hit]
        id=sc_vs_point_defense
        name= _ "vs. point-defense"
        description= _ "Ships with point-defense (Earthling Cruiser, Chmmr Avatar, Precursor Flagship) shoot fighters down: against one in open space, dust clouds or ion storms, fighters hit only 50% of the time."
        value=50
        cumulative=no
        [filter_opponent]
            ability=sc_point_defense
            [filter_location]
                terrain=Ys,Yd,Yi,Yif
            [/filter_location]
        [/filter_opponent]
    [/chance_to_hit]
#enddef

#define SC_ABILITY_POINT_DEFENSE
    [dummy]
        id=sc_point_defense
        name= _ "point-defense"
        description= _ "Point-defense lasers shoot down Ur-Quan fighters: they hit this ship at most 50% of the time, even in open space, dust clouds or ion storms."
    [/dummy]
#enddef

# Slylandro Probe: refuels by mining asteroids.
#define SC_ABILITY_ASTEROID_HARVEST
    [regenerate]
        id=sc_asteroid_harvest
        name= _ "asteroid harvesting"
        description= _ "The probe breaks up asteroids for raw material: in an asteroid field it repairs 8 HP every turn, and poison is cured."
        value=8
        affect_self=yes
        poison=cured
        [filter]
            [filter_location]
                terrain={SC_HIDE_ASTEROIDS}
            [/filter_location]
        [/filter]
    [/regenerate]
#enddef

# Utwig Jugger: its shield soaks up hits and turns them into battery power.
#define SC_ABILITY_ABSORB_SHIELD
    [resistance]
