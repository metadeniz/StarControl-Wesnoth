#define SC_RED_AFFINITY MOVES DEFENSE WHY
    [dummy]
        id=sc_red_affinity
        name= _ "red nebula affinity"
        description= _ "{WHY} In red nebulae this ship needs {MOVES} move(s) and has {DEFENSE}% defense, whatever its hull."
    [/dummy]
#enddef

# Point-defense against Ur-Quan fighters: put on the fighters' attacks.
# Where the target's own defense is below 50% (open space, nebulae, dust,
# badlands), fighters hit it only 50% of the time. Nebulae only matter for
# the large point-defense hulls (Chmmr, starbase, Precursor), which have 40%
# defense there; everyone else already has 50%.
#define SC_SPECIAL_VS_POINT_DEFENSE
    [chance_to_hit]
        id=sc_vs_point_defense
        name= _ "vs. point-defense"
        description= _ "Ships with point-defense (Earthling Cruiser, Chmmr Avatar, Precursor Flagship, Alliance Starbase) shoot fighters down: fighters hit them at most 50% of the time."
        value=50
        cumulative=no
        [filter_opponent]
            ability=sc_point_defense
            [filter_location]
                terrain=Ys,Yn,Yr,Yd,Yi,Yis,Yif
            [/filter_location]
        [/filter_opponent]
    [/chance_to_hit]
#enddef

# Ur-Quan fighters: easy prey for slow ships, hard to land on fast ones.
# Keyed on max moves, so a slowed ship keeps its class. Point-defense
# ships don't get the slow-ship bonus: they shoot the fighters down.
#define SC_SPECIAL_FIGHTER_SPEED
    [damage]
        id=sc_fighters_vs_slow
        name= _ "swarms slow ships"
        description= _ "Fighters swarm slow ships: +2 damage against ships with 4 or fewer moves, unless they have point-defense."
        add=2
        [filter_opponent]
            formula="max_moves <= 4"
            [not]
                ability=sc_point_defense
            [/not]
        [/filter_opponent]
    [/damage]
    [damage]
        id=sc_fighters_vs_fast
        name= _ "outrun by fast ships"
        description= _ "Fast ships dodge most fighters: −1 damage against ships with 6 moves, −2 against ships with 7 or more."
        add=-1
        [filter_opponent]
            formula="max_moves = 6"
        [/filter_opponent]
    [/damage]
    [damage]
        id=sc_fighters_vs_very_fast
        add=-2
        [filter_opponent]
            formula="max_moves >= 7"
        [/filter_opponent]
    [/damage]
#enddef

#define SC_ABILITY_POINT_DEFENSE
    [dummy]
        id=sc_point_defense
        name= _ "point-defense"
        description= _ "Point-defense lasers shoot down Ur-Quan fighters: they hit this ship at most 50% of the time, wherever it is, and get no bonus against it for being slow."
    [/dummy]
#enddef

# Slylandro Probe: refuels by mining asteroids.
#define SC_ABILITY_ASTEROID_HARVEST
    [regenerate]
        id=sc_asteroid_harvest
        name= _ "asteroid harvesting"
        description= _ "The probe breaks up asteroids for raw material: in an asteroid field it repairs 8 HP every turn, and poison is cured."
        value=8
        affect_self=yes
        poison=cured
        [filter]
            [filter_location]
                terrain={SC_HIDE_ASTEROIDS}
            [/filter_location]
        [/filter]
    [/regenerate]
#enddef

# Utwig Jugger: its shield soaks up hits and turns them into battery power.
#define SC_ABILITY_ABSORB_SHIELD
    [resistance]
        id=sc_absorb_shield
        name= _ "absorbing shield"
        description= _ "When attacked, the Utwig raise their shield, which drinks the energy of incoming shots: +30% resistance to all damage, up to a maximum of 60%. Mycon plasmoids are soaked up and do only half damage, even when this ship is the attacker."
        add=30
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
    [/resistance]
#enddef

# Pkunk Fury: Pkunk often come back from the dead (see sc.pkunk_rebirth).
#define SC_ABILITY_REINCARNATION
    [dummy]
        id=sc_reincarnation
        name= _ "reincarnation"
        description= _ "When this ship is destroyed, its Pkunk crew may be reborn: the ship comes back in the same place with full HP, but can't move or attack until its next turn. The chance is 80% the first time and halves with every rebirth (40%, 20%, ...)."
    [/dummy]
#enddef

# Precursor Flagship: copes with rough space (it has 4 moves and hyperjump).
#define SC_ABILITY_PRECURSOR_DRIVE
    [dummy]
        id=sc_precursor_drive
        name= _ "Precursor drive"
        description= _ "Precursor engines: this large hull moves 1 hex for 1 move through green nebulae and dust clouds, 2 through badlands, 1 through light badlands, and 3 through asteroid fields and dense asteroids. Its defense is the same as any large hull's."
    [/dummy]
#enddef

# Chmmr Avatar: lighter on its feet than other large hulls.
#define SC_ABILITY_CHMMR_DRIVE
    [dummy]
        id=sc_chmmr_drive
        name= _ "Chmmr drive"
        description= _ "Precursor-grade engines: this large hull moves 1 hex for 1 move through green nebulae and dust clouds, 2 through badlands, 1 through light badlands, and 3 through asteroid fields and dense asteroids. Its defense is the same as any large hull's."
    [/dummy]
#enddef

# Ships at home in the badlands. The moves and defense themselves are set
# in each ship's [movement_costs] and [defense]; this is what players read.
#define SC_ABILITY_BADLANDS_RUNNER MOVES DEFENSE LIGHT_MOVES WHY
    [dummy]
        id=sc_badlands_runner
        name= _ "badlands runner"
        description={WHY} + _ " In badlands this ship needs " + "{MOVES}" + _ " move(s) and has " + "{DEFENSE}" + _ "% defense; light badlands cost it " + "{LIGHT_MOVES}" + _ " move."
    [/dummy]
#enddef

# Hierarchy Starbase: a repair dock for the ships around it.
#define SC_ABILITY_REPAIR_DOCK
    [heals]
        id=sc_repair_dock
        name= _ "repair dock"
        description= _ "Ships docked next to this starbase are repaired: allied ships next to it recover 8 HP every turn, and poison is cured."
        value=8
        poison=cured
        affect_allies=yes
        affect_self=no
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
        [/affect_adjacent]
    [/heals]
#enddef

# Hierarchy Starbase: the same red force field that cages Earth.
#define SC_ABILITY_SLAVE_SHIELD
    [resistance]
        id=sc_slave_shield
        name= _ "slave-shield projector"
        description= _ "When attacked, the starbase wraps itself in the red force field the Ur-Quan use to cage conquered worlds: +20% resistance to all damage, up to a maximum of 50%."
        add=20
        max_value=50
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
    [/resistance]
#enddef

# Alliance Starbase: its shield generators cover the ships around it.
#define SC_ABILITY_DEFENSE_GRID
    [resistance]
        id=sc_defense_grid
        name= _ "defense grid"
        description= _ "The starbase's shield generators reach out to the ships around it: allied ships next to it get +10% resistance to all damage, up to a maximum of 60%."
        add=10
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        affect_self=no
        affect_allies=yes
        [affect_adjacent]
        [/affect_adjacent]
    [/resistance]
#enddef
