#textdomain wesnoth-Star_Control_TC
# Ship abilities. The ones marked "right-click" are worked by the menu
# items and events in lua/sc.lua; their entries here only explain them.

#define SC_ABILITY_FORCE_SHIELD
    [resistance]
        id=sc_force_shield
        name= _ "force shield"
        description= _ "When attacked, this ship raises its force shield: +40% resistance to all damage, or +50% against ranged attacks, up to a maximum of 60%. Mycon plasmoids splash harmlessly off it and do only half damage, even when this ship is the attacker."
        add=40
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
    [/resistance]
    # Same id, so the larger bonus wins (+50 instead of +40) against ranged.
    # No name: the tooltip above already explains it.
    [resistance]
        id=sc_force_shield
        add=50
        max_value=60
        apply_to=blade,pierce,impact,fire,cold,arcane
        active_on=defense
        affect_self=yes
        [filter_second_weapon]
            range=ranged
        [/filter_second_weapon]
    [/resistance]
#enddef

# Mycon plasmoids: slow balls of plasma that Yehat and Utwig shields soak up.
#define SC_SPECIAL_ABSORBED_BY_SHIELDS
    [damage]
        id=sc_absorbed_by_shields
        name= _ "absorbed by shields"
        description= _ "Yehat force shields and Utwig absorbing shields soak up plasmoids: against those ships this attack does half damage, whoever attacks."
        multiply=0.5
        [filter_opponent]
            ability=sc_force_shield,sc_absorb_shield
        [/filter_opponent]
    [/damage]
#enddef

#define SC_ABILITY_CLOAK
    [hides]
        id=sc_cloak
        name= _ "cloaking device"
        description= _ "This ship is invisible to the enemy unless an enemy ship is next to it. Attacking reveals it for the rest of the turn.

An enemy ship that stumbles onto a cloaked ship loses the rest of its movement, except in the badlands, where it only has to stop."
        affect_self=yes
    [/hides]
#enddef

#define SC_ABILITY_REGROW VALUE
    [regenerate]
        id=sc_regrow_crew
        name= _ "regrow crew"
        description= _ "This ship grows new crew: it recovers {VALUE} HP every turn without having to sit at a planet. Poison is also cured."
        value={VALUE}
        affect_self=yes
        poison=cured
    [/regenerate]
#enddef

#define SC_ABILITY_REGROW_CREW
    {SC_ABILITY_REGROW 6}
#enddef

#define SC_ABILITY_SELF_REPAIR
    [regenerate]
        id=sc_self_repair
        name= _ "self-repair"
        description= _ "Repair robots patch the hull: this ship recovers 4 HP every turn without having to sit at a planet. Poison is also cured."
        value=4
        affect_self=yes
        poison=cured
    [/regenerate]
#enddef

# Ambush: hidden from the enemy in certain terrain, unless an enemy ship is
# next to it. Never in open space, badlands, planets or starbases.
#   TERRAIN is a terrain list (see SC_HIDE_* below), WHERE the tooltip text.
#define SC_ABILITY_AMBUSH ID TERRAIN WHERE
    [hides]
        id={ID}
        name= _ "ambush"
        description= _ "This ship can hide in " + {WHERE} + _ ": it is invisible to the enemy there unless an enemy ship is next to it. Attacking reveals it for the rest of the turn.

An enemy ship that stumbles onto a hidden ship loses the rest of its movement."
        affect_self=yes
        [filter]
            [filter_location]
                terrain={TERRAIN}
            [/filter_location]
        [/filter]
    [/hides]
#enddef

#define SC_HIDE_NEBULA
Yn,Yn^Ya,Yn^Yad#enddef
#define SC_HIDE_RED
Yr,Yr^Ya,Yr^Yad#enddef
#define SC_HIDE_DUST
Yd,Yd^Ya,Yd^Yad#enddef
#define SC_HIDE_BADLANDS
Yi,Yi^Ya,Yi^Yad,Yis,Yis^Ya,Yis^Yad,Yif,Yif^Ya,Yif^Yad#enddef
#define SC_HIDE_ASTEROIDS
*^Ya,*^Yad#enddef

#define SC_ABILITY_HYPERJUMP
    [teleport]
        id=sc_hyperjump
        name= _ "hyperjump"
        description= _ "This ship can jump between any two empty planets held by its side, using one move point (Arilou Skiff, Precursor Flagship)."
        [tunnel]
            id=sc_hyperjump_tunnel
            [source]
                terrain=*^V*
                formula="owner_side = teleport_unit.side_number and (unit = teleport_unit or not unit) where unit = unit_at(loc)"
            [/source]
            [target]
                terrain=*^V*
                formula="owner_side = teleport_unit.side_number and not unit_at(loc)"
            [/target]
            [filter]
                ability=sc_hyperjump
            [/filter]
        [/tunnel]
    [/teleport]
#enddef

#define SC_SPECIAL_GLORY_DEVICE
    [chance_to_hit]
        id=sc_unavoidable
        name= _ "unavoidable"
        description= _ "This attack always hits."
        value=100
        cumulative=no
    [/chance_to_hit]
    [dummy]
        id=sc_self_destruct
        name= _ "self-destruct"
        description= _ "The ship blows itself apart to strike: it is destroyed when the attack ends, and the target gets no chance to fire back. Leaders don't carry it, and a ship never fires it in self-defense."
    [/dummy]
    # The target can't return fire: the Scout is gone in the blast.
    [disable]
        id=sc_no_return_fire
        apply_to=opponent
        active_on=offense
    [/disable]
#enddef

#define SC_ABILITY_TRANSFORM
    [dummy]
        id=sc_transform
        name= _ "transform"
        description= _ "Right-click the ship and choose “Transform” instead of moving and attacking. The X-Wing (slow, twin lasers) and the Y-Wing (fast, homing torpedoes) are the same ship in two shapes; either can be recruited."
    [/dummy]
#enddef

# --- hull classes: a fixed trait on every ship, so the side panel shows it
# (hover for the full terrain table). No effect of its own.
#define SC_HULL_LARGE
    [trait]
        id=sc_hull_large
        availability=musthave
        male_name= _ "large hull"
        female_name= _ "large hull"
        description= _ "Big and slow to manoeuvre: easy to hit, and far too big to enter asteroid fields."
        help_text= _ "Big and slow to manoeuvre: easy to hit, and far too big to enter asteroid fields.

open space: 1 move, 30% defense
green nebula: 2 moves, 40% defense
red nebula: 2 moves, 40% defense
dust cloud: 2 moves, 20% defense
badlands: 3 moves, 10% defense
light badlands: 2 moves, 20% defense
asteroid field: cannot enter
dense asteroids: cannot enter
planet: 1 move, 50% defense
starbase / dock: 1 move, 50% defense

Asteroids over nebula or dust: the better defense and the slower movement of the two. Thin badlands: the better of open space and badlands. A few ships have their own red nebula values, listed in their own abilities."
    [/trait]
#enddef
