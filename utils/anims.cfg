#textdomain wesnoth-Star_Control_TC
# Animation helpers. Every ship has six pre-rotated sprites,
# units/sc/<IMG>-<facing>.png, so Wesnoth's automatic left/right mirroring
# is switched off and the matching sprite is picked for each hex facing.

#define SC_FACING_FRAMES IMG FRAME_KEYS
    [if]
        direction=n
        [frame]
            image="units/sc/{IMG}-n.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/if]
    [else]
        direction=ne
        [frame]
            image="units/sc/{IMG}-ne.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=se
        [frame]
            image="units/sc/{IMG}-se.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=s
        [frame]
            image="units/sc/{IMG}-s.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=sw
        [frame]
            image="units/sc/{IMG}-sw.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=nw
        [frame]
            image="units/sc/{IMG}-nw.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
#enddef

# SC_FACING_FRAMES for an attack with a missile: the missile leaves from the
# ship's nose, not its centre (utils/noses.cfg, by tools/make_noses.py, gives
# where the nose is). The offset shares the facing's [if] chain: a separate
# direction chain would get crossed with it (see SC_HELLFIRE_FACING). It ends
# at 0.8, Wesnoth's default. SC_MISSILE_FACING_FRAMES takes the offsets
# straight (n, s) and diagonal.
#define SC_MISSILE_FACING_FRAMES IMG OFFSET OFFSET_DIAG FRAME_KEYS
    [if]
        direction=n
        missile_offset={OFFSET}
        [frame]
            image="units/sc/{IMG}-n.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/if]
    [else]
        direction=ne
        missile_offset={OFFSET_DIAG}
        [frame]
            image="units/sc/{IMG}-ne.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=se
        missile_offset={OFFSET_DIAG}
        [frame]
            image="units/sc/{IMG}-se.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=s
        missile_offset={OFFSET}
        [frame]
            image="units/sc/{IMG}-s.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=sw
        missile_offset={OFFSET_DIAG}
        [frame]
            image="units/sc/{IMG}-sw.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=nw
        missile_offset={OFFSET_DIAG}
        [frame]
            image="units/sc/{IMG}-nw.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
#enddef

#define SC_SHOT_FACING_FRAMES IMG FRAME_KEYS
    {SC_MISSILE_FACING_FRAMES {IMG} ({SC_NOSE_{IMG}}~0.8) ({SC_NOSE_DIAG_{IMG}}~0.8) {FRAME_KEYS}}
#enddef

# Base look of a ship. Wesnoth builds the standing, moving, defending,
# recruiting and other default animations from this one.
#define SC_SHIP_ANIMS IMG
    [animation]
        apply_to=default
        start_time=0
        {SC_FACING_FRAMES {IMG} (duration=150)}
    [/animation]
    {SC_SHIP_DEATH {IMG} no ship-death}
    {SC_SHIP_DEATH {IMG} yes leader-death}
#enddef

# A ship blowing up: Star Control 2's cloud of small booms; a leader's also
# has the big boom on top (make_art.py's build_ship_death).
#   LEADER  yes or no (canrecruit)   HALO  ship-death or leader-death
#define SC_SHIP_DEATH IMG LEADER HALO
    [death]
        [filter]
            canrecruit={LEADER}
            # a Shofixti going out with its Glory Device has its own
            [not]
                status=sc_glory
            [/not]
        [/filter]
        start_time=0
        {SC_FACING_FRAMES {IMG} (
            duration=500
            alpha=1~0:500
        )}
        boom_start_time=0
        [boom_frame]
            duration=2380
            halo="halo/sc/{HALO}-[1~34].png:70"
            auto_hflip=no
            auto_vflip=no
        [/boom_frame]
        sound_start_time=0
        [sound_frame]
            duration=1
            sound=sc/ship-dies.wav
        [/sound_frame]
    [/death]
#enddef

# A weapon that fires a projectile (works for melee and ranged).
#   IMG     ship sprite stem       WEAPON  attack name
#   PROJ    projectile stem        SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  projectile flight time in ms
#define SC_SHOT_ANIM IMG WEAPON PROJ SOUND FLIGHT
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_SHOT_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# SC_SHOT_ANIM that also plays a voice line when the shot hits (the Pkunk
# insults). INSULTS is a comma-separated sound list; Wesnoth picks one at
# random each time.
#   IMG     ship sprite stem       WEAPON  attack name
#   PROJ    projectile stem        SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  projectile flight time in ms
#   INSULTS sounds to pick from on a hit
#define SC_SHOT_INSULT_ANIM IMG WEAPON PROJ SOUND FLIGHT INSULTS
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_SHOT_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        [if]
            hits=yes
            {SC_IMPACT_HALO_FRAME 240 "halo/sc/blast-[1~8].png:30"}
            insult_start_time=0
            [insult_frame]
                duration=1
                sound={INSULTS}
            [/insult_frame]
        [/if]
        [else]
            hits=no
        [/else]
    [/attack_anim]
#enddef

# The Pkunk Fury's insults from Star Control II (in SC2 the Fury shouts them
# to recharge its energy).
#define SC_PKUNK_INSULTS
sc/pkunk-insult-01.wav,sc/pkunk-insult-02.wav,sc/pkunk-insult-03.wav,sc/pkunk-insult-04.wav,sc/pkunk-insult-05.wav,sc/pkunk-insult-06.wav,sc/pkunk-insult-07.wav,sc/pkunk-insult-08.wav,sc/pkunk-insult-09.wav,sc/pkunk-insult-10.wav,sc/pkunk-insult-11.wav,sc/pkunk-insult-12.wav,sc/pkunk-insult-13.wav,sc/pkunk-insult-14.wav#enddef

# The ship's shield flashes on when an enemy shot misses it (the Yehat force
# shield, as Star Control II draws it: a white ring round the hull, with its
# sound). The shielded sprites are units/sc/<IMG>-shield-<facing>.png.
# While the ship fights with UNSHIELDED (the weapon that drops its shield),
# a miss shows the plain ship instead: in a defend animation
# [filter_second_attack] is the ship's own weapon, and the better-matching
# animation wins.
#   IMG     ship sprite stem       SHIELD  shield sound in sounds/sc/ (no .wav)
#   UNSHIELDED  attack name
#define SC_SHIELD_DEFEND_ANIM IMG SHIELD UNSHIELDED
    [defend]
        hits=no
        start_time=-100
        {SC_FACING_FRAMES {IMG}-shield (duration=400)}
        sound_start_time=-100
        [sound_frame]
            duration=1
            sound=sc/{SHIELD}.wav
        [/sound_frame]
    [/defend]
    [defend]
        [filter_second_attack]
            name={UNSHIELDED}
        [/filter_second_attack]
        hits=no
        start_time=-100
        {SC_FACING_FRAMES {IMG} (duration=400)}
    [/defend]
#enddef

# SC_SHOT_ANIM with the weapon's own explosion where it hits (the Earthling
# nuke's expanding fireball and shock ring from Star Control II).
#   IMG     ship sprite stem       WEAPON  attack name
#   PROJ    projectile stem        SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  projectile flight time in ms
#   BOOM    explosion halo frames  BOOM_TIME  its total length in ms
#define SC_SHOT_BOOM_ANIM IMG WEAPON PROJ SOUND FLIGHT BOOM BOOM_TIME
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_SHOT_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_HALO_FRAMES {BOOM_TIME} {BOOM}}
    [/attack_anim]
#enddef

# The weapon's own explosion where it hits, with Star Control II's damage
# boom: SC2 plays a bigger boom the more crew a hit kills (weapon.c: boom1 for
# 1, boom23 for 2-3, boom45 for 4-5, boom67 for 6+). Wesnoth hit points run
# about twice SC2 crew, so the tiers here are doubled: 1-3, 4-7, 8-11, 12+.
#   DURATION  total length in ms    HALO  halo frame list
#define SC_IMPACT_HALO_FRAME DURATION HALO
        impact_start_time=0
        [impact_frame]
            duration={DURATION}
            halo={HALO}
            offset=1.0
            auto_hflip=no
            auto_vflip=no
            layer=60
        [/impact_frame]
#enddef

#define SC_IMPACT_HALO_BOOM_FRAMES DURATION HALO
    [if]
        hits=yes
        value=1,2,3
        {SC_IMPACT_HALO_FRAME {DURATION} {HALO}}
        landing_start_time=0
        [landing_frame]
            duration=1
            sound=sc/boom-small.wav
        [/landing_frame]
    [/if]
    [else]
        hits=yes
        value=4,5,6,7
        {SC_IMPACT_HALO_FRAME {DURATION} {HALO}}
        landing_start_time=0
        [landing_frame]
            duration=1
            sound=sc/boom-medium.wav
        [/landing_frame]
    [/else]
    [else]
        hits=yes
        value=8,9,10,11
        {SC_IMPACT_HALO_FRAME {DURATION} {HALO}}
        landing_start_time=0
        [landing_frame]
            duration=1
            sound=sc/boom-large.wav
        [/landing_frame]
    [/else]
    [else]
        hits=yes
        {SC_IMPACT_HALO_FRAME {DURATION} {HALO}}
        landing_start_time=0
        [landing_frame]
            duration=1
            sound=sc/boom-huge.wav
        [/landing_frame]
    [/else]
    [else]
        hits=no
    [/else]
#enddef

# SC_SHOT_BOOM_ANIM with SC2's damage boom where it hits (the Mycon plasmoid).
#   IMG     ship sprite stem       WEAPON  attack name
#   PROJ    projectile stem        SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  projectile flight time in ms
#   BOOM    explosion halo frames  BOOM_TIME  its total length in ms
#define SC_SHOT_BOOM_DAMAGE_ANIM IMG WEAPON PROJ SOUND FLIGHT BOOM BOOM_TIME
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_SHOT_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_HALO_BOOM_FRAMES {BOOM_TIME} {BOOM}}
    [/attack_anim]
#enddef

# A projectile shot that also makes a sound when it hits (the Chenjesu
# photon crystals: shards close up, UQM's 6+ damage boom at range; a VUX
# limpet biting onto a hull). The hit's halo shares the sound's hits=yes
# branch.
#   IMG     ship sprite stem       WEAPON  attack name
#   PROJ    projectile stem        SOUND   firing sound in sounds/sc/ (no .wav)
#   FLIGHT  projectile flight time in ms
#   LANDING sound in sounds/sc/ (no .wav) played when the shot hits
#   BOOM    halo frames where it hits  BOOM_TIME  their total length in ms
#define SC_SHOT_LANDING_SOUND_ANIM IMG WEAPON PROJ SOUND FLIGHT LANDING BOOM BOOM_TIME
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_SHOT_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        [if]
            hits=yes
            impact_start_time=0
            [impact_frame]
                duration={BOOM_TIME}
                halo={BOOM}
                offset=1.0
                auto_hflip=no
                auto_vflip=no
                layer=60
            [/impact_frame]
            landing_start_time=0
            [landing_frame]
                duration=1
                sound=sc/{LANDING}.wav
            [/landing_frame]
        [/if]
        [else]
            hits=no
        [/else]
    [/attack_anim]
#enddef

# A laser or lightning beam (Star Control II draws lasers as lines, not
# shots): from the nose to the target, for TIME ms, flickering through its
# frames. The beams are drawn for each sprite by tools/make_beams.py and
# centred halfway (SC_BEAM_MID_* in utils/beams.cfg).
#   IMG     ship sprite stem       WEAPON  attack name
#   BEAM    laser or lightning     FRAMES  frame list, e.g. [1,2,1,2]
#   SOUND   sound in sounds/sc/ (no .wav)
#   HIT_EXTRA  more frames shown only when it hits, or ()
#define SC_BEAM_ANIM IMG WEAPON BEAM FRAMES SOUND TIME HIT_EXTRA
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{TIME}
        {SC_MISSILE_FACING_FRAMES {IMG} {SC_BEAM_MID_{IMG}} {SC_BEAM_MID_DIAG_{IMG}} (duration=500)}
        missile_start_time=-{TIME}
        [missile_frame]
            duration={TIME}
            image="projectiles/sc/beams/{IMG}-{BEAM}-{FRAMES}-n.png"
            image_diagonal="projectiles/sc/beams/{IMG}-{BEAM}-{FRAMES}-ne.png"
        [/missile_frame]
        sound_start_time=-{TIME}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        # SC_IMPACT_FRAMES, with HIT_EXTRA in the same hits=yes branch (a
        # second hits chain would get crossed with it)
        [if]
            hits=yes
            impact_start_time=0
            [impact_frame]
                duration=240
                halo="halo/sc/blast-[1~8].png:30"
                offset=1.0
                auto_hflip=no
                auto_vflip=no
                layer=60
            [/impact_frame]
            {HIT_EXTRA}
        [/if]
        [else]
            hits=no
        [/else]
    [/attack_anim]
#enddef

# A zap from a ship that looks the same whichever way it faces, fired from
# an emitter off its middle (the Alliance Starbase's dome). Its beams, one
# per direction, are halos on a canvas centred on the ship (see FIXED in
# tools/make_beams.py), so nothing is flipped.
#   IMG     ship sprite stem       WEAPON  attack name
#   ZAP     beam name              FRAMES  frame list, 40 ms each, e.g. [1,2,1]
#   SOUND   sound in sounds/sc/ (no .wav)
#   TIME    length of the frame list in ms
#define SC_FIXED_ZAP_FACING IMG DIR ZAP FRAMES TIME
    direction={DIR}
    [frame]
        image="units/sc/{IMG}-{DIR}.png"
        auto_hflip=no
        auto_vflip=no
        duration=500
    [/frame]
    zap_start_time=-{TIME}
    [zap_frame]
        duration={TIME}
        halo="projectiles/sc/beams/{IMG}-{ZAP}-{FRAMES}-{DIR}.png:40"
        offset=0.0
        auto_hflip=no
        auto_vflip=no
        layer=60
    [/zap_frame]
#enddef

#define SC_FIXED_ZAP_ANIM IMG WEAPON ZAP FRAMES SOUND TIME
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{TIME}
        offset=0
        [if]
            {SC_FIXED_ZAP_FACING {IMG} n {ZAP} {FRAMES} {TIME}}
        [/if]
        [else]
            {SC_FIXED_ZAP_FACING {IMG} ne {ZAP} {FRAMES} {TIME}}
        [/else]
        [else]
            {SC_FIXED_ZAP_FACING {IMG} se {ZAP} {FRAMES} {TIME}}
        [/else]
        [else]
            {SC_FIXED_ZAP_FACING {IMG} s {ZAP} {FRAMES} {TIME}}
        [/else]
        [else]
            {SC_FIXED_ZAP_FACING {IMG} sw {ZAP} {FRAMES} {TIME}}
        [/else]
        [else]
            {SC_FIXED_ZAP_FACING {IMG} nw {ZAP} {FRAMES} {TIME}}
        [/else]
        sound_start_time=-{TIME}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# One of the red ion sparks the Chmmr megawatt laser leaves along its
# length (chmmr.c: a new one most battle frames while the laser is held, at a
# random point between the ship and the end of the beam, for 9 frames).
# Here they show only when the laser hits.
#   ID      frame prefix number    START   start time in ms
#   OFFSET  where along the beam   X, Y    nudge off the beam, in px
#define SC_CHMMR_ION ID START OFFSET X Y
    ion{ID}_start_time={START}
    [ion{ID}_frame]
        duration=378
        halo="halo/sc/chmmr-ion-[1~9].png:42"
        offset={OFFSET}
        halo_x={X}
        halo_y={Y}
        auto_hflip=no
        auto_vflip=no
        layer=60
    [/ion{ID}_frame]
#enddef

#define SC_CHMMR_IONS
    {SC_CHMMR_ION 1 -240 0.62 2 -1}
    {SC_CHMMR_ION 2 -200 0.88 -3 2}
    {SC_CHMMR_ION 3 -160 0.71 1 3}
    {SC_CHMMR_ION 4 -120 0.95 2 -2}
    {SC_CHMMR_ION 5 -80 0.56 -2 1}
    {SC_CHMMR_ION 6 -40 0.80 3 0}
#enddef

# The Syreen song: a ring wiggles round the Syreen while waves ripple
# out from its nose in a wedge towards the target and, when it hits, the
# lured crew float back (three little groups of green dots). The waves are
# images centred on the nose (offset SC_NOSE_<sprite>, a fraction of the
# way to the target), drawn facing n and ne and flipped like a missile for
# the other facings. Image frames show from the start of the animation, so
# each wave waits behind a blank frame for DELAY ms.
#   IMG     ship sprite stem       WEAPON  attack name
#   SOUND   sound in sounds/sc/ (no .wav)
#define SC_SONG_WIGGLE
    wiggle_start_time=-600
    [wiggle_frame]
        duration=588
        halo="halo/sc/song-ring-[1~14].png:42"
        offset=0.0
        auto_hflip=no
        auto_vflip=no
        layer=60
    [/wiggle_frame]
#enddef
#define SC_SONG_RING IMG ID DELAY
    ring{ID}_start_time=-600
    [ring{ID}_frame]
        duration={DELAY}
        image=misc/blank-hex.png
    [/ring{ID}_frame]
    [ring{ID}_frame]
        duration=420
        image="projectiles/sc/song-[1~10]-n.png:42"
        image_diagonal="projectiles/sc/song-[1~10]-ne.png:42"
        offset={SC_NOSE_{IMG}}
        auto_hflip=yes
        auto_vflip=yes
        layer=60
    [/ring{ID}_frame]
#enddef

#define SC_SONG_CREW ID START X
    crew{ID}_start_time={START}
    [crew{ID}_frame]
        duration=600
        halo="halo/sc/crew-[1~2,1~2,1~2].png:100"
        halo_x={X}
        offset=1.0~0.1
        auto_hflip=no
        auto_vflip=no
        layer=60
    [/crew{ID}_frame]
#enddef

#define SC_SONG_ANIM IMG WEAPON SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-600
        offset=0
        {SC_FACING_FRAMES {IMG} (duration=1300)}
        {SC_SONG_WIGGLE}
        {SC_SONG_RING {IMG} 1 1}
        {SC_SONG_RING {IMG} 2 180}
        {SC_SONG_RING {IMG} 3 360}
        sound_start_time=-600
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        [if]
            hits=yes
            {SC_SONG_CREW 1 0 0}
            {SC_SONG_CREW 2 100 -7}
            {SC_SONG_CREW 3 200 6}
        [/if]
        [else]
            hits=no
        [/else]
    [/attack_anim]
#enddef

# Ilwrath Hellfire: a steady stream of fireballs that grow as they fly from
# the bow to the target, so the flame stays on screen for the whole strike
# instead of one quick shot. Halos, not images, so each puff waits for its
# own start time (see SC_IMPACT_FRAMES). TIP puts the first puff on the
# ship's bow; it is a fraction of the distance to the target, which is
# shorter on diagonals, so straight and diagonal attacks need their own.
# offset=0 keeps the hull still instead of the default melee lunge.
#   IMG     ship sprite stem       WEAPON  attack name
#   SOUND   sound in sounds/sc/ (no .wav)
#define SC_HELLFIRE_PUFF ID START TIP
    puff{ID}_start_time={START}
    [puff{ID}_frame]
        duration=320
        halo="halo/sc/hellfire-[1~8].png:40"
        offset={TIP}~1.0
        auto_hflip=no
        auto_vflip=no
        layer=60
    [/puff{ID}_frame]
#enddef

#define SC_HELLFIRE_PUFFS TIP
    {SC_HELLFIRE_PUFF 1 -320 {TIP}}
    {SC_HELLFIRE_PUFF 2 -260 {TIP}}
    {SC_HELLFIRE_PUFF 3 -200 {TIP}}
    {SC_HELLFIRE_PUFF 4 -140 {TIP}}
    {SC_HELLFIRE_PUFF 5 -80 {TIP}}
    {SC_HELLFIRE_PUFF 6 -20 {TIP}}
#enddef

# One facing of the Hellfire: the ship sprite and its fireballs together.
# Facing and puff offset must share one [if] chain: two separate direction
# chains get crossed by Wesnoth into branches that pair a diagonal attack
# with the north sprite, and the ship flips between facings mid-attack.
#define SC_HELLFIRE_FACING IMG DIR TIP
    direction={DIR}
    [frame]
        image="units/sc/{IMG}-{DIR}.png"
        auto_hflip=no
        auto_vflip=no
        duration=640
    [/frame]
    {SC_HELLFIRE_PUFFS {TIP}}
#enddef

#define SC_HELLFIRE_ANIM IMG WEAPON SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-320
        offset=0
        [if]
            {SC_HELLFIRE_FACING {IMG} n 0.38}
        [/if]
        [else]
            {SC_HELLFIRE_FACING {IMG} ne 0.47}
        [/else]
        [else]
            {SC_HELLFIRE_FACING {IMG} se 0.47}
        [/else]
        [else]
            {SC_HELLFIRE_FACING {IMG} s 0.38}
        [/else]
        [else]
            {SC_HELLFIRE_FACING {IMG} sw 0.47}
        [/else]
        [else]
            {SC_HELLFIRE_FACING {IMG} nw 0.47}
        [/else]
        sound_start_time=-320
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# Flash where a shot lands (only when it hits). It is a halo, not an
# image: Wesnoth draws a layer's image from the start of the whole
# animation, before its own start time, so an image flash would show while
# the shot is still flying; halos wait for their start time.
#define SC_IMPACT_FRAMES
    {SC_IMPACT_HALO_FRAMES 240 "halo/sc/blast-[1~8].png:30"}
#enddef

# SC_IMPACT_FRAMES with the weapon's own explosion in place of the blast.
#   DURATION  total length in ms    HALO  halo frame list
#define SC_IMPACT_HALO_FRAMES DURATION HALO
    [if]
        hits=yes
        impact_start_time=0
        [impact_frame]
            duration={DURATION}
            halo={HALO}
            offset=1.0
            auto_hflip=no
            auto_vflip=no
            layer=60
        [/impact_frame]
    [/if]
    [else]
        hits=no
    [/else]
#enddef

# One Ur-Quan fighter of a swarm. It flies from the hangar to just short of
# the target, swinging SPREAD pixels to the side so the wing fans out, then
# strafes across it (sliding on to SWING) and peels away, staying clear of
# the hull so the laser bolts show. CURVE is its offset over the flight:
# the lead fighter goes straight, the other hangs back and catches up. They
# all start at the start of the animation (images show from then anyway),
# so the stagger lives in CURVE and the fade-in, not in start times.
#define SC_FIGHTER_WING ID FLIGHT CURVE FADE SPREAD SWING
    wing{ID}_start_time=-{FLIGHT}
    [wing{ID}_frame]
        duration={FLIGHT}
        image="projectiles/sc/fighter-n.png"
        image_diagonal="projectiles/sc/fighter-ne.png"
        offset={CURVE}
        directional_x=0~{SPREAD}
        alpha={FADE}
        layer=60
    [/wing{ID}_frame]
    [wing{ID}_frame]
        duration=260
        image="projectiles/sc/fighter-n.png"
        image_diagonal="projectiles/sc/fighter-ne.png"
        offset=0.6~0.68
        directional_x={SPREAD}~{SWING}
        alpha=1,1~0
        layer=60
    [/wing{ID}_frame]
#enddef

# Ur-Quan fighters: a pair launches with the hangar sound, fans
# out across the gap and strafes the target with a burst of laser bolts
# (fighter-zap, a halo on the target hex) and the laser sound, both only
# when the strike hits. offset=0 keeps the hull still
# instead of the default melee lunge; the hull frame runs to the end of
# the strafe for both the close (220 ms) and far (340 ms) flights.
#   IMG     ship sprite stem       WEAPON  attack name
#   FLIGHT  flight time in ms
#define SC_FIGHTER_SWARM_ANIM IMG WEAPON FLIGHT
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        offset=0
        {SC_FACING_FRAMES {IMG} (duration=600)}
        {SC_FIGHTER_WING 1 {FLIGHT} 0~0.6 1 -20 -32}
        {SC_FIGHTER_WING 2 {FLIGHT} (0~0.12,0.12~0.6) (0~1,1) 20 32}
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/urquan-launch.wav
        [/sound_frame]
        [if]
            hits=yes
            laser_start_time=0
            [laser_frame]
                duration=80
                sound=sc/urquan-fighter-laser.wav
            [/laser_frame]
            [laser_frame]
                duration=80
                sound=sc/urquan-fighter-laser.wav
            [/laser_frame]
            [laser_frame]
                duration=80
                sound=sc/urquan-fighter-laser.wav
            [/laser_frame]
            impact_start_time=0
            [impact_frame]
                duration=240
                halo="halo/sc/fighter-zap-[1~6].png:40"
                offset=1.0
                auto_hflip=no
                auto_vflip=no
                layer=60
            [/impact_frame]
        [/if]
        [else]
            hits=no
        [/else]
    [/attack_anim]
#enddef

# A weapon that sits in front of the ship instead of flying (Zoq-Fot-Pik
# tongue), with SC2's damage boom when it hits (the tongue is a weapon
# element in zoqfot.c, so weapon.c plays the boom for the crew it kills).
#define SC_CONE_ANIM IMG WEAPON PROJ SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-250
        {SC_FACING_FRAMES {IMG} (duration=500)}
        cone_start_time=-250
        [cone_frame]
            duration=350
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
            offset=0.55
            alpha=0.3~1:100,1:150,1~0:100
        [/cone_frame]
        sound_start_time=-250
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_HALO_BOOM_FRAMES 240 "halo/sc/blast-[1~8].png:30"}
    [/attack_anim]
#enddef

# One napalm blob of the Thraddash afterburner trail (thradd.c drops one
# each battle frame, 42 ms, where the ship is). It waits WAIT ms, then
# starts big, flickers between its two biggest frames and burns down, like
# flame_napalm_preprocess but quicker. Images, not halos, so the trail is
# drawn under the ship (layer 55, the attacking hull is on 60); an image
# layer shows from the start of the animation to its end, so empty frames
# before and after keep each blob to its own time.
#define SC_NAPALM_BLOB ID WAIT AT
    napalm{ID}_start_time=-250
    [napalm{ID}_frame]
        duration={WAIT}
    [/napalm{ID}_frame]
    [napalm{ID}_frame]
        duration=400
        image="halo/sc/napalm-[8,7,8,7,6,5,4,3,2,1].png:40"
        offset={AT}
        auto_hflip=no
        auto_vflip=no
        layer=55
    [/napalm{ID}_frame]
    [napalm{ID}_frame]
        duration=1
    [/napalm{ID}_frame]
#enddef

# The trail: one blob every 42 ms while the hull lunges out to 0.6, each
# dropped at the hull's tail (about 0.3 of the way to the target behind its
# centre, a little more on diagonals, where hexes are closer).
#define SC_NAPALM_TRAIL AT0 AT1 AT2 AT3 AT4 AT5
    {SC_NAPALM_BLOB 0 1 {AT0}}
    {SC_NAPALM_BLOB 1 42 {AT1}}
    {SC_NAPALM_BLOB 2 84 {AT2}}
    {SC_NAPALM_BLOB 3 126 {AT3}}
    {SC_NAPALM_BLOB 4 168 {AT4}}
    {SC_NAPALM_BLOB 5 210 {AT5}}
#enddef

# One facing of the afterburner: the lunging ship and its trail together
# (one [if] chain, see SC_HELLFIRE_FACING).
#define SC_AFTERBURNER_FACING IMG DIR AT0 AT1 AT2 AT3 AT4 AT5
    direction={DIR}
    [frame]
        image="units/sc/{IMG}-{DIR}.png"
        auto_hflip=no
        auto_vflip=no
        duration=500
        offset=0~0.6:250,0.6~0:250
    [/frame]
    {SC_NAPALM_TRAIL {AT0} {AT1} {AT2} {AT3} {AT4} {AT5}}
#enddef

# Thraddash afterburner: the ship lunges at the target and leaves a trail
# of burning napalm behind it, as Star Control II's Torch does.
#   IMG     ship sprite stem       WEAPON  attack name
#   SOUND   sound in sounds/sc/ (no .wav)
#define SC_AFTERBURNER_ANIM IMG WEAPON SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-250
        [if]
            {SC_AFTERBURNER_FACING {IMG} n -0.3 -0.2 -0.1 0.0 0.1 0.2}
        [/if]
        [else]
            {SC_AFTERBURNER_FACING {IMG} ne -0.34 -0.24 -0.14 -0.04 0.06 0.16}
        [/else]
        [else]
            {SC_AFTERBURNER_FACING {IMG} se -0.34 -0.24 -0.14 -0.04 0.06 0.16}
        [/else]
        [else]
            {SC_AFTERBURNER_FACING {IMG} s -0.3 -0.2 -0.1 0.0 0.1 0.2}
        [/else]
        [else]
            {SC_AFTERBURNER_FACING {IMG} sw -0.34 -0.24 -0.14 -0.04 0.06 0.16}
        [/else]
        [else]
            {SC_AFTERBURNER_FACING {IMG} nw -0.34 -0.24 -0.14 -0.04 0.06 0.16}
        [/else]
        sound_start_time=-250
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# One facing of the Umgah cone strike: the ship with the cone halo on for
# CONE ms at offset OUT, then for REST ms more at offset BACK with REST_MOD
# applied to the halo ("~O(0)" puts it out; it is not simply left off,
# because a unit that ends its animation on a frame with no halo shows a
# blink before the next strike). The halo moves with the ship.
# The halo is centred on the ship's hex and Wesnoth mirrors a frame's halo
# left to right when the unit faces west, so the eastern facings' images
# serve the western ones too; HALO names which. They are baked per Drone
# level with the cone's narrow end on the nose
# (tools/make_umgah_cone_halos.py).
#define SC_UMGAH_CONE_FACING_FRAMES IMG LEVEL DIR HALO CONE REST REST_MOD OUT BACK
    [frame]
        image="units/sc/{IMG}-{DIR}.png"
        halo="halo/sc/umgah-cone-l{LEVEL}-{HALO}.png"
        auto_hflip=no
        auto_vflip=no
        duration={CONE}
        offset={OUT}
    [/frame]
    [frame]
        image="units/sc/{IMG}-{DIR}.png"
        halo="halo/sc/umgah-cone-l{LEVEL}-{HALO}.png"
        halo_mod={REST_MOD}
        auto_hflip=no
        auto_vflip=no
        duration={REST}
        offset={BACK}
    [/frame]
#enddef

#define SC_UMGAH_CONE_FRAMES IMG LEVEL CONE REST REST_MOD OUT BACK
    [if]
        direction=n
        {SC_UMGAH_CONE_FACING_FRAMES {IMG} {LEVEL} n n {CONE} {REST} {REST_MOD} {OUT} {BACK}}
    [/if]
    [else]
        direction=ne
        {SC_UMGAH_CONE_FACING_FRAMES {IMG} {LEVEL} ne ne {CONE} {REST} {REST_MOD} {OUT} {BACK}}
    [/else]
    [else]
        direction=se
        {SC_UMGAH_CONE_FACING_FRAMES {IMG} {LEVEL} se se {CONE} {REST} {REST_MOD} {OUT} {BACK}}
    [/else]
    [else]
        direction=s
        {SC_UMGAH_CONE_FACING_FRAMES {IMG} {LEVEL} s s {CONE} {REST} {REST_MOD} {OUT} {BACK}}
    [/else]
    [else]
        direction=sw
        {SC_UMGAH_CONE_FACING_FRAMES {IMG} {LEVEL} sw se {CONE} {REST} {REST_MOD} {OUT} {BACK}}
    [/else]
    [else]
        direction=nw
        {SC_UMGAH_CONE_FACING_FRAMES {IMG} {LEVEL} nw ne {CONE} {REST} {REST_MOD} {OUT} {BACK}}
    [/else]
#enddef

# The Umgah antimatter cone, on for the whole strike whether it hits or
# misses. A strike that hits lunges at the target with the cone and flashes
# on it; a miss keeps the hull still (offset=0: without it Wesnoth gives
# every melee attack that has no missile frames the default 0~0.6,0.6~0
# lunge toward the target). A hit also plays the Umgah's "bakzip" three
# times, back to back (the sample is 120 ms long).
#define SC_UMGAH_CONE_ANIM IMG LEVEL WEAPON SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-250
        offset=0
        sound_start_time=-250
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        [if]
            hits=yes
            {SC_UMGAH_CONE_FRAMES {IMG} {LEVEL} 250 250 "" 0~0.6 0.6~0}
            impact_start_time=0
            [impact_frame]
                duration=240
                halo="halo/sc/blast-[1~8].png:30"
                offset=1.0
                auto_hflip=no
                auto_vflip=no
                layer=60
            [/impact_frame]
            landing_start_time=0
            [landing_frame]
                duration=120
                sound=sc/umgah-bakzip.wav
            [/landing_frame]
            [landing_frame]
                duration=120
                sound=sc/umgah-bakzip.wav
            [/landing_frame]
            [landing_frame]
                duration=1
                sound=sc/umgah-bakzip.wav
            [/landing_frame]
        [/if]
        [else]
            hits=no
            {SC_UMGAH_CONE_FRAMES {IMG} {LEVEL} 250 250 "" 0 0}
        [/else]
    [/attack_anim]
#enddef

# Kohr-Ah F.R.I.E.D. plume frames. OFFSET puts the plumes' base on the
# ship's bow; it is a fraction of the distance to the target, which is
# shorter on diagonals, so straight and diagonal attacks need their own.
#define SC_PLUMES_FRAMES OFFSET
    [cone_frame]
        duration=60
        image="projectiles/sc/fried-plumes-1-n.png"
        image_diagonal="projectiles/sc/fried-plumes-1-ne.png"
        offset={OFFSET}
        layer=60
    [/cone_frame]
    [cone_frame]
        duration=60
        image="projectiles/sc/fried-plumes-2-n.png"
        image_diagonal="projectiles/sc/fried-plumes-2-ne.png"
        offset={OFFSET}
        layer=60
    [/cone_frame]
    [cone_frame]
        duration=80
        image="projectiles/sc/fried-plumes-3-n.png"
        image_diagonal="projectiles/sc/fried-plumes-3-ne.png"
        offset={OFFSET}
        layer=60
    [/cone_frame]
    [cone_frame]
        duration=80
        image="projectiles/sc/fried-plumes-4-n.png"
        image_diagonal="projectiles/sc/fried-plumes-4-ne.png"
        offset={OFFSET}
        layer=60
    [/cone_frame]
    [cone_frame]
        duration=80
        image="projectiles/sc/fried-plumes-3-n.png"
        image_diagonal="projectiles/sc/fried-plumes-3-ne.png"
        offset={OFFSET}
        layer=60
    [/cone_frame]
    [cone_frame]
        duration=120
        image="projectiles/sc/fried-plumes-4-n.png"
        image_diagonal="projectiles/sc/fried-plumes-4-ne.png"
        offset={OFFSET}
        layer=60
        alpha=1~0
    [/cone_frame]
#enddef

# One facing of the F.R.I.E.D.: the ship sprite and its plumes together.
# Like SC_HELLFIRE_FACING, facing and plumes share one [if] chain so Wesnoth
# can't pair a diagonal attack with the north sprite and spin the ship.
#define SC_PLUMES_FACING IMG DIR OFFSET
    direction={DIR}
    [frame]
        image="units/sc/{IMG}-{DIR}.png"
        auto_hflip=no
        auto_vflip=no
        duration=600
    [/frame]
    {SC_PLUMES_FRAMES {OFFSET}}
#enddef

# Kohr-Ah F.R.I.E.D.: three flame plumes fan out from the bow, flicker, fade.
# Only the first strike plays the plumes; later strikes are just a hit flash.
# offset=0 keeps the hull still: without it Wesnoth gives every melee attack
# that has no missile frames the default 0~0.6,0.6~0 lunge toward the target.
#define SC_PLUMES_ANIM IMG WEAPON SOUND OFFSET OFFSET_DIAGONAL
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        swing=2-99
        start_time=-60
        offset=0
        {SC_FACING_FRAMES {IMG} (duration=300)}
        {SC_IMPACT_FRAMES}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        swing=1
        start_time=-320
        offset=0
        cone_start_time=-320
        [if]
            {SC_PLUMES_FACING {IMG} n {OFFSET}}
        [/if]
        [else]
            {SC_PLUMES_FACING {IMG} ne {OFFSET_DIAGONAL}}
        [/else]
        [else]
            {SC_PLUMES_FACING {IMG} se {OFFSET_DIAGONAL}}
        [/else]
        [else]
            {SC_PLUMES_FACING {IMG} s {OFFSET}}
        [/else]
        [else]
            {SC_PLUMES_FACING {IMG} sw {OFFSET_DIAGONAL}}
        [/else]
        [else]
            {SC_PLUMES_FACING {IMG} nw {OFFSET_DIAGONAL}}
        [/else]
        sound_start_time=-320
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# The ship itself turns into something and rams (Androsynth Blazer).
#define SC_RAM_ANIM IMG RAM_IMG WEAPON SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-300
        {SC_FACING_FRAMES {RAM_IMG} (
            duration=500
            offset=0~0.7:250,0.7~0:250
        )}
        sound_start_time=-300
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# ---------------------------------------------------------------------------
# Unit-type helpers (kept here so every unit file reads the same way).

#define SC_SHIP ID NAME RACE IMG HP MOVETYPE MP COST LEVEL USAGE
    id={ID}
    name={NAME}
    race={RACE}
    image="units/sc/{IMG}.png"
    hitpoints={HP}
    movement_type={MOVETYPE}
    movement={MP}
    experience=48
    level={LEVEL}
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost={COST}
    usage={USAGE}
    die_sound=sc/ship-dies.wav
    {SC_SHIP_ANIMS {IMG}}
#enddef

#   SPECIALS: () for none, or ([specials] ... [/specials])
#define SC_ATTACK NAME DESC ICON TYPE RANGE DAMAGE NUMBER SPECIALS
    [attack]
        name={NAME}
        description={DESC}
        icon=attacks/sc/{ICON}.png
        type={TYPE}
        range={RANGE}
        damage={DAMAGE}
        number={NUMBER}
        {SPECIALS}
    [/attack]
#enddef
