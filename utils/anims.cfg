#textdomain wesnoth-Star_Control_TC
# Animation helpers. Every ship has six pre-rotated sprites,
# units/sc/<IMG>-<facing>.png, so Wesnoth's automatic left/right mirroring
# is switched off and the matching sprite is picked for each hex facing.

#define SC_FACING_FRAMES IMG FRAME_KEYS
    [if]
        direction=n
        [frame]
            image="units/sc/{IMG}-n.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/if]
    [else]
        direction=ne
        [frame]
            image="units/sc/{IMG}-ne.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=se
        [frame]
            image="units/sc/{IMG}-se.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=s
        [frame]
            image="units/sc/{IMG}-s.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=sw
        [frame]
            image="units/sc/{IMG}-sw.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
    [else]
        direction=nw
        [frame]
            image="units/sc/{IMG}-nw.png"
            auto_hflip=no
            auto_vflip=no
            {FRAME_KEYS}
        [/frame]
    [/else]
#enddef

# Base look of a ship. Wesnoth builds the standing, moving, defending,
# recruiting and other default animations from this one.
#define SC_SHIP_ANIMS IMG
    [animation]
        apply_to=default
        start_time=0
        {SC_FACING_FRAMES {IMG} (duration=150)}
    [/animation]
    [death]
        start_time=0
        {SC_FACING_FRAMES {IMG} (
            duration=500
            alpha=1~0:500
        )}
        boom_start_time=0
        [boom_frame]
            duration=630
            halo="halo/sc/boom-[1~9].png:70"
            auto_hflip=no
            auto_vflip=no
        [/boom_frame]
        sound_start_time=0
        [sound_frame]
            duration=1
            sound=sc/ship-dies.wav
        [/sound_frame]
    [/death]
#enddef

# A weapon that fires a projectile (works for melee and ranged).
#   IMG     ship sprite stem       WEAPON  attack name
#   PROJ    projectile stem        SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  projectile flight time in ms
#define SC_SHOT_ANIM IMG WEAPON PROJ SOUND FLIGHT
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# The Chmmr megawatt laser: a red bolt that shimmers, cycling through the
# four colours UQM gives the laser while it is held down.
#   IMG     ship sprite stem       WEAPON  attack name
#   SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  flight time in ms
#define SC_CHMMR_LASER_ANIM IMG WEAPON SOUND FLIGHT
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/sc/chmmr-laser-[1~4,1~4]-n.png"
            image_diagonal="projectiles/sc/chmmr-laser-[1~4,1~4]-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# A shot that flies mainline's Dark Adept lightning sprite
# (projectiles/darkmissile) instead of an SC projectile.
#   IMG     ship sprite stem       WEAPON  attack name
#   SOUND   sound in sounds/sc/ (no .wav)
#   FLIGHT  flight time in ms
#define SC_ADEPT_BOLT_ANIM IMG WEAPON SOUND FLIGHT
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-{FLIGHT}
        {SC_FACING_FRAMES {IMG} (duration=500)}
        missile_start_time=-{FLIGHT}
        [missile_frame]
            duration={FLIGHT}
            image="projectiles/darkmissile-n.png"
            image_diagonal="projectiles/darkmissile-ne.png"
        [/missile_frame]
        sound_start_time=-{FLIGHT}
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# Flash where a shot lands (only when it hits). It is a halo, not an
# image: Wesnoth draws a layer's image from the start of the whole
# animation, before its own start time, so an image flash would show while
# the shot is still flying; halos wait for their start time.
#define SC_IMPACT_FRAMES
    [if]
        hits=yes
        impact_start_time=0
        [impact_frame]
            duration=240
            halo="halo/sc/blast-[1~8].png:30"
            offset=1.0
            auto_hflip=no
            auto_vflip=no
            layer=60
        [/impact_frame]
    [/if]
    [else]
        hits=no
    [/else]
#enddef

# A weapon that sits in front of the ship instead of flying (Umgah cone).
#define SC_CONE_ANIM IMG WEAPON PROJ SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-250
        {SC_FACING_FRAMES {IMG} (duration=500)}
        cone_start_time=-250
        [cone_frame]
            duration=350
            image="projectiles/sc/{PROJ}-n.png"
            image_diagonal="projectiles/sc/{PROJ}-ne.png"
            offset=0.55
            alpha=0.3~1:100,1:150,1~0:100
        [/cone_frame]
        sound_start_time=-250
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# The ship itself turns into something and rams (Androsynth Blazer).
#define SC_RAM_ANIM IMG RAM_IMG WEAPON SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        start_time=-300
        {SC_FACING_FRAMES {RAM_IMG} (
            duration=500
            offset=0~0.7:250,0.7~0:250
        )}
        sound_start_time=-300
        [sound_frame]
            duration=1
            sound=sc/{SOUND}.wav
        [/sound_frame]
        {SC_IMPACT_FRAMES}
    [/attack_anim]
#enddef

# ---------------------------------------------------------------------------
# Unit-type helpers (kept here so every unit file reads the same way).

#define SC_SHIP ID NAME RACE IMG HP MOVETYPE MP COST LEVEL USAGE
    id={ID}
    name={NAME}
    race={RACE}
    image="units/sc/{IMG}.png"
    hitpoints={HP}
    movement_type={MOVETYPE}
    movement={MP}
    experience=48
    level={LEVEL}
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost={COST}
    usage={USAGE}
    die_sound=sc/ship-dies.wav
    {SC_SHIP_ANIMS {IMG}}
#enddef

#   SPECIALS: () for none, or ([specials] ... [/specials])
#define SC_ATTACK NAME DESC ICON TYPE RANGE DAMAGE NUMBER SPECIALS
    [attack]
        name={NAME}
        description={DESC}
        icon=attacks/sc/{ICON}.png
        type={TYPE}
        range={RANGE}
        damage={DAMAGE}
        number={NUMBER}
        {SPECIALS}
    [/attack]
#enddef
