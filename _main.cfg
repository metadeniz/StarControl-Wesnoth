#textdomain wesnoth-Star_Control_TC
# Star Control total conversion for Battle for Wesnoth 1.16+
# The Ur-Quan War: the old Alliance of Free Stars against the Ur-Quan Hierarchy.

[textdomain]
    name="wesnoth-Star_Control_TC"
    path="data/add-ons/Star_Control_TC/translations"
[/textdomain]

# Credits, shown in Wesnoth's Credits screen (see CREDITS.md)
[about]
    title= _ "Star Control Total Conversion"
    [entry]
        name="Fred Ford and Paul Reiche III (Toys for Bob)"
        comment= _ "Star Control and Star Control II"
    [/entry]
    [entry]
        name="The Ur-Quan Masters"
        comment= _ "ship sprites, weapons, explosions, sounds and music, CC BY-NC-SA 2.5"
    [/entry]
    [entry]
        name="Serosis (JHGuitarFreak) and contributors"
        comment= _ "the UQM MegaMod content"
    [/entry]
    [entry]
        name="Kohr-Ah Death"
        comment= _ "the MegaMod's HD ship art"
    [/entry]
    [entry]
        name="The Precursors"
        comment= _ "UQM Remix Packs"
    [/entry]
    [entry]
        name="Titus, TheMisterCat (DUOLED), DJ Yan Yan Lipavsky, Ramen Rider, Idan Schneider, Anamnesis"
        comment= _ "music"
    [/entry]
[/about]

#ifdef MULTIPLAYER
#define SC_LOAD
#enddef
#endif
#ifdef EDITOR
#define SC_LOAD
#enddef
#endif

#ifdef SC_LOAD
[binary_path]
    path=data/add-ons/Star_Control_TC
[/binary_path]

# Only in Star Control games: a darker, solid shade over the hexes a selected
# ship cannot reach (it replaces core terrain/darken.png; see
# tools/make_reach_shade.py)
#ifdef SC_ERA_UQW
[binary_path]
    path=data/add-ons/Star_Control_TC/reach
[/binary_path]
#endif

{~add-ons/Star_Control_TC/utils/names.cfg}
{~add-ons/Star_Control_TC/terrain/terrain.cfg}
{~add-ons/Star_Control_TC/terrain/terrain-graphics.cfg}
{~add-ons/Star_Control_TC/terrain/badlands-banks.cfg}
{~add-ons/Star_Control_TC/terrain/gas-tiles.cfg}
#endif

#ifdef MULTIPLAYER
{~add-ons/Star_Control_TC/utils/anims.cfg}
{~add-ons/Star_Control_TC/utils/abilities.cfg}

[+units]
    {~add-ons/Star_Control_TC/units/movetypes.cfg}
    {~add-ons/Star_Control_TC/units/races.cfg}
    {~add-ons/Star_Control_TC/units/alliance}
    {~add-ons/Star_Control_TC/units/hierarchy}
    {~add-ons/Star_Control_TC/units/newalliance}
    {~add-ons/Star_Control_TC/units/deathmarch}
[/units]

{~add-ons/Star_Control_TC/themes/sc-theme.cfg}
{~add-ons/Star_Control_TC/era.cfg}
{~add-ons/Star_Control_TC/scenarios}
#endif
