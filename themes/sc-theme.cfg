# The Star Control theme: Wesnoth's Default theme with an animation box in
# the sidebar, just above the End Turn button. The box is the core
# report_clock item, which the engine redraws every frame (most sidebar
# items only redraw when the selection changes); lua/panel.lua replaces its
# contents with the current animation frame.
#undef DEFAULT_FONT_REALLYTINY_HEIGHT_SHORTER
{themes/default.cfg}
#textdomain wesnoth-Star_Control_TC

[+theme]
    id=SC_Theme
    name= _ "Star Control"
    description= _ "The default theme with an animation panel above End Turn"
    hidden=yes
    [+resolution]
        [+status]
            [report_clock]
                id=sc-panel-anim
                ref=button-endturn
                rect="=,=-124,=,+120"
                xanchor=right
                yanchor=bottom
            [/report_clock]
            # Stop the weapon list above the animation box
            [+unit_weapons]
                rect="=+0,+12,=,581"
            [/unit_weapons]
        [/status]
    [/resolution]
[/theme]
