# The Star Control theme: Wesnoth's Default theme with an animation box in
# the sidebar, just above the End Turn button, and a caption line under it.
# They are the core report_clock and report_battery items, which the engine
# redraws every frame (most sidebar items only redraw when the selection
# changes) and which the Default theme doesn't show; lua/panel.lua fills
# them.
#undef DEFAULT_FONT_REALLYTINY_HEIGHT_SHORTER
{themes/default.cfg}
#textdomain wesnoth-Star_Control_TC

[+theme]
    id=SC_Theme
    name= _ "Star Control"
    description= _ "The default theme with an animation panel above End Turn"
    hidden=yes
    [+resolution]
        [+status]
            [report_clock]
                id=sc-panel-anim
                ref=button-endturn
                rect="=,=-124,=,+76"
                xanchor=right
                yanchor=bottom
            [/report_clock]
            # Lined up with the left edge of the 108-wide scene pictures
            [report_battery]
                id=sc-panel-caption
                font_size=13
                rect="=+30,+2,=,+42"
                xanchor=right
                yanchor=bottom
            [/report_battery]
            # Stop the weapon list above the animation box
            [+unit_weapons]
                rect="=+0,+12,=,581"
            [/unit_weapons]
        [/status]
    [/resolution]
[/theme]
