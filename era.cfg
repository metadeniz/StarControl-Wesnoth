#textdomain wesnoth-Star_Control_TC
# The Ur-Quan War: Star Control 1's seven ships a side.

#define SC_MENU_ITEM ID DESC TYPES CONDITION ACTION
    [set_menu_item]
        id={ID}
        description={DESC}
        [show_if]
            [have_unit]
                x,y=$x1,$y1
                side=$side_number
                type={TYPES}
                {CONDITION}
            [/have_unit]
        [/show_if]
        [command]
            [{ACTION}]
                x,y=$x1,$y1
            [/{ACTION}]
        [/command]
    [/set_menu_item]
#enddef

# A faction's icon in the "Choose Your Leader" dialog, centred in a
# transparent 72x100 frame. The taller rows make the faction list tall enough
# that the longest recruit list (the Alliance's eight ships) fits beside it,
# so the dialog no longer grows when a faction is picked.
#define SC_FACTION_ICON IMAGE
"misc/sc-faction-frame.png~BLIT({IMAGE},0,14)"#enddef

[era]
    id=SC_Era_UrQuan_War
    name={SC_NAME_ERA}
    description= _ "The wars of Star Control: the Alliance of Free Stars against the Ur-Quan Hierarchy, and a generation later the New Alliance of Free Stars against the Agents of Death, the destructive forces of the galaxy."
    require_era=yes
    define=SC_ERA_UQW
    # Show the factions in the order they're listed below (Random, Alliance,
    # Hierarchy, New Alliance, Agents of Death) instead of alphabetically.
    # Wesnoth 1.19.13+ sorts by name unless told not to. Older versions
    # ignore this key and always sort by name, so the faction names below
    # carry 3, 2, 1 and 0 leading spaces: spaces sort before letters, which
    # gives the same order there too.
    auto_sort=none

    # The music the Alliance and the Hierarchy start with; each player can
    # switch it during the game ("Switch music" in the right-click menu).
    [options]
        [combo]
            id=sc_music
            name= _ "Music"
            description= _ "What the Alliance and the Hierarchy hear: Star Control II's original tracks, the Precursors' remixes in place of the tracks they remix, or both. Each player can switch during the game with “Switch music” in the right-click menu."
            default=original
            [option]
                name= _ "Original tracks"
                value=original
            [/option]
            [option]
                name= _ "Precursors' remixes"
                value=remixes
            [/option]
            [option]
                name= _ "Both"
                value=both
            [/option]
        [/combo]
        # Deals the planet types out afresh at the start (lua/planets.lua)
        [combo]
            id=sc_planets
            name= _ "Planets"
            description= _ "Which planets are life, mineral and dead worlds. As drawn: as the map has them. Randomized, mirrored: dealt out afresh, following the map's symmetry so every player (or, where the starts aren't alike, every team) gets the same mix. Randomized: dealt out afresh with no mirroring. Either way the map keeps the same number of each type, as near as it can."
            default=map
            [option]
                name= _ "As drawn"
                value=map
            [/option]
            [option]
                name= _ "Randomized, mirrored"
                value=mirrored
            [/option]
            [option]
                name= _ "Randomized"
                value=random
            [/option]
        [/combo]
    [/options]

    [multiplayer_side]
        id=Random
        name= _ "Random"
        image={SC_FACTION_ICON units/random-dice.png}
        random_faction=yes
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_Alliance
        name="   " + {SC_NAME_ALLIANCE}
        image={SC_FACTION_ICON units/sc/earthling-cruiser-l1.png}
        type=random
        # The Alliance Starbase (it can't be recruited) or one of seven
        # captains. "Random", the lobby's default, always gives the
        # Starbase: it draws only from random_leader.
        # Captains start promoted: Elite (level 3) for ships costing 16 or
        # less, Veteran (level 2) for the bigger ones.
        leader=SC_Alliance_Starbase,SC_Earthling_Cruiser_L3,SC_Chenjesu_Broodhome_L2,SC_Mmrnmhrm_XForm_L2,SC_Yehat_Terminator_L2,SC_Syreen_Penetrator_L3,SC_Arilou_Skiff_L3,SC_Shofixti_Scout_L3
        random_leader=SC_Alliance_Starbase
        recruit=SC_Shofixti_Scout,SC_Earthling_Cruiser,SC_Syreen_Penetrator,SC_Arilou_Skiff,SC_Mmrnmhrm_XForm,SC_Mmrnmhrm_YWing,SC_Yehat_Terminator,SC_Chenjesu_Broodhome
        terrain_liked=Ys
        description= _ "Led from an Alliance starbase: Earthlings, Chenjesu, Mmrnmhrm, Yehat, Syreen, Arilou and Shofixti, united against the Ur-Quan."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,scout,fighter,archer
        [/ai]
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_Hierarchy
        name="  " + {SC_NAME_HIERARCHY}
        image={SC_FACTION_ICON units/sc/urquan-dreadnought-l1.png}
        type=random
        # The Hierarchy Starbase (it can't be recruited) or one of seven
        # captains. "Random", the lobby's default, always gives the
        # Starbase: it draws only from random_leader.
        leader=SC_Hierarchy_Starbase,SC_UrQuan_Dreadnought_L2,SC_Mycon_Podship_L2,SC_Spathi_Eluder_L2,SC_Umgah_Drone_L3,SC_VUX_Intruder_L3,SC_Androsynth_Guardian_L3,SC_Ilwrath_Avenger_L3
        random_leader=SC_Hierarchy_Starbase
        recruit=SC_Umgah_Drone,SC_VUX_Intruder,SC_Ilwrath_Avenger,SC_Androsynth_Guardian,SC_Spathi_Eluder,SC_Mycon_Podship,SC_UrQuan_Dreadnought
        terrain_liked=Ys
        description= _ "Led from an Ur-Quan starbase: the Ur-Quan and their battle thralls, the Mycon, Spathi, Umgah, VUX, Androsynth and Ilwrath."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,fighter,archer,scout
        [/ai]
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_NewAlliance
        name=" " + {SC_NAME_NEW_ALLIANCE}
        image={SC_FACTION_ICON units/sc/chmmr-avatar-l1.png}
        type=random
        # The Precursor Flagship (it can't be recruited) or one of six named
        # captains. "Random", the lobby's default, always gives the
        # Precursor Flagship: it draws only from random_leader.
        leader=SC_Precursor_Flagship,SC_Syreen_Penetrator_L3,SC_Arilou_Skiff_L3,SC_Yehat_Terminator_L2,SC_Chmmr_Avatar_L2,SC_Melnorme_Trader_L2,SC_Spathi_Eluder_L2
        random_leader=SC_Precursor_Flagship
        recruit=SC_ZoqFotPik_Stinger,SC_Earthling_Cruiser_NA,SC_Supox_Blade,SC_Melnorme_Trader,SC_Pkunk_Fury,SC_Utwig_Jugger,SC_Chmmr_Avatar
        terrain_liked=Ys
        description= _ "Led by a Precursor flagship: the Chmmr, Zoq-Fot-Pik, Pkunk, Supox, Utwig, Melnorme traders and Earthlings."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,scout,fighter,archer
        [/ai]
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_DeathMarch
        name={SC_NAME_DEATH_MARCH}
        image={SC_FACTION_ICON units/sc/kohrah-marauder-l1.png}
        type=random
        # The Sa-Matra (it can't be recruited) or one of five Agents' ships.
        # "Random", the lobby's default, always gives the Sa-Matra: it draws
        # only from random_leader.
        leader=SC_SaMatra,SC_KohrAh_Marauder_L2,SC_Slylandro_Probe_L3,SC_Orz_Nemesis_L2,SC_Druuge_Mauler_L2,SC_Thraddash_Torch_L3
        random_leader=SC_SaMatra
        recruit=SC_Thraddash_Torch,SC_Ilwrath_Avenger_AC,SC_Slylandro_Probe,SC_Druuge_Mauler,SC_Orz_Nemesis,SC_Mycon_Podship_AC,SC_KohrAh_Marauder
        terrain_liked=Ys
        description= _ "The destroyers of the galaxy, led by the Sa-Matra: the genocidal Kohr-Ah, the slaving Druuge, the brawling Thraddash, runaway Slylandro probes, the unknowable Orz, the fungoid Mycon and the devil-worshipping Ilwrath."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,fighter,archer,scout
        [/ai]
    [/multiplayer_side]

    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<< wesnoth.dofile("~add-ons/Star_Control_TC/lua/sc.lua") >>
        [/lua]
        [lua]
            code=<< wesnoth.dofile("~add-ons/Star_Control_TC/lua/panel.lua") >>
        [/lua]
        [lua]
            code=<< wesnoth.dofile("~add-ons/Star_Control_TC/lua/planets.lua") >>
        [/lua]
        [lua]
            code=<< wesnoth.dofile("~add-ons/Star_Control_TC/lua/sc1.lua") >>
        [/lua]
    [/event]

    [event]
        name=prestart
        # Sidebar with the animation box above End Turn (themes/sc-theme.cfg)
        [change_theme]
            theme=SC_Theme
        [/change_theme]
        [lua]
            code=<< sc.randomize_planets() >>
        [/lua]
        [lua]
            code=<< sc.place_artifacts() >>
        [/lua]
        [lua]
            code=<< sc.setup_planet_income() >>
        [/lua]
        [lua]
            code=<< sc.disarm_leaders(); sc.ai_glory_weight(); sc.ai_no_spread_poison() >>
        [/lua]
        # The New Alliance's leaders always have the same names, not the
        # player's name that multiplayer leaders normally get.
        [sc_name_leaders]
            [captain]
                faction=SC_NewAlliance
                type=SC_Precursor_Flagship
                name={SC_LEADER_NA_PRECURSOR}
            [/captain]
            [captain]
                faction=SC_NewAlliance
                type=SC_Syreen_Penetrator
                name={SC_LEADER_NA_SYREEN}
            [/captain]
            [captain]
                faction=SC_NewAlliance
                type=SC_Arilou_Skiff
                name={SC_LEADER_NA_ARILOU}
            [/captain]
            [captain]
                faction=SC_NewAlliance
                type=SC_Yehat_Terminator
                name={SC_LEADER_NA_YEHAT}
            [/captain]
            [captain]
                faction=SC_NewAlliance
                type=SC_Chmmr_Avatar
                name={SC_LEADER_NA_CHMMR}
            [/captain]
            [captain]
                faction=SC_NewAlliance
                type=SC_Melnorme_Trader
                name={SC_LEADER_NA_MELNORME}
            [/captain]
            [captain]
                faction=SC_NewAlliance
                type=SC_Spathi_Eluder
                name={SC_LEADER_NA_SPATHI}
            [/captain]
        [/sc_name_leaders]
        {SC_MENU_ITEM sc_transform (_ "Transform")
            SC_Mmrnmhrm_XForm,SC_Mmrnmhrm_YWing,SC_Mmrnmhrm_XForm_L2,SC_Mmrnmhrm_YWing_L2,SC_Mmrnmhrm_XForm_L3,SC_Mmrnmhrm_YWing_L3 (lua_function=sc_can_transform) sc_transform}
    [/event]

    [event]
        name=start
        [lua]
            code=<< sc.set_music() >>
        [/lua]
        # unsynced: it changes only this player's music, on any turn.
        # Wesnoth lists menu items in order of id, so the "zz_" keeps this
        # one below the ships' actions.
        [set_menu_item]
            id=zz_sc_music
            description= _ "Switch music"
            synced=no
            [show_if]
                [lua]
                    code=<< return sc.has_music_modes() >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<< sc.next_music_mode() >>
                [/lua]
            [/command]
        [/set_menu_item]
    [/event]

    # Landing on a planet takes an ally's planet at once, or destroys an
    # enemy's; a destroyed or free planet is the ship's side's at its next
    # turn if the ship is still there (see "Taking planets" in lua/sc.lua).
    # Before the planet income below, so it's paid this turn.
    [event]
        name=capture
        first_time_only=no
        [lua]
            code=<< sc.planet_captured() >>
        [/lua]
    [/event]
    # A ship that leaves its planet loses the claim. That's checked when
    # its side's turn ends, not as it moves, so the move can be undone.
    [event]
        name=side turn
        first_time_only=no
        [lua]
            code=<< sc.check_planet_claims(wesnoth.current.side) >>
        [/lua]
    [/event]
    [event]
        name=side turn end
        first_time_only=no
        [lua]
            code=<< sc.check_planet_claims() >>
        [/lua]
    [/event]
    [event]
        name=die
        first_time_only=no
        [lua]
            code=<< sc.check_planet_claims(nil, wesnoth.current.event_context) >>
        [/lua]
    [/event]

    # Planet types pay their own gold and support their own upkeep (see
    # "Planet types" in lua/sc.lua): the side's income is worked out again
    # whenever planets or ships change, and always just before it is paid.
    [event]
        name=start,side turn,turn refresh,capture,post advance,die,turn end
        first_time_only=no
        [lua]
            code=<< sc.update_planet_income() >>
        [/lua]
    [/event]
    [event]
        name=moveto,recruit,recall,unit placed
        first_time_only=no
        [lua]
            code=<< sc.update_planet_income() sc.allow_undo() >>
        [/lua]
    [/event]

    # AI sides' Shofixti never pick the Glory Device by themselves.
    [event]
        name=recruit
        first_time_only=no
        [filter]
            type=SC_Shofixti_Scout
        [/filter]
        [lua]
            code=<< sc.ai_glory_weight() sc.allow_undo() >>
        [/lua]
    [/event]

    # The winner's victory theme, as a sound effect, and its victory picture
    # in a message window.
    [event]
        name=local_victory
        [lua]
            code=<< sc.victory_theme() >>
        [/lua]
    [/event]

    # The winner's victory ditty, unless a Pkunk is reborn (it gets its
    # hallelujah instead).
    [event]
        name=die
        first_time_only=no
        [lua]
            code=<< if not sc.pkunk_rebirth() then sc.victory_ditty() end >>
        [/lua]
    [/event]

    # An Alliance or Hierarchy Starbase destroyed: the "starbase
    # destroyed" scene in the sidebar, after the death explosion (see
    # "Starbase destroyed" in lua/sc.lua).
    [event]
        name=die
        first_time_only=no
        [filter]
            type=SC_Alliance_Starbase,SC_Hierarchy_Starbase
        [/filter]
        [lua]
            code=<< sc.starbase_destroyed() >>
        [/lua]
    [/event]

    # A ship that stumbles onto a hidden enemy stops there but keeps the
    # rest of its movement (see "Ambushes" in lua/sc.lua).
    [event]
        name=exit_hex
        first_time_only=no
        [lua]
            code=<< sc.ambush_exit_hex() sc.allow_undo() >>
        [/lua]
    [/event]
    [event]
        name=enter_hex
        first_time_only=no
        [lua]
            code=<< sc.ambush_enter_hex() sc.allow_undo() >>
        [/lua]
    [/event]
    [event]
        name=moveto
        first_time_only=no
        [lua]
            code=<< sc.allow_undo(sc.ambush_moveto()) >>
        [/lua]
    [/event]

    # Precursor artifacts: found by the first ship to enter the planet.
    [event]
        name=moveto
        first_time_only=no
        [filter]
            [filter_location]
                terrain=*^Vy*
            [/filter_location]
        [/filter]
        [lua]
            code=<< sc.allow_undo(sc.check_artifact()) >>
        [/lua]
    [/event]

    # The Glory Device's damage is rolled just before it goes off.
    [event]
        name=attack
        first_time_only=no
        [filter_attack]
            name=glory_device
        [/filter_attack]
        [lua]
            code=<< sc.glory_roll() >>
        [/lua]
    [/event]

    # The Glory Device destroys the Shofixti that used it, the moment its
    # strike lands (so it never reappears after the explosion).
    [event]
        name=attacker hits,attack end
        first_time_only=no
        [filter_attack]
            name=glory_device
        [/filter_attack]
        [lua]
            code=<< sc.glory_used() >>
        [/lua]
    [/event]

    # A Shofixti destroyed by a close-range attack may set off its Glory
    # Device as it dies, hurting the attacker (see sc.glory_revenge).
    [event]
        name=attack
        first_time_only=no
        [lua]
            code=<< sc.note_attacker() >>
        [/lua]
    [/event]
    [event]
        name=last breath
        first_time_only=no
        [lua]
            code=<< sc.glory_revenge_roll() >>
        [/lua]
    [/event]
    [event]
        name=die
        first_time_only=no
        [lua]
            code=<< sc.glory_revenge() >>
        [/lua]
    [/event]

    # AI sides use the Glory Device.
    # Precursor artifact labels, and Syreen capture animations, last until
    # that side's next turn (Syreen capture labels go at its turn's end).
    [event]
        name=turn refresh
        first_time_only=no
        [lua]
            code=<< sc.expire_artifact_labels() sc.expire_planet_anims() sc.hold_ai_builders() sc.note_transform_moves() >>
        [/lua]
    [/event]

    [event]
        name=side turn end
        first_time_only=no
        [lua]
            code=<< sc.turn_end() sc.expire_syreen_capture_labels() >>
        [/lua]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [lua]
            code=<< sc.note_recruit() sc.allow_undo() >>
        [/lua]
    [/event]

    # Syreen: a huge crew capacity, but a small crew to start with (see
    # "Syreen crew" in lua/sc.lua).
    [event]
        name=prestart
        [lua]
            code=<< sc.syreen_prestart() >>
        [/lua]
    [/event]
    [event]
        name=recruit
        first_time_only=no
        [filter]
            race=sc_syreen
        [/filter]
        [lua]
            code=<< sc.syreen_recruited() sc.allow_undo() >>
        [/lua]
    [/event]
    [event]
        name=advance
        first_time_only=no
        [filter]
            race=sc_syreen
        [/filter]
        [lua]
            code=<< sc.syreen_before_advance() >>
        [/lua]
    [/event]
    [event]
        name=post advance
        first_time_only=no
        [filter]
            race=sc_syreen
        [/filter]
        [lua]
            code=<< sc.syreen_after_advance() >>
        [/lua]
    [/event]
    [event]
        name=side turn
        first_time_only=no
        [lua]
            code=<< sc.colony_before_healing() sc.syreen_before_healing() >>
        [/lua]
    [/event]
    [event]
        name=turn refresh
        first_time_only=no
        [lua]
            code=<< sc.colony_after_healing() sc.syreen_after_healing() >>
        [/lua]
    [/event]
    [event]
        name=capture
        first_time_only=no
        [filter]
            race=sc_syreen
        [/filter]
        [lua]
            code=<< sc.syreen_captured() >>
        [/lua]
    [/event]
    [event]
        name=attack
        first_time_only=no
        [lua]
            code=<< sc.syreen_attack() >>
        [/lua]
    [/event]
    [event]
        name=attack end
        first_time_only=no
        [lua]
            code=<< sc.syreen_attack_end() >>
        [/lua]
    [/event]

    [event]
        name=post advance
        first_time_only=no
        [lua]
            code=<< sc.note_levelup() >>
        [/lua]
    [/event]

    # Prints a line per finished game; used by tools/ai_battles.sh.
    [event]
        name=victory,defeat,time over,enemies defeated
        [lua]
            code=<< sc.report_result() >>
        [/lua]
    [/event]
[/era]

#undef SC_MENU_ITEM
