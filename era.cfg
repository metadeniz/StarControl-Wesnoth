#textdomain wesnoth-Star_Control_TC
# The Ur-Quan War: Star Control 1's seven ships a side.

#define SC_MENU_ITEM ID DESC TYPES CONDITION ACTION
    [set_menu_item]
        id={ID}
        description={DESC}
        [show_if]
            [have_unit]
                x,y=$x1,$y1
                side=$side_number
                type={TYPES}
                {CONDITION}
            [/have_unit]
        [/show_if]
        [command]
            [{ACTION}]
                x,y=$x1,$y1
            [/{ACTION}]
        [/command]
    [/set_menu_item]
#enddef

[era]
    id=SC_Era_UrQuan_War
    name={SC_NAME_ERA}
    description= _ "The war of Star Control: the Alliance of Free Stars against the Ur-Quan Hierarchy, seven ships a side."
    require_era=yes

    [multiplayer_side]
        id=Random
        name= _ "Random"
        image="units/random-dice.png"
        random_faction=yes
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_Alliance
        name={SC_NAME_ALLIANCE}
        image="units/sc/earthling-cruiser.png"
        type=random
        leader=SC_Earthling_Cruiser,SC_Yehat_Terminator,SC_Mmrnmhrm_XForm,SC_Syreen_Penetrator
        random_leader=SC_Earthling_Cruiser,SC_Yehat_Terminator,SC_Mmrnmhrm_XForm
        recruit=SC_Earthling_Cruiser,SC_Chenjesu_Broodhome,SC_Mmrnmhrm_XForm,SC_Yehat_Terminator,SC_Syreen_Penetrator,SC_Arilou_Skiff,SC_Shofixti_Scout
        terrain_liked=Ys
        description= _ "Earthlings, Chenjesu, Mmrnmhrm, Yehat, Syreen, Arilou and Shofixti, united against the Ur-Quan."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,scout,fighter,archer
        [/ai]
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_Hierarchy
        name={SC_NAME_HIERARCHY}
        image="units/sc/urquan-dreadnought.png"
        type=random
        leader=SC_VUX_Intruder,SC_Androsynth_Guardian,SC_Spathi_Eluder,SC_Ilwrath_Avenger
        random_leader=SC_VUX_Intruder,SC_Androsynth_Guardian,SC_Spathi_Eluder
        recruit=SC_UrQuan_Dreadnought,SC_Mycon_Podship,SC_Spathi_Eluder,SC_Umgah_Drone,SC_VUX_Intruder,SC_Androsynth_Guardian,SC_Ilwrath_Avenger
        terrain_liked=Ys
        description= _ "The Ur-Quan and their battle thralls: Mycon, Spathi, Umgah, VUX, Androsynth and Ilwrath."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,fighter,archer,scout
        [/ai]
    [/multiplayer_side]

    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<< wesnoth.dofile("~add-ons/Star_Control_TC/lua/sc.lua") >>
        [/lua]
    [/event]

    [event]
        name=prestart
        {SC_MENU_ITEM sc_glory (_ "Detonate Glory Device")
            SC_Shofixti_Scout () sc_glory_device}
        {SC_MENU_ITEM sc_fighters (_ "Launch Fighters")
            SC_UrQuan_Dreadnought (formula="attacks_left > 0 and hitpoints > 8") sc_launch_fighters}
        {SC_MENU_ITEM sc_transform (_ "Transform")
            SC_Mmrnmhrm_XForm,SC_Mmrnmhrm_YWing (formula="attacks_left > 0 and moves > 0") sc_transform}
    [/event]

    # Fighters dock, and AI sides use the right-click devices.
    [event]
        name=turn refresh
        first_time_only=no
        [lua]
            code=<< sc.ai_turn_start() >>
        [/lua]
    [/event]
    [event]
        name=side turn end
        first_time_only=no
        [lua]
            code=<< sc.turn_end() >>
        [/lua]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [lua]
            code=<< sc.note_recruit() >>
        [/lua]
    [/event]

    # Prints a line per finished game; used by tools/ai_battles.sh.
    [event]
        name=victory,defeat,time over,enemies defeated
        [lua]
            code=<< sc.report_result() >>
        [/lua]
    [/event]
[/era]

#undef SC_MENU_ITEM
