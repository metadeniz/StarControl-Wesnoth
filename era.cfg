#textdomain wesnoth-Star_Control_TC
# The Ur-Quan War: Star Control 1's seven ships a side.

#define SC_MENU_ITEM ID DESC TYPES CONDITION ACTION
    [set_menu_item]
        id={ID}
        description={DESC}
        [show_if]
            [have_unit]
                x,y=$x1,$y1
                side=$side_number
                type={TYPES}
                {CONDITION}
            [/have_unit]
        [/show_if]
        [command]
            [{ACTION}]
                x,y=$x1,$y1
            [/{ACTION}]
        [/command]
    [/set_menu_item]
#enddef

[era]
    id=SC_Era_UrQuan_War
    name={SC_NAME_ERA}
    description= _ "The war of Star Control: the Alliance of Free Stars against the Ur-Quan Hierarchy, seven ships a side."
    require_era=yes

    [multiplayer_side]
        id=Random
        name= _ "Random"
        image="units/random-dice.png"
        random_faction=yes
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_Alliance
        name={SC_NAME_ALLIANCE}
        image="units/sc/earthling-cruiser.png"
        type=random
        # Leaders start promoted: Elite (level 3) for ships costing 16 or less,
        # Veteran (level 2) for the bigger ones.
        leader=SC_Earthling_Cruiser_L3,SC_Chenjesu_Broodhome_L2,SC_Mmrnmhrm_XForm_L2,SC_Yehat_Terminator_L2,SC_Syreen_Penetrator_L3,SC_Arilou_Skiff_L3,SC_Shofixti_Scout_L3
        random_leader=SC_Earthling_Cruiser_L3,SC_Chenjesu_Broodhome_L2,SC_Mmrnmhrm_XForm_L2,SC_Yehat_Terminator_L2,SC_Syreen_Penetrator_L3,SC_Arilou_Skiff_L3,SC_Shofixti_Scout_L3
        recruit=SC_Earthling_Cruiser,SC_Chenjesu_Broodhome,SC_Mmrnmhrm_XForm,SC_Mmrnmhrm_YWing,SC_Yehat_Terminator,SC_Syreen_Penetrator,SC_Arilou_Skiff,SC_Shofixti_Scout
        terrain_liked=Ys
        description= _ "Earthlings, Chenjesu, Mmrnmhrm, Yehat, Syreen, Arilou and Shofixti, united against the Ur-Quan."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,scout,fighter,archer
        [/ai]
    [/multiplayer_side]

    [multiplayer_side]
        id=SC_Hierarchy
        name={SC_NAME_HIERARCHY}
        image="units/sc/urquan-dreadnought.png"
        type=random
        leader=SC_UrQuan_Dreadnought_L2,SC_Mycon_Podship_L2,SC_Spathi_Eluder_L3,SC_Umgah_Drone_L3,SC_VUX_Intruder_L3,SC_Androsynth_Guardian_L3,SC_Ilwrath_Avenger_L3
        random_leader=SC_UrQuan_Dreadnought_L2,SC_Mycon_Podship_L2,SC_Spathi_Eluder_L3,SC_Umgah_Drone_L3,SC_VUX_Intruder_L3,SC_Androsynth_Guardian_L3,SC_Ilwrath_Avenger_L3
        recruit=SC_UrQuan_Dreadnought,SC_Mycon_Podship,SC_Spathi_Eluder,SC_Umgah_Drone,SC_VUX_Intruder,SC_Androsynth_Guardian,SC_Ilwrath_Avenger
        terrain_liked=Ys
        description= _ "The Ur-Quan and their battle thralls: Mycon, Spathi, Umgah, VUX, Androsynth and Ilwrath."
        [ai]
            recruitment_pattern=fighter,archer,mixed fighter,fighter,archer,scout
        [/ai]
    [/multiplayer_side]

    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<< wesnoth.dofile("~add-ons/Star_Control_TC/lua/sc.lua") >>
        [/lua]
    [/event]

    [event]
        name=prestart
        [lua]
            code=<< sc.place_artifacts() >>
        [/lua]
        {SC_MENU_ITEM sc_glory (_ "Detonate Glory Device")
            SC_Shofixti_Scout,SC_Shofixti_Scout_L2,SC_Shofixti_Scout_L3 (canrecruit=no) sc_glory_device}
        {SC_MENU_ITEM sc_transform (_ "Transform")
            SC_Mmrnmhrm_XForm,SC_Mmrnmhrm_YWing,SC_Mmrnmhrm_XForm_L2,SC_Mmrnmhrm_YWing_L2,SC_Mmrnmhrm_XForm_L3,SC_Mmrnmhrm_YWing_L3 (formula="attacks_left > 0 and moves > 0") sc_transform}
    [/event]

    # Precursor artifacts: found by the first ship to enter the planet.
    [event]
        name=moveto
        first_time_only=no
        [filter]
            [filter_location]
                terrain=*^Vyp
            [/filter_location]
        [/filter]
        [lua]
            code=<< sc.check_artifact() >>
        [/lua]
    [/event]

    # AI sides use the Glory Device.
    [event]
        name=side turn end
        first_time_only=no
        [lua]
            code=<< sc.turn_end() >>
        [/lua]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [lua]
            code=<< sc.note_recruit() >>
        [/lua]
    [/event]

    [event]
        name=post advance
        first_time_only=no
        [lua]
            code=<< sc.note_levelup() >>
        [/lua]
    [/event]

    # Prints a line per finished game; used by tools/ai_battles.sh.
    [event]
        name=victory,defeat,time over,enemies defeated
        [lua]
            code=<< sc.report_result() >>
        [/lua]
    [/event]
[/era]

#undef SC_MENU_ITEM
