#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Pkunk_Fury {SC_SHIP_PKUNK_FURY} sc_pkunk pkunk-fury-l1 18 sc_small 7 20 1 fighter}
    advances_to=SC_Pkunk_Fury_L2
    experience=40
    description= _ "The peaceful, mystic Pkunk fly a fast, fragile ship that sprays energy bugs three ways at once at close range, and weaves away from shots fired from afar. A destroyed Pkunk often comes right back: they are reborn."
    [abilities]
        {SC_ABILITY_REINCARNATION}
        {SC_ABILITY_EVASIVE}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK triple_gun (_ "triple gun") bug pierce melee 4 4 ()}
    {SC_SHOT_INSULT_ANIM pkunk-fury-l1 triple_gun bug pkunk-bug 200 {SC_PKUNK_INSULTS}}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Pkunk_Fury_L2 {SC_SHIP_PKUNK_FURY_L2} sc_pkunk pkunk-fury-l2 24 sc_small 7 30 2 fighter}
    advances_to=SC_Pkunk_Fury_L3
    experience=100
    description= _ "A Fury whose crew has been reborn more than once and has grown wiser for it."
    [abilities]
        {SC_ABILITY_REINCARNATION}
        {SC_ABILITY_EVASIVE}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK triple_gun (_ "triple gun") bug pierce melee 5 4 ()}
    {SC_SHOT_INSULT_ANIM pkunk-fury-l2 triple_gun bug pkunk-bug 200 {SC_PKUNK_INSULTS}}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Pkunk_Fury_L3 {SC_SHIP_PKUNK_FURY_L3} sc_pkunk pkunk-fury-l3 30 sc_small 7 40 3 fighter}
    advances_to=null
    experience=120
    description= _ "An elite Fury that flits through enemy lines."
    [abilities]
        {SC_ABILITY_REINCARNATION}
        {SC_ABILITY_EVASIVE}
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK triple_gun (_ "triple gun") bug pierce melee 6 4 ()}
    {SC_SHOT_INSULT_ANIM pkunk-fury-l3 triple_gun bug pkunk-bug 200 {SC_PKUNK_INSULTS}}
[/unit_type]
