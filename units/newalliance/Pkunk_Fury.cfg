    {SC_HULL_SMALL}
    {SC_ATTACK triple_gun (_ "triple gun") bug pierce melee 5 4 ()}
    {SC_ATTACK triple_gun_far (_ "triple gun") bug pierce ranged 4 3 ()}
    {SC_SHOT_ANIM pkunk-fury-l2 triple_gun bug pkunk-bug 200}
    {SC_SHOT_ANIM pkunk-fury-l2 triple_gun_far bug pkunk-bug 260}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Pkunk_Fury_L3 {SC_SHIP_PKUNK_FURY_L3} sc_pkunk pkunk-fury-l3 30 sc_small 7 40 3 (mixed fighter)}
    advances_to=null
