#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Pkunk_Fury {SC_SHIP_PKUNK_FURY} sc_pkunk pkunk-fury-l1 18 sc_small 7 20 1 (mixed fighter)}
    advances_to=SC_Pkunk_Fury_L2
    experience=40
    description= _ "The peaceful, mystic Pkunk fly a fast, fragile ship that sprays energy bugs three ways at once. A destroyed Pkunk often comes right back: they are reborn."
    [abilities]
        {SC_ABILITY_REINCARNATION}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK triple_gun (_ "triple gun") bug pierce melee 4 4 ()}
    {SC_ATTACK triple_gun_far (_ "triple gun") bug pierce ranged 3 3 ()}
    {SC_SHOT_ANIM pkunk-fury-l1 triple_gun bug pkunk-bug 200}
    {SC_SHOT_ANIM pkunk-fury-l1 triple_gun_far bug pkunk-bug 260}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Pkunk_Fury_L2 {SC_SHIP_PKUNK_FURY_L2} sc_pkunk pkunk-fury-l2 24 sc_small 7 30 2 (mixed fighter)}
    advances_to=SC_Pkunk_Fury_L3
    experience=100
    description= _ "A Fury whose crew has been reborn more than once and has grown wiser for it."
    [abilities]
        {SC_ABILITY_REINCARNATION}
