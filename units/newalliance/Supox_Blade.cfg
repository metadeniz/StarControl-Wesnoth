#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Supox_Blade {SC_SHIP_SUPOX_BLADE} sc_supox supox-blade-l1 26 sc_small 6 16 1 (mixed fighter)}
    advances_to=SC_Supox_Blade_L2
    experience=40
    description= _ "The plant-like Supox fly a ship with thrusters on every side: it slides sideways and backwards past enemy ships, and lobs globs of corrosive goo."
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK glob_close (_ "glob") glob cold melee 4 2 ()}
    {SC_ATTACK glob (_ "glob") glob cold ranged 5 3 ()}
    {SC_SHOT_ANIM supox-blade-l1 glob_close glob supox-glob 140}
    {SC_SHOT_ANIM supox-blade-l1 glob glob supox-glob 200}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Supox_Blade_L2 {SC_SHIP_SUPOX_BLADE_L2} sc_supox supox-blade-l2 32 sc_small 6 24 2 (mixed fighter)}
    advances_to=SC_Supox_Blade_L3
    experience=100
    description= _ "A Blade whose globs eat deeper."
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK glob_close (_ "glob") glob cold melee 5 2 ()}
    {SC_ATTACK glob (_ "glob") glob cold ranged 6 3 ()}
    {SC_SHOT_ANIM supox-blade-l2 glob_close glob supox-glob 140}
    {SC_SHOT_ANIM supox-blade-l2 glob glob supox-glob 200}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Supox_Blade_L3 {SC_SHIP_SUPOX_BLADE_L3} sc_supox supox-blade-l3 40 sc_small 6 32 3 (mixed fighter)}
    advances_to=null
    experience=120
    description= _ "An elite Blade. Its gunners rarely miss."
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK glob_close (_ "glob") glob cold melee 6 2 ()}
    {SC_ATTACK glob (_ "glob") glob cold ranged 7 3 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM supox-blade-l3 glob_close glob supox-glob 140}
    {SC_SHOT_ANIM supox-blade-l3 glob glob supox-glob 200}
[/unit_type]
