#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Supox_Blade {SC_SHIP_SUPOX_BLADE} sc_supox supox-blade-l1 26 sc_small 6 12 1 (mixed fighter)}
    advances_to=SC_Supox_Blade_L2
    experience=28
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=60
    [/defense]
    description= _ "The plant-like Supox fly a ship with thrusters on every side: it slides sideways and backwards past enemy ships, and lobs globs of corrosive goo."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 2 40 1 (_ "Thrusters on every side let the Blade sidestep the worst of the storm.")}
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK glob_close (_ "glob") glob cold melee 8 2 ()}
    {SC_ATTACK glob (_ "glob") glob cold ranged 3 4 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM supox-blade-l1 glob_close glob supox-glob 140}
    {SC_SHOT_ANIM supox-blade-l1 glob glob supox-glob 200}
[/unit_type]

