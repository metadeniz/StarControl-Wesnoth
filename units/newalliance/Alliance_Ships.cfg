#textdomain wesnoth-Star_Control_TC
# The New Alliance recruits the Alliance's Earthling Cruiser and Arilou
# Skiff. These copies are identical (they promote into the same Veteran and
# Elite ships) and exist only so the New Alliance's recruit list can sort
# them by cost: Wesnoth sorts that list by name, and the invisible prefix of
# each name sets its place.
[unit_type]
    id=SC_Arilou_Skiff_NA
    [base_unit]
        id=SC_Arilou_Skiff
    [/base_unit]
    name={SC_SHIP_ARILOU_SKIFF_NA}
    hide_help=yes
[/unit_type]

[unit_type]
    id=SC_Earthling_Cruiser_NA
    [base_unit]
        id=SC_Earthling_Cruiser
    [/base_unit]
    name={SC_SHIP_EARTHLING_CRUISER_NA}
    hide_help=yes
[/unit_type]
