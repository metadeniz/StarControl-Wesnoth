#textdomain wesnoth-Star_Control_TC
# The New Alliance recruits the Alliance's Earthling Cruiser. This copy is
# identical (it promotes into the same Veteran and
# Elite ships) and exists only so the New Alliance's recruit list can sort
# it by cost: Wesnoth sorts that list by name, and the invisible prefix of
# each name sets its place.

[unit_type]
    id=SC_Earthling_Cruiser_NA
    [base_unit]
        id=SC_Earthling_Cruiser
    [/base_unit]
    name={SC_SHIP_EARTHLING_CRUISER_NA}
    hide_help=yes
[/unit_type]
