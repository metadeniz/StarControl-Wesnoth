#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Chmmr_Avatar {SC_SHIP_CHMMR_AVATAR} sc_chmmr chmmr-avatar 66 sc_large 4 30 1 archer}
    advances_to=SC_Chmmr_Avatar_L2
    experience=48
    # Chmmr drive: a large hull that handles rough space better than the
    # Ur-Quan and Kohr-Ah ships (see SC_ABILITY_CHMMR_DRIVE).
    [movement_costs]
        nebula=1
        ionstorm=2
        lightstorm=1
        dust=1
        asteroids=3
        dense_asteroids=3
    [/movement_costs]
    description= _ "The Chenjesu and Mmrnmhrm, merged into one race, the Chmmr. Up close, the Avatar's megawatt laser burns through anything and orbiting ZapSats shoot down whatever comes near; at a distance, its tractor beam drags enemies into the laser's path."
    [abilities]
        {SC_ABILITY_CHMMR_DRIVE}
        {SC_ABILITY_POINT_DEFENSE}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK zapsats (_ "ZapSats") zapsat arcane melee 4 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK megawatt_laser (_ "megawatt laser") laser-cyan arcane melee 9 3 ()}
    {SC_ATTACK tractor_laser (_ "tractor beam + laser") laser-blue arcane ranged 7 3 ()}
    {SC_SHOT_ANIM chmmr-avatar megawatt_laser laser-cyan chmmr-laser 140}
    {SC_SHOT_ANIM chmmr-avatar tractor_laser laser-blue chmmr-tractor 220}
    {SC_SHOT_ANIM chmmr-avatar zapsats zapsat chmmr-laser 120}
[/unit_type]

