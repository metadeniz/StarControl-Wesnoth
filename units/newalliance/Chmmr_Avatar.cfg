#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Chmmr_Avatar {SC_SHIP_CHMMR_AVATAR} sc_chmmr chmmr-avatar 66 sc_large 4 30 1 archer}
    advances_to=SC_Chmmr_Avatar_L2
    experience=48
    description= _ "The Chenjesu and Mmrnmhrm, merged into one race, the Chmmr. The Avatar's megawatt laser burns through anything, and orbiting ZapSats shoot down whatever comes close."
    [abilities]
        {SC_ABILITY_POINT_DEFENSE}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK zapsats (_ "ZapSats") zapsat arcane melee 4 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK megawatt_laser (_ "megawatt laser") laser-cyan arcane ranged 10 3 ()}
    {SC_SHOT_ANIM chmmr-avatar zapsats zapsat chmmr-laser 120}
    {SC_SHOT_ANIM chmmr-avatar megawatt_laser laser-cyan chmmr-laser 140}
    {SC_SHOT_ANIM chmmr-avatar tractor_beam laser-blue chmmr-tractor 200}
[/unit_type]

