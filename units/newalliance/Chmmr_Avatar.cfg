#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Chmmr_Avatar {SC_SHIP_CHMMR_AVATAR} sc_chmmr chmmr-avatar-l1 66 sc_large 4 30 1 archer}
    advances_to=SC_Chmmr_Avatar_L2
    experience=50
    # Chmmr drive: a large hull that handles rough space better than the
    # Ur-Quan and Kohr-Ah ships (see SC_ABILITY_CHMMR_DRIVE).
    [movement_costs]
        nebula=1
        ionstorm=2
        lightstorm=1
        dust=1
        asteroids=3
        dense_asteroids=3
    [/movement_costs]
    description= _ "The Chenjesu and Mmrnmhrm, merged into one race, the Chmmr. Its megawatt laser burns through anything at a distance and pins enemy ships in place, slowing them down. Up close, its tractor beam drags enemies into the laser's path, and orbiting ZapSats fire on their own at whatever comes near, hitting even nimble ships, though fewer survive as the Avatar takes damage."
    [abilities]
        {SC_ABILITY_CHMMR_DRIVE}
        {SC_ABILITY_POINT_DEFENSE}
        {SC_ABILITY_CRYSTAL_CREW}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK zapsats (_ "Tractor + ZapSats") zapsat arcane melee 4 5 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
            {SC_SPECIAL_AUTO_TARGETING}
            {WEAPON_SPECIAL_SWARM}
            {SC_SPECIAL_VS_LIGHT_HULLS}
        [/specials]
    )}
    {SC_ATTACK tractor_laser (_ "tractor beam + laser") chmmr-laser-2 arcane melee 9 3 ()}
    {SC_ATTACK megawatt_laser (_ "megawatt laser") chmmr-laser-2 arcane ranged 7 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    )}
    {SC_BEAM_ANIM chmmr-avatar-l1 megawatt_laser laser [1~4,1~4] chmmr-laser-long 240 {SC_CHMMR_IONS}}
    {SC_BEAM_ANIM chmmr-avatar-l1 tractor_laser laser [1~4,1~4] chmmr-tractor-laser 240 {SC_CHMMR_IONS}}
    {SC_SHOT_ANIM chmmr-avatar-l1 zapsats zapsat chmmr-laser 200}
[/unit_type]

