#textdomain wesnoth-Star_Control_TC
# Leader only: the New Alliance's leader is always the Precursor Flagship.
# Level 3, but drawn with the plain level-1 sprite (no glow).
# Levels 1 and 2 below advance into it but are never recruited or given as
# leaders: leaders start at level 3. They show the Precursor blaster's
# weaker hits from Star Control II (power 1 and power 2; the Flagship's is
# power 3).
[unit_type]
    {SC_SHIP SC_Precursor_Flagship_L1 {SC_SHIP_PRECURSOR_FLAGSHIP_L1} sc_precursor precursor-flagship-l1 64 sc_large 4 32 1 archer}
    advances_to=SC_Precursor_Flagship_L2
    experience=50
    # Precursor drive: huge, but fast and nimble in rough space.
    [movement_costs]
        nebula=1
        ionstorm=2
        lightstorm=1
        dust=1
        asteroids=3
        dense_asteroids=3
    [/movement_costs]
    description= _ "A starship left behind by the vanished Precursors, barely woken from its long sleep. Its Precursor drive copes with rough space and can jump between any two empty planets its side holds; its blasters, point-defense lasers and repair systems are only starting to come back to life."
    [abilities]
        {SC_ABILITY_PRECURSOR_DRIVE}
        {SC_ABILITY_HYPERJUMP}
        {ABILITY_LEADERSHIP}
        {ABILITY_HEALS}
        {SC_ABILITY_POINT_DEFENSE}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK point_defense (_ "point-defense laser") laser-white arcane melee 5 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK fusion_blaster (_ "fusion blaster") blaster fire ranged 8 3 ()}
    {SC_SHOT_ANIM precursor-flagship-l1 point_defense laser-white earthling-pd 120}
    {SC_SHOT_BOOM_ANIM precursor-flagship-l1 fusion_blaster blaster flagship-blaster 220 "halo/sc/blaster1-hit-1.png" 84}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Precursor_Flagship_L2 {SC_SHIP_PRECURSOR_FLAGSHIP_L2} sc_precursor precursor-flagship-l1 77 sc_large 4 46 2 archer}
    advances_to=SC_Precursor_Flagship
    experience=100
    # Precursor drive: huge, but fast and nimble in rough space.
    [movement_costs]
        nebula=1
        ionstorm=2
        lightstorm=1
        dust=1
        asteroids=3
        dense_asteroids=3
    [/movement_costs]
    description= _ "A Precursor starship partly refitted by human hands. Its Precursor drive copes with rough space and can jump between any two empty planets its side holds, its fusion blasters hit harder, and its repair systems patch up the ships around it."
    [abilities]
        {SC_ABILITY_PRECURSOR_DRIVE}
        {SC_ABILITY_HYPERJUMP}
        {ABILITY_LEADERSHIP}
        {ABILITY_HEALS}
        {SC_ABILITY_POINT_DEFENSE}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK point_defense (_ "point-defense laser") laser-white arcane melee 5 4 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK fusion_blaster (_ "fusion blaster") blaster fire ranged 10 3 ()}
    {SC_SHOT_ANIM precursor-flagship-l1 point_defense laser-white earthling-pd 120}
    {SC_SHOT_BOOM_ANIM precursor-flagship-l1 fusion_blaster blaster flagship-blaster 220 "halo/sc/blaster2-hit-[1~6].png:42" 252}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Precursor_Flagship {SC_SHIP_PRECURSOR_FLAGSHIP} sc_precursor precursor-flagship-l1 90 sc_large 4 60 3 archer}
    advances_to=null
    experience=150
    # Precursor drive: huge, but fast and nimble in rough space.
    [movement_costs]
        nebula=1
        ionstorm=2
        lightstorm=1
        dust=1
        asteroids=3
        dense_asteroids=3
    [/movement_costs]
    description= _ "A starship left behind by the vanished Precursors, refitted by human hands to lead the New Alliance. It is no racer, but its Precursor drive copes with rough space, and it can jump between any two empty planets its side holds. Its fusion blasters hit hard and true, point-defense lasers sweep away anything that gets close, its repair systems never stop and patch up the ships around it too, and every New Alliance ship nearby fights harder."
    [abilities]
        {SC_ABILITY_PRECURSOR_DRIVE}
        {SC_ABILITY_HYPERJUMP}
        {ABILITY_LEADERSHIP}
        {ABILITY_HEALS}
        {SC_ABILITY_POINT_DEFENSE}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK point_defense (_ "point-defense laser") laser-white arcane melee 6 4 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK fusion_blaster (_ "fusion blaster") blaster fire ranged 11 3 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM precursor-flagship-l1 point_defense laser-white earthling-pd 120}
    {SC_SHOT_BOOM_ANIM precursor-flagship-l1 fusion_blaster blaster flagship-blaster 220 "halo/sc/blaster-hit-[1~7].png:42" 294}
[/unit_type]
