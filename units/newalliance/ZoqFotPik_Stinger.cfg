#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_ZoqFotPik_Stinger {SC_SHIP_ZOQFOTPIK_STINGER} sc_zoqfotpik zoqfotpik-stinger-l1 14 sc_tiny 6 6 1 scout}
    advances_to=SC_ZoqFotPik_Stinger_L2
    experience=10
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=1
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=50
    [/defense]
    description= _ "Three species, one crew. The cheap little Stinger spits globs of acid, and up close its tongue strikes with startling force."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 1 50 1 (_ "The Stinger is small, and its three crews take turns steering through the turbulence.")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK tongue (_ "tongue") tongue blade melee 7 1 ()}
    {SC_ATTACK spit (_ "spit") spit cold ranged 3 3 ()}
    {SC_CONE_ANIM zoqfotpik-stinger-l1 tongue tongue zoqfotpik-tongue}
    {SC_SHOT_ANIM zoqfotpik-stinger-l1 spit spit zoqfotpik-spit 160}
[/unit_type]

[unit_type]
    {SC_SHIP SC_ZoqFotPik_Stinger_L2 {SC_SHIP_ZOQFOTPIK_STINGER_L2} sc_zoqfotpik zoqfotpik-stinger-l2 20 sc_tiny 6 9 2 scout}
