#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Utwig_Jugger {SC_SHIP_UTWIG_JUGGER} sc_utwig utwig-jugger-l1 36 sc_medium 4 22 1 archer}
