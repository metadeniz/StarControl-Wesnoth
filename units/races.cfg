#textdomain wesnoth-Star_Control_TC
# One race per species. Captain names are the ones Star Control gives each
# ship class; a recruited ship gets one at random.

#define SC_RACE ID NAME PLURAL NAMES
    [race]
        id={ID}
        name={NAME}
        plural_name={PLURAL}
        male_name={NAME}
        female_name={NAME}
        male_names={NAMES}
        female_names={NAMES}
        num_traits=0
        ignore_global_traits=yes
        undead_variation=null
    [/race]
#enddef

{SC_RACE sc_earthling {SC_RACE_EARTHLING} {SC_RACE_EARTHLINGS}
