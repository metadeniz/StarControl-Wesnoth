#textdomain wesnoth-Star_Control_TC
# Leader only: the Agents of Chaos are always led by the Sa-Matra.
[unit_type]
    {SC_SHIP SC_SaMatra {SC_SHIP_SAMATRA} sc_samatra samatra 110 sc_large 4 60 3 archer}
    advances_to=null
    experience=150
    # The sprite is 168px wide. Wesnoth 1.18+ derives the bar offset from the
    # width for both axes, lifting the bars 48px above the hex. Keep the
    # left shift (bars at the sprite's left edge) but not the vertical one.
    # These values are screen pixels, so they match exactly at default zoom.
    bar_offset_x=-48
    bar_offset_y=0
    # Precursor drive: as fast as a Chmmr in open space, and rough space
    # barely slows it (see SC_ABILITY_SAMATRA_DRIVE).
    [movement_costs]
        nebula=1
        rednebula=1
        ionstorm=2
        lightstorm=1
        dust=1
        asteroids=1
        dense_asteroids=1
    [/movement_costs]
    description= _ "The Ur-Quan's ultimate battle platform, built by the Dnyarri ages ago. It spits red plasma at anything nearby, launches homing sentinels at distant ships, and hurls green blobs that slam into them and knock them off course. Its ancient engines push it through nebulae and asteroid fields as easily as open space. Its repair systems never stop: they patch up the ships around it too and purge them of poison, and every allied ship nearby fights harder."
    [abilities]
        {SC_ABILITY_SAMATRA_DRIVE}
        {ABILITY_LEADERSHIP}
        {ABILITY_CURES}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK plasma (_ "plasma") fusion fire melee 14 3 ()}
    {SC_ATTACK sentinels (_ "sentinels") sentinel arcane ranged 7 4 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_ATTACK blobs (_ "green blobs") samatra-blob impact ranged 4 4 (
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    )}
    {SC_SHOT_ANIM samatra plasma fusion samatra-plasma 160}
    {SC_SHOT_ANIM samatra sentinels sentinel samatra-sentinels 300}
    {SC_SHOT_ANIM samatra blobs samatra-blob supox-glob 260}
[/unit_type]
