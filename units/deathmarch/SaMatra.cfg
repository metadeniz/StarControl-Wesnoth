#textdomain wesnoth-Star_Control_TC
# Leader only: the Agents of Chaos are always led by the Sa-Matra.
# It starts at level 1 and promotes like any other ship.
[unit_type]
    {SC_SHIP SC_SaMatra {SC_SHIP_SAMATRA} sc_samatra samatra-l1 80 sc_large 3 30 1 archer}
    advances_to=SC_SaMatra_L2
    experience=48
    description= _ "The Ur-Quan's ultimate battle platform, built by the Dnyarri ages ago. It crawls through space, spitting red plasma at anything nearby and launching homing sentinels at distant ships. Its repair systems never stop: they patch up the ships around it too and purge them of poison, and every allied ship nearby fights harder."
    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_CURES}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK plasma (_ "plasma") fusion fire melee 11 3 ()}
    {SC_ATTACK sentinels (_ "sentinels") sentinel arcane ranged 6 3 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM samatra-l1 plasma fusion samatra-plasma 160}
    {SC_SHOT_ANIM samatra-l1 sentinels sentinel samatra-sentinels 300}
[/unit_type]

[unit_type]
    {SC_SHIP SC_SaMatra_L2 {SC_SHIP_SAMATRA_L2} sc_samatra samatra-l2 95 sc_large 3 45 2 archer}
    advances_to=SC_SaMatra_L3
    experience=96
    description= _ "A Sa-Matra grown further into its power: tougher, with hotter plasma and a fourth homing sentinel."
    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_CURES}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK plasma (_ "plasma") fusion fire melee 12 3 ()}
    {SC_ATTACK sentinels (_ "sentinels") sentinel arcane ranged 6 4 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM samatra-l2 plasma fusion samatra-plasma 160}
    {SC_SHOT_ANIM samatra-l2 sentinels sentinel samatra-sentinels 300}
[/unit_type]

[unit_type]
    {SC_SHIP SC_SaMatra_L3 {SC_SHIP_SAMATRA_L3} sc_samatra samatra 110 sc_large 3 60 3 archer}
    advances_to=null
    experience=150
    description= _ "The Sa-Matra at its full, terrible strength: the toughest hull in space, its plasma hottest and its sentinels most numerous."
    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_CURES}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK plasma (_ "plasma") fusion fire melee 14 3 ()}
    {SC_ATTACK sentinels (_ "sentinels") sentinel arcane ranged 7 4 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM samatra plasma fusion samatra-plasma 160}
    {SC_SHOT_ANIM samatra sentinels sentinel samatra-sentinels 300}
