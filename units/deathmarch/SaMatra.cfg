#textdomain wesnoth-Star_Control_TC
# Leader only: the Agents of Chaos are always led by the Sa-Matra.
[unit_type]
    {SC_SHIP SC_SaMatra {SC_SHIP_SAMATRA} sc_samatra samatra 110 sc_large 3 60 3 archer}
    advances_to=null
    experience=150
    # The sprite is wider than a hex; without these the bars, orb and crown
    # are shifted left of the hex by half the extra width.
    bar_offset_x=0
    bar_offset_y=0
    description= _ "The Ur-Quan's ultimate battle platform, built by the Dnyarri ages ago. It crawls through space, spitting red plasma at anything nearby and launching homing sentinels at distant ships. Its repair systems never stop: they patch up the ships around it too and purge them of poison, and every allied ship nearby fights harder."
    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_CURES}
        {SC_ABILITY_SELF_REPAIR}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK plasma (_ "plasma") fusion fire melee 14 3 ()}
    {SC_ATTACK sentinels (_ "sentinels") sentinel arcane ranged 7 4 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM samatra plasma fusion samatra-plasma 160}
    {SC_SHOT_ANIM samatra sentinels sentinel samatra-sentinels 300}
[/unit_type]
