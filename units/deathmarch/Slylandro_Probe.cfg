#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Slylandro_Probe {SC_SHIP_SLYLANDRO_PROBE} sc_slylandro slylandro-probe-l1 24 sc_small 7 16 1 scout}
    advances_to=SC_Slylandro_Probe_L2
    experience=40
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=60
    [/defense]
    description= _ "A self-replicating probe of the gas-bag Slylandro, gone horribly wrong: it attacks every ship it meets with a lightning bolt that seeks its target, and mines asteroids to repair itself."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 2 40 1 (_ "The probes were built to drift through the charged storms of a gas giant.")}
        {SC_ABILITY_ASTEROID_HARVEST}
        {SC_ABILITY_AMBUSH sc_ambush_bad ({SC_HIDE_BADLANDS}) (_ "the badlands")}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK lightning (_ "lightning") lightning arcane melee 5 4 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    )}
    {SC_SHOT_ANIM slylandro-probe-l1 lightning lightning slylandro-lightning 120}
[/unit_type]

[unit_type]
