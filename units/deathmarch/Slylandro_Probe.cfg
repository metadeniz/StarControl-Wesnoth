#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Slylandro_Probe {SC_SHIP_SLYLANDRO_PROBE} sc_slylandro slylandro-probe 24 sc_small 7 17 1 scout}
    advances_to=SC_Slylandro_Probe_L2
    experience=27
    description= _ "A self-replicating probe of the gas-bag Slylandro, gone horribly wrong: it attacks every ship it meets with a lightning bolt that seeks its target, and mines asteroids to repair itself."
    [abilities]
        {SC_ABILITY_ASTEROID_HARVEST}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK lightning (_ "lightning") lightning arcane melee 5 4 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    )}
    {SC_SHOT_ANIM slylandro-probe lightning lightning slylandro-lightning 120}
[/unit_type]

