#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Druuge_Mauler {SC_SHIP_DRUUGE_MAULER} sc_druuge druuge-mauler-l1 34 sc_large 4 15 1 archer}
    advances_to=SC_Druuge_Mauler_L2
    experience=24
    description= _ "The Druuge trade in anything, crews included. The Mauler is a long gun with an engine: its mass driver hits hard from far away and rarely misses, but it has nothing to fight with up close."
    {SC_HULL_LARGE}
    {SC_ATTACK mass_driver (_ "mass driver") mass-driver pierce ranged 13 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM druuge-mauler-l1 mass_driver mass-driver druuge-cannon 260}
[/unit_type]

