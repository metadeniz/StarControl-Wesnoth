#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Druuge_Mauler {SC_SHIP_DRUUGE_MAULER} sc_druuge druuge-mauler-l1 34 sc_large 4 17 1 archer}
    advances_to=SC_Druuge_Mauler_L2
    experience=40
    description= _ "The Druuge trade in anything, crews included. The Mauler is a long gun with an engine: its mass driver hits hard from far away and rarely misses. Up close it can only fire the same gun point-blank, without the range to aim, so it fights back weakly in melee."
    {SC_HULL_LARGE}
    {SC_ATTACK mass_driver_close (_ "mass driver") mass-driver pierce melee 6 2 ()}
    {SC_ATTACK mass_driver (_ "mass driver") mass-driver pierce ranged 13 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_BOOM_ANIM druuge-mauler-l1 mass_driver mass-driver druuge-cannon 260 "halo/sc/mass-driver-hit-[1~8].png:42" 336}
    {SC_SHOT_BOOM_ANIM druuge-mauler-l1 mass_driver_close mass-driver druuge-cannon 200 "halo/sc/mass-driver-hit-[1~8].png:42" 336}
[/unit_type]

