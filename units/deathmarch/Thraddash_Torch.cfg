#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Thraddash_Torch {SC_SHIP_THRADDASH_TORCH} sc_thraddash thraddash-torch-l1 22 sc_small 6 10 1 fighter}
    advances_to=SC_Thraddash_Torch_L2
    experience=28
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=60
    [/defense]
    description= _ "The Thraddash love a fight more than anything. The Torch is fast and cheap, with weak horn blasters and an afterburner that leaves a trail of burning napalm: it charges in recklessly and gets hurt just as badly."
    [abilities]
        {SC_ABILITY_SCOUT}
        {SC_ABILITY_BADLANDS_RUNNER 2 40 1 (_ "A Thraddash just punches through on its afterburner.")}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK afterburner (_ "afterburner") napalm fire melee 5 2 (
        [specials]
            {WEAPON_SPECIAL_CHARGE}
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK horn (_ "horn blaster") horn fire ranged 3 2 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_CONE_ANIM thraddash-torch-l1 afterburner napalm thraddash-afterburner}
    {SC_SHOT_ANIM thraddash-torch-l1 horn horn thraddash-horn 180}
[/unit_type]

