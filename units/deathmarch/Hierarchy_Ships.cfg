#textdomain wesnoth-Star_Control_TC
# The Agents of Death recruit the Hierarchy's Mycon Podship. This copy is
# identical (it promotes into the same Veteran and Elite ships) and exists
# only so the Agents of Death's recruit list can sort it by cost: Wesnoth
# sorts that list by name, and the invisible prefix of each name sets its
# place.
[unit_type]
    id=SC_Mycon_Podship_AC
    [base_unit]
        id=SC_Mycon_Podship
    [/base_unit]
    name={SC_SHIP_MYCON_PODSHIP_AC}
    hide_help=yes
[/unit_type]
