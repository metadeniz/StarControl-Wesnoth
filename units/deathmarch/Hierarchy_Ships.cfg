#textdomain wesnoth-Star_Control_TC
# The Agents of Death recruit the Hierarchy's Ilwrath Avenger and Mycon
# Podship. These copies are identical (they promote into the same Veteran
# and Elite ships) and exist only so the Agents of Death's recruit list can
# sort them by cost: Wesnoth sorts that list by name, and the invisible
# prefix of each name sets its place.
[unit_type]
    id=SC_Ilwrath_Avenger_AC
    [base_unit]
        id=SC_Ilwrath_Avenger
    [/base_unit]
    name={SC_SHIP_ILWRATH_AVENGER_AC}
    hide_help=yes
[/unit_type]

[unit_type]
    id=SC_Mycon_Podship_AC
    [base_unit]
        id=SC_Mycon_Podship
    [/base_unit]
    name={SC_SHIP_MYCON_PODSHIP_AC}
    hide_help=yes
[/unit_type]
