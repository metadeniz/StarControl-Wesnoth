#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Melnorme_Trader {SC_SHIP_MELNORME_TRADER} sc_melnorme melnorme-trader 32 sc_medium 5 18 1 archer}
    advances_to=SC_Melnorme_Trader_L2
    experience=29
    description= _ "The Melnorme sell anything for credits, and sell it to anyone, even the Kohr-Ah. Their Trader rapid-fires a blaster up close, holds its charge for one heavy shot at range, and its confusion ray leaves enemy pilots flying in circles. Its traders patch up the ships around it, for a fee."
    [abilities]
        {ABILITY_HEALS}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK blaster (_ "blaster") charge-blue arcane melee 5 4 ()}
    {SC_ATTACK charged_blaster (_ "charged blaster") charge-red fire ranged 15 1 ()}
    {SC_ATTACK confusion_ray (_ "confusion ray") confuser arcane ranged 3 2 (
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    )}
    {SC_SHOT_ANIM melnorme-trader blaster charge-blue melnorme-blaster 140}
    {SC_SHOT_ANIM melnorme-trader charged_blaster charge-red melnorme-blaster 260}
    {SC_SHOT_ANIM melnorme-trader confusion_ray confuser melnorme-confuser 220}
[/unit_type]

