#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Spathi_Eluder {SC_SHIP_SPATHI_ELUDER} sc_spathi spathi-eluder 30 sc_medium 6 16 1 (mixed fighter)}
    advances_to=SC_Spathi_Eluder_L2
    experience=21
    description= _ "The Spathi value their own survival above all else. Their fast Eluder fires small forward missiles, but its favourite weapon is the B.U.T.T. — a homing torpedo fired backwards at whoever is chasing it."
    {SC_HULL_MEDIUM}
    {SC_ATTACK butt {SC_WPN_BUTT} butt pierce melee 9 2 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK forward_missile (_ "forward missile") spathi-missile pierce ranged 6 3 ()}
    {SC_SHOT_ANIM spathi-eluder butt butt spathi-butt 140}
    {SC_SHOT_ANIM spathi-eluder forward_missile spathi-missile spathi-missile 260}
[/unit_type]

