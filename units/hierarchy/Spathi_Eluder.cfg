#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Spathi_Eluder {SC_SHIP_SPATHI_ELUDER} sc_spathi spathi-eluder-l1 30 sc_medium 6 18 1 (mixed fighter)}
    advances_to=SC_Spathi_Eluder_L2
    experience=40
    description= _ "The Spathi value their own survival above all else. Their fast Eluder carries a small forward howitzer for close work, but its favourite weapon is the B.U.T.T. — a homing torpedo fired backwards at whoever is chasing it."
    {SC_HULL_MEDIUM}
    {SC_ATTACK howitzer (_ "howitzer") spathi-missile pierce melee 6 3 ()}
    {SC_ATTACK butt {SC_WPN_BUTT} butt pierce ranged 9 2 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_SHOT_ANIM spathi-eluder-l1 butt butt spathi-butt 140}
    {SC_SHOT_ANIM spathi-eluder-l1 howitzer spathi-missile spathi-missile 260}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Spathi_Eluder_L2 {SC_SHIP_SPATHI_ELUDER_L2} sc_spathi spathi-eluder-l2 38 sc_medium 6 30 2 (mixed fighter)}
    advances_to=SC_Spathi_Eluder_L3
    experience=100
    description= _ "An Eluder whose captain has perfected the art of running away: it slips out of any engagement at will."
    [abilities]
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_AMBUSH sc_ambush_ast ({SC_HIDE_ASTEROIDS}) (_ "asteroid fields")}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK howitzer (_ "howitzer") spathi-missile pierce melee 7 3 ()}
    {SC_ATTACK butt {SC_WPN_BUTT} butt pierce ranged 11 2 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_SHOT_ANIM spathi-eluder-l2 butt butt spathi-butt 140}
    {SC_SHOT_ANIM spathi-eluder-l2 howitzer spathi-missile spathi-missile 260}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Spathi_Eluder_L3 {SC_SHIP_SPATHI_ELUDER_L3} sc_spathi spathi-eluder-l3 46 sc_medium 6 44 3 (mixed fighter)}
    advances_to=null
    experience=120
    description= _ "An Eluder captained by a Spathi so cowardly it has survived everything. Three B.U.T.T.s per volley."
    [abilities]
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_AMBUSH sc_ambush_ast ({SC_HIDE_ASTEROIDS}) (_ "asteroid fields")}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK howitzer (_ "howitzer") spathi-missile pierce melee 8 3 ()}
    {SC_ATTACK butt {SC_WPN_BUTT} butt pierce ranged 12 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_SHOT_ANIM spathi-eluder-l3 butt butt spathi-butt 140}
    {SC_SHOT_ANIM spathi-eluder-l3 howitzer spathi-missile spathi-missile 260}
[/unit_type]
