    advances_to=SC_Ilwrath_Avenger_L2
    experience=24
    # Red nebula: at home in the heat (fire-worshipping Ilwrath).
    [movement_costs]
        rednebula=1
    [/movement_costs]
    [defense]
        rednebula=40
    [/defense]
    description= _ "The spider-like Ilwrath worship cruelty. Their Avenger stalks its prey under a cloaking device, then uncloaks at point-blank range and pours out Hellfire."
