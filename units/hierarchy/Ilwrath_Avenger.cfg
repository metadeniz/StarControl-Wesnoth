        {SC_ABILITY_CLOAK}
        {SC_RED_AFFINITY 1 60 (_ "The fire-worshipping Ilwrath are at home in hot plasma.")}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK hellfire {SC_WPN_HELLFIRE} hellfire fire melee 9 3 ()}
    {SC_SHOT_ANIM ilwrath-avenger hellfire hellfire ilwrath-hellfire 140}
[/unit_type]

