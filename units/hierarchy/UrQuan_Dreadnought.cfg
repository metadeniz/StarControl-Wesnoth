#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_UrQuan_Dreadnought {SC_SHIP_URQUAN_DREADNOUGHT} sc_urquan urquan-dreadnought-l1 64 sc_large 4 30 1 archer}
    advances_to=SC_UrQuan_Dreadnought_L2
    experience=50
    description= _ "The masters of the Hierarchy fly the most feared ship in the galaxy. The huge, slow Dreadnought fires a devastating close-range fusion blast and launches swarms of autonomous fighters, crewed from its own complement, at near and distant targets alike: the more crew it has lost, the fewer fighters fly. Fighters swarm slow ships but struggle to catch fast ones. The fusion blast is a close-range weapon; the fighters reach near and far."
    {SC_HULL_LARGE}
    {SC_ATTACK fusion_blast_close (_ "fusion blast") fusion fire melee 15 2 ()}
    {SC_ATTACK fighters (_ "fighters") fighter arcane melee 7 4 (
        [specials]
            {WEAPON_SPECIAL_SWARM}
            {SC_SPECIAL_VS_POINT_DEFENSE}
            {SC_SPECIAL_FIGHTER_SPEED}
        [/specials]
    )}
    {SC_ATTACK fighters_far (_ "fighters") fighter arcane ranged 8 4 (
        [specials]
            {WEAPON_SPECIAL_SWARM}
            {SC_SPECIAL_VS_POINT_DEFENSE}
            {SC_SPECIAL_FIGHTER_SPEED}
        [/specials]
    )}
    [resistance]
        pierce=90
        impact=90
    [/resistance]
    {SC_SHOT_BOOM_ANIM urquan-dreadnought-l1 fusion_blast_close fusion urquan-fusion 200 "halo/sc/fusion-hit-[1~8].png:42" 336}
    {SC_FIGHTER_SWARM_ANIM urquan-dreadnought-l1 fighters 220}
    {SC_FIGHTER_SWARM_ANIM urquan-dreadnought-l1 fighters_far 340}
[/unit_type]

