#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_UrQuan_Dreadnought {SC_SHIP_URQUAN_DREADNOUGHT} sc_urquan urquan-dreadnought 64 sc_large 3 28 1 archer}
    advances_to=SC_UrQuan_Dreadnought_L2
    experience=45
    description= _ "The masters of the Hierarchy fly the most feared ship in the galaxy. The huge, slow Dreadnought fires a devastating close-range fusion blast and launches swarms of autonomous fighters, crewed from its own complement, at near and distant targets alike: the more crew it has lost, the fewer fighters fly. The fusion blast is a close-range weapon; the fighters reach near and far."
    {SC_HULL_LARGE}
    {SC_ATTACK fusion_blast_close (_ "fusion blast") fusion fire melee 15 2 ()}
    {SC_ATTACK fighters (_ "fighters") fighter arcane melee 5 4 (
        [specials]
            {WEAPON_SPECIAL_SWARM}
            {SC_SPECIAL_VS_POINT_DEFENSE}
        [/specials]
    )}
    {SC_ATTACK fighters_far (_ "fighters") fighter arcane ranged 6 4 (
        [specials]
            {WEAPON_SPECIAL_SWARM}
            {SC_SPECIAL_VS_POINT_DEFENSE}
        [/specials]
    )}
    [resistance]
        pierce=90
        impact=90
    [/resistance]
    {SC_SHOT_ANIM urquan-dreadnought fusion_blast_close fusion urquan-fusion 160}
    {SC_SHOT_ANIM urquan-dreadnought fighters fighter urquan-launch 220}
    {SC_SHOT_ANIM urquan-dreadnought fighters_far fighter urquan-launch 340}
[/unit_type]

