#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_UrQuan_Dreadnought {SC_SHIP_URQUAN_DREADNOUGHT} sc_urquan urquan-dreadnought 64 sc_large 3 32 1 archer}
    description= _ "The masters of the Hierarchy fly the most feared ship in the galaxy. The huge, slow Dreadnought fires a devastating fusion blast and carries autonomous fighters crewed from its own complement."
    [abilities]
        {SC_ABILITY_LAUNCH_FIGHTERS}
    [/abilities]
    {SC_ATTACK fusion_blast (_ "fusion blast") fusion fire ranged 15 2 ()}
    [resistance]
        pierce=90
        impact=90
    [/resistance]
    {SC_SHOT_ANIM urquan-dreadnought fusion_blast fusion urquan-fusion 240}
[/unit_type]

[unit_type]
    {SC_SHIP SC_UrQuan_Fighter {SC_SHIP_URQUAN_FIGHTER} sc_urquan urquan-fighter 6 sc_tiny 7 0 0 scout}
    description= _ "A tiny fighter launched from an Ur-Quan Dreadnought. It darts in, strafes with its lasers and returns to the mothership."
    do_not_list=yes
    upkeep=loyal
    experience=20
    [abilities]
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_FIGHTER}
    [/abilities]
    {SC_ATTACK fighter_lasers (_ "fighter lasers") laser-white arcane melee 3 3 ()}
    {SC_SHOT_ANIM urquan-fighter fighter_lasers laser-white urquan-fighter-laser 100}
[/unit_type]
