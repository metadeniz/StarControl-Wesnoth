#textdomain wesnoth-Star_Control_TC
# Leader only: the Hierarchy's default leader. A station has no front, so
# every facing uses the same picture.
[unit_type]
    {SC_SHIP SC_Hierarchy_Starbase {SC_SHIP_HIERARCHY_STARBASE} sc_urquan hierarchy-starbase 120 sc_large 3 60 3 archer}
    advances_to=null
    experience=150
    description= _ "An Ur-Quan starbase, like the one the Hierarchy hung over enslaved Earth. It crawls through space under its command saucer, guarded by defense turrets and a bay of autonomous fighters. Damaged ships dock beside it for repairs, battle thralls fight harder in its presence, and when it comes under fire it raises a slave shield."
    [abilities]
        {ABILITY_LEADERSHIP}
        {SC_ABILITY_REPAIR_DOCK}
        {SC_ABILITY_SLAVE_SHIELD}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK defense_turrets (_ "defense turrets") fusion fire melee 8 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK fighter_bays (_ "fighter bays") fighter arcane ranged 7 3 (
        [specials]
            {SC_SPECIAL_VS_POINT_DEFENSE}
            {SC_SPECIAL_FIGHTER_SPEED}
        [/specials]
    )}
    {SC_SHOT_ANIM hierarchy-starbase defense_turrets fusion urquan-fusion 160}
    {SC_FIGHTER_SWARM_ANIM hierarchy-starbase fighter_bays 340}
[/unit_type]
