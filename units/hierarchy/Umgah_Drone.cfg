#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Umgah_Drone {SC_SHIP_UMGAH_DRONE} sc_umgah umgah-drone-l1 16 sc_small 4 7 1 fighter}
    advances_to=SC_Umgah_Drone_L2
    experience=28
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=60
    [/defense]
    description= _ "A stubby, cheap little ship that sprays a short cone of antimatter. Its retro-thrusters zip it straight backwards, so it is hard to pin down."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 2 40 1 (_ "Retro-thrusters let the Drone back straight out of any squall it blunders into.")}
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK antimatter_cone (_ "antimatter cone") cone cold melee 5 4 ()}
    {SC_HELD_CONE_ANIM umgah-drone-l1 antimatter_cone umgah-cone}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Umgah_Drone_L2 {SC_SHIP_UMGAH_DRONE_L2} sc_umgah umgah-drone-l2 22 sc_small 4 15 2 fighter}
    advances_to=SC_Umgah_Drone_L3
    experience=70
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=60
    [/defense]
    description= _ "A Drone with an upgraded antimatter projector, crewed by Umgah bio-engineers who patch up friendly ships alongside."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 2 40 1 (_ "Retro-thrusters let the Drone back straight out of any squall it blunders into.")}
        {ABILITY_SKIRMISHER}
        {ABILITY_HEALS}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK antimatter_cone (_ "antimatter cone") cone cold melee 6 4 ()}
    {SC_HELD_CONE_ANIM umgah-drone-l2 antimatter_cone umgah-cone}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Umgah_Drone_L3 {SC_SHIP_UMGAH_DRONE_L3} sc_umgah umgah-drone-l3 28 sc_small 4 25 3 fighter}
    advances_to=null
    experience=84
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=60
    [/defense]
    description= _ "An elite Drone whose widened cone is almost impossible to dodge. Its bio-engineers can regrow whole crews on the ships around it."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 2 40 1 (_ "Retro-thrusters let the Drone back straight out of any squall it blunders into.")}
        {ABILITY_SKIRMISHER}
        {ABILITY_EXTRA_HEAL}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK antimatter_cone (_ "antimatter cone") cone cold melee 7 5 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    )}
    {SC_HELD_CONE_ANIM umgah-drone-l3 antimatter_cone umgah-cone}
[/unit_type]
