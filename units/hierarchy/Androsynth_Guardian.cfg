#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Androsynth_Guardian {SC_SHIP_ANDROSYNTH_GUARDIAN} sc_androsynth androsynth-guardian-l1 30 sc_medium 4 15 1 (mixed fighter)}
    advances_to=SC_Androsynth_Guardian_L2
    experience=24
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=2
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=70
    [/defense]
    description= _ "The Androsynth, clones who rebelled against Earth, fly a pokey ship that blows wandering bubbles of acid. In a pinch it turns into the Blazer, a flaming comet that rams anything in its path."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 2 30 1 (_ "Androsynth shielding was built for hostile plasma fields.")}
        {SC_ABILITY_AMBUSH sc_ambush_nadb ({SC_HIDE_NEBULA},{SC_HIDE_ASTEROIDS},{SC_HIDE_DUST},{SC_HIDE_BADLANDS}) (_ "green nebulae, asteroid fields, dust clouds and the badlands")}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK blazer {SC_WPN_BLAZER} blazer impact melee 11 2 (
        [specials]
            {WEAPON_SPECIAL_CHARGE}
        [/specials]
    )}
    {SC_ATTACK acid_bubbles (_ "acid bubbles") bubble cold ranged 4 3 (
        [specials]
            {WEAPON_SPECIAL_POISON}
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    [resistance]
        arcane=90
    [/resistance]
    {SC_RAM_ANIM androsynth-guardian-l1 androsynth-blazer-l1 blazer androsynth-blazer}
    {SC_SHOT_ANIM androsynth-guardian-l1 acid_bubbles bubble androsynth-bubbles 420}
[/unit_type]

