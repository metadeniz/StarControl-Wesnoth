#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_VUX_Intruder {SC_SHIP_VUX_INTRUDER} sc_vux vux-intruder 32 sc_medium 3 14 1 archer}
    advances_to=SC_VUX_Intruder_L2
    experience=19
    description= _ "A clumsy ship with a powerful long-range laser. The VUX also seed space with limpets — sticky parasites that cling to enemy hulls and drag them to a crawl."
    {SC_HULL_MEDIUM}
    {SC_ATTACK vux_laser (_ "laser") laser-green arcane ranged 8 3 ()}
    {SC_ATTACK limpets (_ "limpets") limpet blade ranged 2 2 (
        [specials]
            {WEAPON_SPECIAL_SLOW}
