#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_VUX_Intruder {SC_SHIP_VUX_INTRUDER} sc_vux vux-intruder-l1 32 sc_medium 3 12 1 archer}
    advances_to=SC_VUX_Intruder_L2
    experience=28
    # Nebulae, dust, badlands and asteroid fields: no movement penalty, dense asteroids 2 (sc_explorer).
    [movement_costs]
        nebula=1
        rednebula=1
        ionstorm=1
        lightstorm=1
        dust=1
        asteroids=1
        dense_asteroids=2
    [/movement_costs]
    description= _ "A clumsy ship with a powerful short-range laser that fires before an enemy closing in can. The VUX also seed space with limpets — sticky parasites that cling to enemy hulls and drag them to a crawl."
    [abilities]
        {SC_EXPLORER}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK vux_laser (_ "laser") laser-green arcane melee 8 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK limpets (_ "limpets") limpet blade ranged 2 2 (
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    )}
    {SC_SHOT_ANIM vux-intruder-l1 vux_laser laser-green vux-laser 160}
    {SC_SHOT_LANDING_SOUND_ANIM vux-intruder-l1 limpets limpet vux-limpets 420 vux-limpet-bite "projectiles/sc/limpet-n.png" 900}
[/unit_type]

