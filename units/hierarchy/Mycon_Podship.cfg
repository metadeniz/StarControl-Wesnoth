    [/resistance]
    {SC_SHOT_ANIM mycon-podship plasmoid plasmoid mycon-plasmoid 360}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mycon_Podship_L3 {SC_SHIP_MYCON_PODSHIP_L3} sc_mycon mycon-podship 66 sc_large 3 56 3 archer}
    advances_to=null
    experience=78
    # Red nebula: at home in the heat (fire-born Mycon).
    [movement_costs]
        rednebula=1
    [/movement_costs]
    [defense]
        rednebula=40
    [/defense]
    description= _ "An ancient Podship. Anything that comes close is showered with poisonous spores."
    [abilities]
        {SC_ABILITY_REGROW 10}
    [/abilities]
    {SC_ATTACK spore_burst (_ "spore burst") plasmoid fire melee 6 2 (
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    )}
    {SC_ATTACK plasmoid (_ "homing plasmoid") plasmoid fire ranged 17 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    [resistance]
        fire=80
        cold=120
    [/resistance]
    {SC_SHOT_ANIM mycon-podship spore_burst plasmoid mycon-regrow 140}
    {SC_SHOT_ANIM mycon-podship plasmoid plasmoid mycon-plasmoid 360}
[/unit_type]
