#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Mycon_Podship {SC_SHIP_MYCON_PODSHIP} sc_mycon mycon-podship-l1 42 sc_large 3 22 1 archer}
    advances_to=SC_Mycon_Podship_L2
    experience=40
    # Red nebula: at home in the heat (fire-born Mycon).
    [movement_costs]
        rednebula=1
    [/movement_costs]
    [defense]
        rednebula=40
    [/defense]
    description= _ "The fungoid Mycon grow rather than build their ships. The Podship launches homing plasmoids that chase their target down, hurls heavier ones at point-blank range, and it grows fresh crew as it flies."
    [abilities]
        {SC_ABILITY_REGROW 6}
        {SC_RED_AFFINITY 1 60 (_ "The fire-born Mycon are at home in hot plasma.")}
        {SC_ABILITY_AMBUSH sc_ambush_red ({SC_HIDE_RED}) (_ "red nebulae")}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK plasmoid_close (_ "plasmoid") plasmoid fire melee 10 2 (
        [specials]
            {SC_SPECIAL_ABSORBED_BY_SHIELDS}
        [/specials]
    )}
    {SC_ATTACK plasmoid (_ "homing plasmoid") plasmoid fire ranged 8 3 (
        [specials]
            {SC_SPECIAL_ABSORBED_BY_SHIELDS}
        [/specials]
    )}
    [resistance]
        fire=80
        cold=120
    [/resistance]
    {SC_SHOT_BOOM_DAMAGE_ANIM mycon-podship-l1 plasmoid plasmoid mycon-plasmoid 360 "halo/sc/mycon-blast-[1~8,7~1].png:42" 630}
    {SC_SHOT_BOOM_DAMAGE_ANIM mycon-podship-l1 plasmoid_close plasmoid mycon-plasmoid 200 "halo/sc/mycon-blast-[1~8,7~1].png:42" 630}
[/unit_type]

