#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Mycon_Podship {SC_SHIP_MYCON_PODSHIP} sc_mycon mycon-podship 42 sc_large 3 22 1 archer}
    description= _ "The fungoid Mycon grow rather than build their ships. The Podship launches a homing plasmoid that chases its target down, and it grows fresh crew as it flies."
    [abilities]
        {SC_ABILITY_REGROW_CREW}
    [/abilities]
    {SC_ATTACK plasmoid (_ "homing plasmoid") plasmoid fire ranged 12 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    [resistance]
        fire=80
        cold=120
    [/resistance]
    {SC_SHOT_ANIM mycon-podship plasmoid plasmoid mycon-plasmoid 360}
[/unit_type]
