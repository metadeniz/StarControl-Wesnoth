#textdomain wesnoth-Star_Control_TC
# Four hull classes. For each terrain: moves to enter, and Wesnoth's
# "chance to be hit" (60 means a 40% defense).
#
#   space            open, poor cover
#   nebula           slow, good cover
#   rednebula        hot plasma: easier for big hulls than nebula, harder for
#                    small (Mycon, Ilwrath, Chenjesu override it in their files)
#   ionstorm         (water) very slow, very easy to hit
#   dust             (sand) slow, a little easier to hit
#   asteroids        (hills) slow, good cover; large hulls (3 moves) cannot enter
#   dense_asteroids  (mountains) slower, best cover

#define SC_MOVETYPE NAME SPACE_MV SPACE_DEF NEBULA_MV NEBULA_DEF REDNEBULA_MV REDNEBULA_DEF IONSTORM_MV IONSTORM_DEF DUST_MV DUST_DEF ASTEROIDS_MV ASTEROIDS_DEF DENSE_ASTEROIDS_MV DENSE_ASTEROIDS_DEF PLANET_DEF BASE_DEF
    [movetype]
        name={NAME}
        flies=yes
        [movement_costs]
            space={SPACE_MV}
            nebula={NEBULA_MV}
            rednebula={REDNEBULA_MV}
            ionstorm={IONSTORM_MV}
            dust={DUST_MV}
            asteroids={ASTEROIDS_MV}
            dense_asteroids={DENSE_ASTEROIDS_MV}
            planet=1
            starbase=1
            impassable={UNREACHABLE}
            unwalkable={UNREACHABLE}
        [/movement_costs]
        [vision_costs]
            space=1
            nebula=2
            rednebula=2
            ionstorm=1
            dust=1
            asteroids=1
            dense_asteroids=1
            planet=1
            starbase=1
            impassable=1
            unwalkable=1
        [/vision_costs]
        [defense]
            space={SPACE_DEF}
            nebula={NEBULA_DEF}
            rednebula={REDNEBULA_DEF}
            ionstorm={IONSTORM_DEF}
            dust={DUST_DEF}
            asteroids={ASTEROIDS_DEF}
            dense_asteroids={DENSE_ASTEROIDS_DEF}
            planet={PLANET_DEF}
            starbase={BASE_DEF}
            impassable=80
            unwalkable=80
        [/defense]
        [resistance]
            blade=100
            pierce=100
            impact=100
            fire=100
            cold=100
            arcane=100
        [/resistance]
    [/movetype]
#enddef

#                   space  nebula  red    storm  dust   asteroid dense  planet base
{SC_MOVETYPE sc_large  1 70  3 60  2 60  3 90  2 80  4 50  4 40   50  50}
{SC_MOVETYPE sc_medium 1 60  2 50  3 50  3 80  2 70  3 40  3 30   50  40}
{SC_MOVETYPE sc_small  1 50  2 40  3 40  3 70  2 60  2 30  3 30   40  40}
{SC_MOVETYPE sc_tiny   1 40  1 30  2 40  2 60  1 50  2 30  2 30   40  40}

#undef SC_MOVETYPE
