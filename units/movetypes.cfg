#textdomain wesnoth-Star_Control_TC
# Four hull classes. Defense numbers are Wesnoth's "chance to be hit":
# 60 means a 40% defense.

#define SC_MOVETYPE NAME SPACE_MV NEBULA_MV ASTEROID_MV SPACE_DEF NEBULA_DEF ASTEROID_DEF PLANET_DEF BASE_DEF STORM_DEF RED_MV RED_DEF
    [movetype]
        name={NAME}
        flies=yes
        [movement_costs]
            space={SPACE_MV}
            nebula={NEBULA_MV}
            ionstorm=2
            rednebula={RED_MV}
            asteroids={ASTEROID_MV}
            planet=1
            starbase=1
            impassable={UNREACHABLE}
            unwalkable={UNREACHABLE}
        [/movement_costs]
        [vision_costs]
            space=1
            nebula=2
            ionstorm=1
            rednebula=2
            asteroids=1
            planet=1
            starbase=1
            impassable=1
            unwalkable=1
        [/vision_costs]
        [defense]
            space={SPACE_DEF}
            nebula={NEBULA_DEF}
            ionstorm={STORM_DEF}
            rednebula={RED_DEF}
            asteroids={ASTEROID_DEF}
            planet={PLANET_DEF}
            starbase={BASE_DEF}
            impassable=80
            unwalkable=80
        [/defense]
        [resistance]
            blade=100
            pierce=100
            impact=100
            fire=100
            cold=100
            arcane=100
        [/resistance]
    [/movetype]
#enddef

# Ion storm: 2 moves for every hull, and 10% easier to hit than open space.
# Red nebula (hot plasma): big hulls push through more easily than through
# a green nebula, small ones struggle. Some ships override it (Mycon,
# Ilwrath, Chenjesu) in their own unit files.
#                       space neb ast   space neb ast planet base storm  red-mv red-def
{SC_MOVETYPE sc_large      1   3   4      70   60  50   50    50   80      2     60}
{SC_MOVETYPE sc_medium     1   2   3      60   50  40   50    40   70      3     50}
{SC_MOVETYPE sc_small      1   2   2      50   40  30   40    40   60      3     40}
{SC_MOVETYPE sc_tiny       1   1   2      40   30  30   40    40   50      2     40}

#undef SC_MOVETYPE
