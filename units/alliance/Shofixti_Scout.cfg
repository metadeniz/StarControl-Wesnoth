#textdomain wesnoth-Star_Control_TC

# The Glory Device: the scout dives at its target and explodes.
#define SC_GLORY_ANIM
    [attack_anim]
        [filter_attack]
            name=glory_device
        [/filter_attack]
        start_time=-400
        {SC_FACING_FRAMES shofixti-scout (
            duration=400
            offset=0~0.6:400
            alpha=1~0.3:400
        )}
        glory_start_time=-80
        [glory_frame]
            duration=560
            halo="halo/sc/glory-[1~8].png:70"
            offset=1.0
            auto_hflip=no
            auto_vflip=no
        [/glory_frame]
        sound_start_time=-80
        [sound_frame]
            duration=1
            sound=sc/shofixti-glory.wav
        [/sound_frame]
    [/attack_anim]
#enddef

[unit_type]
    {SC_SHIP SC_Shofixti_Scout {SC_SHIP_SHOFIXTI_SCOUT} sc_shofixti shofixti-scout 18 sc_tiny 7 10 1 scout}
    advances_to=SC_Shofixti_Scout_L2
    experience=16
    description= _ "A tiny, fast scout with a dart gun. Every Shofixti Scout carries a Glory Device: when all else fails, the pilot dives at an enemy ship and blows both apart."
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 5 3 ()}
    {SC_ATTACK glory_device {SC_WPN_GLORY_DEVICE} dart fire melee 24 1 (
        attack_weight=0
        defense_weight=0
        [specials]
            {SC_SPECIAL_GLORY_DEVICE}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Shofixti_Scout_L2 {SC_SHIP_SHOFIXTI_SCOUT_L2} sc_shofixti shofixti-scout 24 sc_tiny 7 20 2 scout}
    advances_to=SC_Shofixti_Scout_L3
    experience=32
    description= _ "A veteran Shofixti pilot with harder-hitting darts and a bigger Glory Device."
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 7 3 ()}
    {SC_ATTACK glory_device {SC_WPN_GLORY_DEVICE} dart fire melee 30 1 (
        attack_weight=0
        defense_weight=0
        [specials]
            {SC_SPECIAL_GLORY_DEVICE}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Shofixti_Scout_L3 {SC_SHIP_SHOFIXTI_SCOUT_L3} sc_shofixti shofixti-scout 30 sc_tiny 7 32 3 scout}
    advances_to=null
    experience=48
    description= _ "A Shofixti ace, impossible to pin down, who strikes from behind: its darts do double damage to a ship flanked by an ally. It carries the biggest Glory Device of all."
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 7 4 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK glory_device {SC_WPN_GLORY_DEVICE} dart fire melee 36 1 (
        attack_weight=0
        defense_weight=0
        [specials]
            {SC_SPECIAL_GLORY_DEVICE}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

#undef SC_GLORY_ANIM
