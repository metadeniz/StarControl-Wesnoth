#textdomain wesnoth-Star_Control_TC

# Played by the Glory Device (lua/sc.lua) just before the scout is removed.
#define SC_GLORY_ANIM
    [animation]
        apply_to=glory
        start_time=0
        {SC_FACING_FRAMES shofixti-scout (
            duration=560
            alpha=1~0:200,0:360
        )}
        glory_start_time=0
        [glory_frame]
            duration=560
            halo="halo/sc/glory-[1~8].png:70"
            auto_hflip=no
            auto_vflip=no
        [/glory_frame]
        sound_start_time=0
        [sound_frame]
            duration=1
            sound=sc/shofixti-glory.wav
        [/sound_frame]
    [/animation]
#enddef

[unit_type]
    {SC_SHIP SC_Shofixti_Scout {SC_SHIP_SHOFIXTI_SCOUT} sc_shofixti shofixti-scout 18 sc_tiny 7 10 1 scout}
    advances_to=SC_Shofixti_Scout_L2
    experience=16
    description= _ "A tiny, fast scout with a dart gun. Every Shofixti Scout carries a Glory Device: when all else fails, the pilot can blow the ship apart and take the neighbours along."
    [abilities]
        {SC_ABILITY_GLORY_DEVICE}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 5 3 ()}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Shofixti_Scout_L2 {SC_SHIP_SHOFIXTI_SCOUT_L2} sc_shofixti shofixti-scout 24 sc_tiny 7 20 2 scout}
    advances_to=SC_Shofixti_Scout_L3
    experience=32
    description= _ "A veteran Shofixti pilot strikes from behind: its darts do double damage to a ship flanked by an ally. Its Glory Device is bigger too."
    [abilities]
        {SC_ABILITY_GLORY_DEVICE}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 6 3 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Shofixti_Scout_L3 {SC_SHIP_SHOFIXTI_SCOUT_L3} sc_shofixti shofixti-scout 30 sc_tiny 7 32 3 scout}
    advances_to=null
    experience=48
    description= _ "A Shofixti ace, impossible to pin down, with the biggest Glory Device of all."
    [abilities]
        {SC_ABILITY_GLORY_DEVICE}
        {ABILITY_SKIRMISHER}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 7 4 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

#undef SC_GLORY_ANIM
