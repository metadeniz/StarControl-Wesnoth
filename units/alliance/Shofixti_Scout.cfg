#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Shofixti_Scout {SC_SHIP_SHOFIXTI_SCOUT} sc_shofixti shofixti-scout 18 sc_tiny 7 10 1 scout}
    description= _ "A tiny, fast scout with a dart gun. Every Shofixti Scout carries a Glory Device: when all else fails, the pilot can blow the ship apart and take the neighbours along."
    [abilities]
        {SC_ABILITY_GLORY_DEVICE}
    [/abilities]
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 5 3 ()}
    {SC_SHOT_ANIM shofixti-scout dart_gun dart shofixti-dart 120}
    # Played by the Glory Device (lua/sc.lua) just before the scout is removed.
    [animation]
        apply_to=glory
        start_time=0
        {SC_FACING_FRAMES shofixti-scout (
            duration=560
            alpha=1~0:200,0:360
        )}
        glory_start_time=0
        [glory_frame]
            duration=560
            halo="halo/sc/glory-[1~8].png:70"
            auto_hflip=no
            auto_vflip=no
        [/glory_frame]
        sound_start_time=0
        [sound_frame]
            duration=1
            sound=sc/shofixti-glory.wav
        [/sound_frame]
    [/animation]
[/unit_type]
