#textdomain wesnoth-Star_Control_TC

# The Glory Device: the scout dives at its target and explodes.
#define SC_GLORY_ANIM
    [attack_anim]
        [filter_attack]
            name=glory_device
        [/filter_attack]
        start_time=-400
        # dives in and fades out, then stays invisible while it explodes
        {SC_FACING_FRAMES shofixti-scout (
            duration=880
            offset=0~0.6:400,0.6:480
            alpha=1~0:400,0:480
        )}
        glory_start_time=-80
        [glory_frame]
            duration=560
            halo="halo/sc/glory-[1~8].png:70"
            offset=1.0
            auto_hflip=no
            auto_vflip=no
        [/glory_frame]
        sound_start_time=-80
        [sound_frame]
            duration=1
            sound=sc/shofixti-glory.wav
        [/sound_frame]
    [/attack_anim]
#enddef

[unit_type]
    {SC_SHIP SC_Shofixti_Scout {SC_SHIP_SHOFIXTI_SCOUT} sc_shofixti shofixti-scout-l1 12 sc_tiny 7 5 1 scout}
    advances_to=SC_Shofixti_Scout_L2
    experience=28
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=1
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=50
    [/defense]
    description= _ "A tiny, fast scout with a dart gun. Every Shofixti Scout carries a Glory Device: when all else fails, the pilot dives at an enemy ship and blows both apart."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 1 50 1 (_ "Shofixti pilots fly through anything, and their scouts are small enough to dodge the worst of it.")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 4 2 ()}
    {SC_ATTACK glory_device {SC_WPN_GLORY_DEVICE} dart fire melee 12 1 (
        attack_weight=1
        defense_weight=0
        [specials]
            {SC_SPECIAL_GLORY_DEVICE}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout-l1 dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Shofixti_Scout_L2 {SC_SHIP_SHOFIXTI_SCOUT_L2} sc_shofixti shofixti-scout-l2 16 sc_tiny 7 10 2 scout}
    advances_to=SC_Shofixti_Scout_L3
    experience=70
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=1
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=50
    [/defense]
    description= _ "A veteran Shofixti pilot with harder-hitting darts and a bigger Glory Device."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 1 50 1 (_ "Shofixti pilots fly through anything, and their scouts are small enough to dodge the worst of it.")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 5 3 ()}
    {SC_ATTACK glory_device {SC_WPN_GLORY_DEVICE} dart fire melee 15 1 (
        attack_weight=1
        defense_weight=0
        [specials]
            {SC_SPECIAL_GLORY_DEVICE}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout-l2 dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Shofixti_Scout_L3 {SC_SHIP_SHOFIXTI_SCOUT_L3} sc_shofixti shofixti-scout-l3 20 sc_tiny 7 16 3 scout}
    advances_to=null
    experience=84
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=1
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=50
    [/defense]
    description= _ "A Shofixti ace, impossible to pin down, who strikes from behind: its darts do double damage to a ship flanked by an ally. It carries the biggest Glory Device of all."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 1 50 1 (_ "Shofixti pilots fly through anything, and their scouts are small enough to dodge the worst of it.")}
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_AMBUSH sc_ambush_anr ({SC_HIDE_ASTEROIDS},{SC_HIDE_NEBULA},{SC_HIDE_RED}) (_ "asteroid fields and all nebulae")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK dart_gun (_ "dart gun") dart pierce melee 5 4 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK glory_device {SC_WPN_GLORY_DEVICE} dart fire melee 18 1 (
        attack_weight=1
        defense_weight=0
        [specials]
            {SC_SPECIAL_GLORY_DEVICE}
        [/specials]
    )}
    {SC_SHOT_ANIM shofixti-scout-l3 dart_gun dart shofixti-dart 120}
    {SC_GLORY_ANIM}
[/unit_type]

#undef SC_GLORY_ANIM
