    {SC_BEAM_ANIM arilou-skiff-l2 auto_laser laser [1,1,0,2,2,0,1,1] arilou-laser-burst 240 ()}
    {SC_BEAM_ANIM arilou-skiff-l2 long_laser laser [1,1,0,2,2,0,1,1] arilou-laser-burst 240 ()}
[/unit_type]

