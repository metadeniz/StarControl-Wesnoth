#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Arilou_Skiff {SC_SHIP_ARILOU_SKIFF} sc_arilou arilou-skiff-l1 22 sc_tiny 7 15 1 scout}
    advances_to=SC_Arilou_Skiff_L2
    experience=50
    # badlands runner (see SC_ABILITY_BADLANDS_RUNNER)
    [movement_costs]
        ionstorm=1
        lightstorm=1
    [/movement_costs]
    [defense]
        ionstorm=50
    [/defense]
    description= _ "The mysterious Arilou fly tiny saucers that ignore inertia. Their auto-aiming laser rarely misses, they slip past enemy lines at will, and they can hyperjump from one friendly planet to another."
    [abilities]
        {SC_ABILITY_BADLANDS_RUNNER 1 50 1 (_ "The Arilou slip half outside normal space; the plasma barely touches them.")}
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_HYPERJUMP}
        {SC_ABILITY_AMBUSH sc_ambush_bad ({SC_HIDE_BADLANDS}) (_ "the badlands")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK auto_laser (_ "auto-aiming laser") laser-gold arcane melee 6 3 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {SC_SPECIAL_OUT_OF_PHASE}
        [/specials]
    )}
    {SC_BEAM_ANIM arilou-skiff-l1 auto_laser laser [1,1,0,2,2,0,1,1] arilou-laser-burst 240 ()}
[/unit_type]

[unit_type]
