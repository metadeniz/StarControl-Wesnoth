#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Arilou_Skiff {SC_SHIP_ARILOU_SKIFF} sc_arilou arilou-skiff 22 sc_tiny 7 15 1 scout}
    advances_to=SC_Arilou_Skiff_L2
    experience=20
    description= _ "The mysterious Arilou fly tiny saucers that ignore inertia. Their auto-aiming laser rarely misses, they slip past enemy lines at will, and they can hyperjump from one friendly planet to another."
    [abilities]
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_HYPERJUMP}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK auto_laser (_ "auto-aiming laser") laser-gold arcane melee 6 3 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    )}
    {SC_SHOT_ANIM arilou-skiff auto_laser laser-gold arilou-laser 120}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Arilou_Skiff_L2 {SC_SHIP_ARILOU_SKIFF_L2} sc_arilou arilou-skiff 28 sc_tiny 7 28 2 scout}
    advances_to=SC_Arilou_Skiff_L3
    experience=40
    description= _ "A Skiff whose laser has learned to reach further: it can now also fire at range."
    [abilities]
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_HYPERJUMP}
        {SC_ABILITY_AMBUSH sc_ambush_nad ({SC_HIDE_NEBULA},{SC_HIDE_ASTEROIDS},{SC_HIDE_DUST}) (_ "green nebulae, asteroid fields and dust clouds")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK auto_laser (_ "auto-aiming laser") laser-gold arcane melee 6 3 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK long_laser (_ "long-range laser") laser-gold arcane ranged 5 2 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    )}
    {SC_SHOT_ANIM arilou-skiff auto_laser laser-gold arilou-laser 120}
    {SC_SHOT_ANIM arilou-skiff long_laser laser-gold arilou-laser 220}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Arilou_Skiff_L3 {SC_SHIP_ARILOU_SKIFF_L3} sc_arilou arilou-skiff 34 sc_tiny 7 42 3 scout}
    advances_to=null
    experience=60
    description= _ "An elite Arilou Skiff. Inside a nebula it simply vanishes from enemy sensors."
    [abilities]
        {ABILITY_SKIRMISHER}
        {SC_ABILITY_HYPERJUMP}
        {SC_ABILITY_AMBUSH sc_ambush_nad ({SC_HIDE_NEBULA},{SC_HIDE_ASTEROIDS},{SC_HIDE_DUST}) (_ "green nebulae, asteroid fields and dust clouds")}
    [/abilities]
    {SC_HULL_TINY}
    {SC_ATTACK auto_laser (_ "auto-aiming laser") laser-gold arcane melee 7 4 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK long_laser (_ "long-range laser") laser-gold arcane ranged 6 2 (
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    )}
    {SC_SHOT_ANIM arilou-skiff auto_laser laser-gold arilou-laser 120}
    {SC_SHOT_ANIM arilou-skiff long_laser laser-gold arilou-laser 220}
[/unit_type]
