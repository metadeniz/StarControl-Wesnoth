#textdomain wesnoth-Star_Control_TC
# Leader only: the Alliance's default leader. A station has no front, so
# every facing uses the same picture.
[unit_type]
    {SC_SHIP SC_Alliance_Starbase {SC_SHIP_ALLIANCE_STARBASE} sc_earthling alliance-starbase 110 sc_large 4 60 3 archer}
    advances_to=null
    experience=150
    description= _ "A starbase of the Alliance of Free Stars, built by Earthlings with help from every member race: a habitat wheel round a central hub, crawling between the battle lines on its tugs. Its dry docks repair the ships beside it and its shield generators cover them, point-defense lasers sweep away Ur-Quan fighters, and its missile batteries fire homing nukes. Alliance ships fight harder in its presence."
    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_HEALS}
        {SC_ABILITY_DEFENSE_GRID}
        {SC_ABILITY_POINT_DEFENSE}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_ATTACK point_defense (_ "point-defense laser") laser-white arcane melee 6 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK nuclear_missile (_ "missile battery") nuke pierce ranged 9 3 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_FIXED_ZAP_ANIM alliance-starbase point_defense zap [1,2,1] earthling-pd 120}
    {SC_SHOT_BOOM_ANIM alliance-starbase nuclear_missile nuke earthling-nuke 300 "halo/sc/nuke-boom-[1~9].png:50" 450}
[/unit_type]
