[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm_L3 {SC_SHIP_MMRNMHRM_XFORM_L3} sc_mmrnmhrm mmrnmhrm-xform 56 sc_medium 4 50 3 fighter}
    advances_to=null
    experience=69
    description= _ "An elite X-Form in its X-Wing shape. Repair robots patch its hull between battles, and its lasers fire five times. It can still transform."
