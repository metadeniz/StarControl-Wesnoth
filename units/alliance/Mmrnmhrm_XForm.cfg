#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm {SC_SHIP_MMRNMHRM_XFORM} sc_mmrnmhrm mmrnmhrm-xform 36 sc_medium 4 19 1 fighter}
    description= _ "The robotic Mmrnmhrm build one ship in two shapes. As an X-Wing it is a slow brawler with short-range twin lasers; it can reshape itself into the fast, torpedo-firing Y-Wing and back again."
    [abilities]
        {SC_ABILITY_TRANSFORM}
    [/abilities]
    {SC_ATTACK twin_lasers (_ "twin lasers") laser-red arcane melee 6 4 ()}
    {SC_SHOT_ANIM mmrnmhrm-xform twin_lasers laser-red mmrnmhrm-laser 120}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_YWing {SC_SHIP_MMRNMHRM_YWING} sc_mmrnmhrm mmrnmhrm-ywing 36 sc_small 8 19 1 scout}
    description= _ "The Mmrnmhrm X-Form in its Y-Wing shape: very fast, firing homing torpedoes, but with no close-range weapon. It can change into the X-Wing."
    [abilities]
        {SC_ABILITY_TRANSFORM}
    [/abilities]
    {SC_ATTACK torpedoes (_ "homing torpedoes") torpedo pierce ranged 7 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM mmrnmhrm-ywing torpedoes torpedo mmrnmhrm-torpedo 280}
[/unit_type]
