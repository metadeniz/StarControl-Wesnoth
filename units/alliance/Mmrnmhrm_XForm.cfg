#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm {SC_SHIP_MMRNMHRM_XFORM} sc_mmrnmhrm mmrnmhrm-xform 36 sc_medium 4 19 1 fighter}
    advances_to=SC_Mmrnmhrm_XForm_L2
    experience=23
    description= _ "The robotic Mmrnmhrm build one ship, the X-Form, in two shapes. As an X-Wing it is a slow brawler with short-range twin lasers; it can reshape itself into the fast, torpedo-firing Y-Wing and back again."
    [abilities]
        {SC_ABILITY_TRANSFORM}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK twin_lasers (_ "twin lasers") laser-red arcane melee 6 4 ()}
    {SC_SHOT_ANIM mmrnmhrm-xform twin_lasers laser-red mmrnmhrm-laser 120}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm_L2 {SC_SHIP_MMRNMHRM_XFORM_L2} sc_mmrnmhrm mmrnmhrm-xform 46 sc_medium 4 34 2 fighter}
    advances_to=SC_Mmrnmhrm_XForm_L3
    experience=46
    description= _ "A veteran X-Form in its X-Wing shape, its lasers tuned for more power. It can still transform."
