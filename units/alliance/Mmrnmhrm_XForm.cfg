#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm {SC_SHIP_MMRNMHRM_XFORM} sc_mmrnmhrm mmrnmhrm-xform-l1 36 sc_medium 4 19 1 fighter}
    advances_to=SC_Mmrnmhrm_XForm_L2
    experience=30
    description= _ "The robotic Mmrnmhrm build one ship, the X-Form, in two shapes. As an X-Wing it is a slow brawler with short-range twin lasers; it can reshape itself into the fast, torpedo-firing Y-Wing and back again. In X-Wing shape its repair robots also patch up the ships beside it."
    [abilities]
        {SC_ABILITY_TRANSFORM}
        {ABILITY_HEALS}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK twin_lasers (_ "twin lasers") laser-red arcane melee 6 4 ()}
    {SC_SHOT_ANIM mmrnmhrm-xform-l1 twin_lasers laser-red mmrnmhrm-laser 120}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm_L2 {SC_SHIP_MMRNMHRM_XFORM_L2} sc_mmrnmhrm mmrnmhrm-xform-l2 46 sc_medium 4 34 2 fighter}
    advances_to=SC_Mmrnmhrm_XForm_L3
    experience=60
    description= _ "A veteran X-Form in its X-Wing shape, its lasers tuned for more power. It can still transform."
    [abilities]
        {SC_ABILITY_TRANSFORM}
        {ABILITY_HEALS}
        {SC_ABILITY_AMBUSH sc_ambush_ast ({SC_HIDE_ASTEROIDS}) (_ "asteroid fields (as an X-Wing)")}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK twin_lasers (_ "twin lasers") laser-red arcane melee 8 4 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_SHOT_ANIM mmrnmhrm-xform-l2 twin_lasers laser-red mmrnmhrm-laser 120}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_XForm_L3 {SC_SHIP_MMRNMHRM_XFORM_L3} sc_mmrnmhrm mmrnmhrm-xform-l3 56 sc_medium 4 50 3 fighter}
    advances_to=null
    experience=90
    description= _ "An elite X-Form in its X-Wing shape. Repair robots patch its hull between battles, and its lasers fire five times. It can still transform."
    [abilities]
        {SC_ABILITY_TRANSFORM}
        {ABILITY_HEALS}
        {SC_ABILITY_SELF_REPAIR}
        {SC_ABILITY_AMBUSH sc_ambush_ast ({SC_HIDE_ASTEROIDS}) (_ "asteroid fields (as an X-Wing)")}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK twin_lasers (_ "twin lasers") laser-red arcane melee 9 5 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_SHOT_ANIM mmrnmhrm-xform-l3 twin_lasers laser-red mmrnmhrm-laser 120}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_YWing {SC_SHIP_MMRNMHRM_YWING} sc_mmrnmhrm mmrnmhrm-ywing-l1 36 sc_small 8 19 1 scout}
    advances_to=SC_Mmrnmhrm_YWing_L2
    experience=30
    description= _ "The Mmrnmhrm X-Form in its Y-Wing shape: very fast, firing homing torpedoes, but with no close-range weapon. It can change into the X-Wing."
    [abilities]
        {SC_ABILITY_TRANSFORM}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK torpedoes (_ "homing torpedoes") torpedo pierce ranged 7 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM mmrnmhrm-ywing-l1 torpedoes torpedo mmrnmhrm-torpedo 280}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_YWing_L2 {SC_SHIP_MMRNMHRM_YWING_L2} sc_mmrnmhrm mmrnmhrm-ywing-l2 46 sc_small 8 34 2 scout}
    advances_to=SC_Mmrnmhrm_YWing_L3
    experience=60
    description= _ "A veteran X-Form in its Y-Wing shape, firing three torpedoes per salvo. It can still transform."
    [abilities]
        {SC_ABILITY_TRANSFORM}
        {SC_ABILITY_AMBUSH sc_ambush_nd ({SC_HIDE_NEBULA},{SC_HIDE_DUST}) (_ "green nebulae and dust clouds (as a Y-Wing)")}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK torpedoes (_ "homing torpedoes") torpedo pierce ranged 8 3 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM mmrnmhrm-ywing-l2 torpedoes torpedo mmrnmhrm-torpedo 280}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Mmrnmhrm_YWing_L3 {SC_SHIP_MMRNMHRM_YWING_L3} sc_mmrnmhrm mmrnmhrm-ywing-l3 56 sc_small 8 50 3 scout}
