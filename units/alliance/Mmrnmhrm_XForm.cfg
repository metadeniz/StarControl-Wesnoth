    [abilities]
        {SC_ABILITY_TRANSFORM}
        {SC_ABILITY_SELF_REPAIR}
        {SC_ABILITY_AMBUSH sc_ambush_nd ({SC_HIDE_NEBULA},{SC_HIDE_DUST}) (_ "green nebulae and dust clouds (as a Y-Wing)")}
    [/abilities]
    {SC_HULL_SMALL}
    {SC_ATTACK torpedoes (_ "homing torpedoes") torpedo pierce ranged 10 3 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM mmrnmhrm-ywing-l3 torpedoes torpedo mmrnmhrm-torpedo 280}
