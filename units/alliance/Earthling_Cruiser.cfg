#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Earthling_Cruiser {SC_SHIP_EARTHLING_CRUISER} sc_earthling earthling-cruiser-l1 28 sc_medium 4 11 1 archer}
    advances_to=SC_Earthling_Cruiser_L2
    experience=28
    description= _ "Humanity's answer to the Ur-Quan: a cheap, slow cruiser built around long-range nuclear missiles that steer themselves onto their target. Point-defense lasers sweep away anything that gets too close."
    [abilities]
        {SC_ABILITY_POINT_DEFENSE}
    [/abilities]
    {SC_HULL_MEDIUM}
    {SC_ATTACK point_defense (_ "point-defense laser") laser-white arcane melee 3 3 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK nuclear_missile (_ "nuclear missile") nuke pierce ranged 9 2 (
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    )}
    {SC_SHOT_ANIM earthling-cruiser-l1 point_defense laser-white earthling-pd 120}
    {SC_SHOT_ANIM earthling-cruiser-l1 nuclear_missile nuke earthling-nuke 300}
[/unit_type]

