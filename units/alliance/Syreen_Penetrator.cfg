#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Syreen_Penetrator {SC_SHIP_SYREEN_PENETRATOR} sc_syreen syreen-penetrator-l1 64 sc_small 6 12 1 (mixed fighter)}
    advances_to=SC_Syreen_Penetrator_L2
    experience=28
    description= _ "A slim, quick ship that throws a long-range particle-beam dagger. Its real weapon is the short-range Syreen song, a single verse that either lures an enemy's crew across to join the Syreen or falls on deaf ears. A softer, entrancing hum leaves the crew too dazed to fly well. The Penetrator has room for a crew as big as an Ur-Quan Dreadnought's, but always leaves port with only a few aboard and fills the rest with lured crew."
    {SC_HULL_SMALL}
    {SC_ATTACK particle_dagger (_ "particle dagger") dagger blade ranged 5 3 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK syreen_song {SC_WPN_SYREEN_SONG} laser-violet arcane melee 10 1 (
        [specials]
            {SC_SPECIAL_SYREEN_SONG}
            {SC_SPECIAL_SYREEN_SONG_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK syreen_trance {SC_WPN_SYREEN_TRANCE} laser-violet arcane melee 2 2 (
        [specials]
            {WEAPON_SPECIAL_SLOW}
            {SC_SPECIAL_SYREEN_HUM_BACKSTAB}
        [/specials]
    )}
    {SC_SHOT_ANIM syreen-penetrator-l1 particle_dagger dagger syreen-dagger 260}
    {SC_SHOT_ANIM syreen-penetrator-l1 syreen_song laser-violet syreen-song 200}
    {SC_SHOT_ANIM syreen-penetrator-l1 syreen_trance laser-violet syreen-song 200}
[/unit_type]

