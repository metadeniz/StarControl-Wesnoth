#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Syreen_Penetrator {SC_SHIP_SYREEN_PENETRATOR} sc_syreen syreen-penetrator 28 sc_small 6 14 1 (mixed fighter)}
    advances_to=SC_Syreen_Penetrator_L2
    experience=22
    description= _ "A slim, quick ship that throws a long-range particle-beam dagger. Its real weapon is the short-range Syreen song: enemy crewmen hear it, abandon their posts and float across to join the Syreen."
    {SC_HULL_SMALL}
    {SC_ATTACK particle_dagger (_ "particle dagger") dagger blade ranged 5 3 (
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    )}
    {SC_ATTACK syreen_song {SC_WPN_SYREEN_SONG} laser-violet arcane melee 4 2 (
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    )}
    {SC_SHOT_ANIM syreen-penetrator particle_dagger dagger syreen-dagger 260}
    {SC_SHOT_ANIM syreen-penetrator syreen_song laser-violet syreen-song 200}
[/unit_type]

