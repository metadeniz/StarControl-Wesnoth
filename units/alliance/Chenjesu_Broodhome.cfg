#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Chenjesu_Broodhome {SC_SHIP_CHENJESU_BROODHOME} sc_chenjesu chenjesu-broodhome-l1 62 sc_large 3 26 1 archer}
    advances_to=SC_Chenjesu_Broodhome_L2
    experience=40
    # Red nebula: at home in the heat (heat-proof crystal).
    [movement_costs]
        rednebula=2
    [/movement_costs]
    [defense]
        rednebula=50
    [/defense]
    description= _ "A living crystal fortress. The Broodhome hurls photon crystals, near and far, that shatter into razor fragments, and sets loose its DOGIs — little energy-eating drones that leave enemy ships crawling. Its crystal resonance mends friendly hulls around it and purges them of acid and poison."
    [abilities]
        {ABILITY_CURES}
        {SC_RED_AFFINITY 2 50 (_ "Chenjesu crystal shrugs off the heat.")}
        {SC_ABILITY_AMBUSH sc_ambush_red ({SC_HIDE_RED}) (_ "red nebulae")}
    [/abilities]
    {SC_HULL_LARGE}
    {SC_TRAIT_LIVING_CRYSTAL}
    {SC_ATTACK photon_crystal_close (_ "photon crystal") crystal impact melee 6 2 ()}
    {SC_ATTACK photon_crystal (_ "photon crystal") crystal impact ranged 10 3 ()}
    {SC_ATTACK dogi {SC_WPN_DOGI} dogi cold ranged 4 2 (
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    )}
    [resistance]
        impact=80
        fire=90
        pierce=90
    [/resistance]
    {SC_SHOT_ANIM chenjesu-broodhome-l1 photon_crystal crystal chenjesu-crystal 260}
    {SC_SHOT_ANIM chenjesu-broodhome-l1 photon_crystal_close crystal chenjesu-crystal 160}
    {SC_SHOT_ANIM chenjesu-broodhome-l1 dogi dogi chenjesu-dogi 400}
[/unit_type]

