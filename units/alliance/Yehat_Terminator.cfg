#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Yehat_Terminator {SC_SHIP_YEHAT_TERMINATOR} sc_yehat yehat-terminator-l1 36 sc_medium 5 20 1 fighter}
    advances_to=SC_Yehat_Terminator_L2
    experience=32
    description= _ "The proud Yehat fly agile warships armed with rapid-fire twin pulse cannons. The Terminator is heavily armored, and a force shield flares up the moment it comes under fire."
    [abilities]
        {SC_ABILITY_FORCE_SHIELD}
    [/abilities]
    {SC_HULL_MEDIUM}
    # armored hull (resistance: 100 = none, 60 = 40% less damage)
    [resistance]
        blade=60
        pierce=70
        impact=80
        arcane=90
    [/resistance]
    {SC_ATTACK pulse_cannons (_ "pulse cannons") pulse fire melee 5 5 ()}
    {SC_SHOT_ANIM yehat-terminator-l1 pulse_cannons pulse yehat-pulse 140}
[/unit_type]

