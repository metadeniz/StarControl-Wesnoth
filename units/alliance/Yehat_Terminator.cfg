#textdomain wesnoth-Star_Control_TC
[unit_type]
    {SC_SHIP SC_Yehat_Terminator {SC_SHIP_YEHAT_TERMINATOR} sc_yehat yehat-terminator-l1 36 sc_medium 5 20 1 fighter}
    advances_to=SC_Yehat_Terminator_L2
    experience=40
    description= _ "The proud Yehat fly agile warships armed with rapid-fire twin pulse cannons, and rail cannons whose solid slugs punch through hulls that shrug off heat, like the Mycon Podship. The Terminator is heavily armored. Its force shield holds while the pulse cannons fire, but the heavy rail cannons draw so much power that the shield drops while they fire."
    [abilities]
        {SC_ABILITY_FORCE_SHIELD}
    [/abilities]
    {SC_HULL_MEDIUM}
    # armored hull (resistance: 100 = none, 60 = 40% less damage)
    [resistance]
        blade=60
        pierce=70
        impact=80
        arcane=90
    [/resistance]
    {SC_ATTACK pulse_cannons (_ "Attack with Shields") pulse fire melee 4 5 ()}
    {SC_ATTACK rail_cannons (_ "Attack Only") mass-driver pierce melee 9 3 ()}
    {SC_SHIELDED_SHOT_ANIM yehat-terminator-l1 pulse_cannons pulse yehat-pulse 140 yehat-shield}
    {SC_SHOT_ANIM yehat-terminator-l1 rail_cannons mass-driver yehat-pulse 140}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Yehat_Terminator_L2 {SC_SHIP_YEHAT_TERMINATOR_L2} sc_yehat yehat-terminator-l2 46 sc_medium 5 36 2 fighter}
    advances_to=SC_Yehat_Terminator_L3
    experience=100
    description= _ "A Terminator flown by a blooded Yehat pilot: its pulse cannons fire six times, its rail cannons four."
    [abilities]
        {SC_ABILITY_FORCE_SHIELD}
    [/abilities]
    {SC_HULL_MEDIUM}
    # armored hull (resistance: 100 = none, 60 = 40% less damage)
    [resistance]
        blade=60
        pierce=70
        impact=80
        arcane=90
    [/resistance]
    {SC_ATTACK pulse_cannons (_ "Attack with Shields") pulse fire melee 5 6 ()}
    {SC_ATTACK rail_cannons (_ "Attack Only") mass-driver pierce melee 10 4 ()}
    {SC_SHIELDED_SHOT_ANIM yehat-terminator-l2 pulse_cannons pulse yehat-pulse 140 yehat-shield}
    {SC_SHOT_ANIM yehat-terminator-l2 rail_cannons mass-driver yehat-pulse 140}
[/unit_type]

[unit_type]
    {SC_SHIP SC_Yehat_Terminator_L3 {SC_SHIP_YEHAT_TERMINATOR_L3} sc_yehat yehat-terminator-l3 56 sc_medium 5 52 3 fighter}
    advances_to=null
    experience=120
    description= _ "A Terminator of the Queen's own guard. Its pilot's reflexes are so fast that it always fires first."
    [abilities]
        {SC_ABILITY_FORCE_SHIELD}
    [/abilities]
    {SC_HULL_MEDIUM}
    # armored hull (resistance: 100 = none, 60 = 40% less damage)
    [resistance]
        blade=60
        pierce=70
        impact=80
        arcane=90
    [/resistance]
    {SC_ATTACK pulse_cannons (_ "Attack with Shields") pulse fire melee 6 6 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_ATTACK rail_cannons (_ "Attack Only") mass-driver pierce melee 12 4 (
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    )}
    {SC_SHIELDED_SHOT_ANIM yehat-terminator-l3 pulse_cannons pulse yehat-pulse 140 yehat-shield}
    {SC_SHOT_ANIM yehat-terminator-l3 rail_cannons mass-driver yehat-pulse 140}
[/unit_type]
